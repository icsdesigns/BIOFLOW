}

/* ════════ EXPORTACIÓN ════════ */
function stLoadImg(src){return new Promise(res=>{if(!src)return res(null);const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=src;});}
function stFileName(e,ext){
  const base=safeFile(stTitle(e).replace(/[()]/g,'').trim()||'estrategia');
  return 'estrategia_'+base+'.'+ext;
}
/* Alto que se le concede al bloque de gating: crece con el número de capturas,
   porque es el contenido al que se le da prioridad. */
function stAltoGating(n){return 560+Math.min(n,10)*26;}
const ST_RATIO=1;      // alto/ancho de cada captura: cuadrada, como un dot plot
const ST_HUECO_FILA=34; // espacio entre filas, donde cabe la flecha de bajada
/* Elige el reparto en filas que deja la captura lo más ancha posible. */
function stReticula(n,anchoUtil,flecha,ejeY,etiqX){
  if(n<=0)return {porFila:1,filas:0,celda:anchoUtil,anchoImg:0,altoImg:0};
  const maxH=stAltoGating(n);
  let mejor=null;
  for(let pf=1;pf<=Math.min(n,6);pf++){
    const filas=Math.ceil(n/pf);
    const celda=(anchoUtil-flecha*(pf-1))/pf;
    const disponible=(maxH-(filas-1)*ST_HUECO_FILA)/filas-etiqX-10;
    if(disponible<80)continue;
    /* La captura se ciñe a la vez al ancho de la celda y al alto de la fila. */
    const anchoImg=Math.floor(Math.min(celda-ejeY,disponible/ST_RATIO));
    if(anchoImg<110)continue;
    const altoImg=Math.round(anchoImg*ST_RATIO);
    if(!mejor||anchoImg>mejor.anchoImg)mejor={porFila:pf,filas,celda,anchoImg,altoImg};
  }
  if(!mejor){
    const pf=Math.min(n,5),filas=Math.ceil(n/pf),celda=(anchoUtil-flecha*(pf-1))/pf;
    const anchoImg=Math.max(80,Math.floor(celda-ejeY));
    mejor={porFila:pf,filas,celda,anchoImg,altoImg:Math.round(anchoImg*ST_RATIO)};
  }
  return mejor;
}

/* ── PNG: se dibuja en un lienzo, con el alto ajustado al contenido ── */
async function stExportPng(id){
  const e=stGet(id);if(!e)return;
  toast('Generando PNG a '+stEscala()+'×…',{icon:'image',duration:3000});
  try{
    const lienzo=await stDibujar(e,stEscala());
    const blob=await new Promise(r=>lienzo.toBlob(r,'image/png'));
    if(!blob)throw new Error('sin blob');
    const bytes=new Uint8Array(await blob.arrayBuffer());
    await saveExportBytes(stFileName(e,'png'),bytes,'image/png');
  }catch(err){
    try{console.error(err);}catch(_){}
    toast('No se pudo generar el PNG',{icon:'alert'});
  }
}
async function stDibujar(e,escala){
  const P=ST_EXP;
  const W=1400;                      // ancho en puntos
  const M=46;                        // margen
  const anchoUtil=W-M*2;

  /* ── Medición previa, para saber el alto total ── */
  const pasos=e.steps.filter(p=>p.img||p.x||p.y);
  const imgs=await Promise.all(pasos.map(p=>stLoadImg(imgSrc(p.img))));
  /* El hueco de cada eje sólo se reserva si alguna captura lo usa. */
  const hayY=pasos.some(p=>(p.y||'').trim());
  const hayX=pasos.some(p=>(p.x||'').trim());
  const flecha=34, ejeY=hayY?32:0, etiqX=hayX?32:0;
  const rej=stReticula(pasos.length,anchoUtil,flecha,ejeY,etiqX);
  const porFila=rej.porFila, altoImg=rej.altoImg, filas=rej.filas;
  const celda=rej.anchoImg+ejeY;
  const altoCelda=altoImg+etiqX+10;
  /* El bloque entero se centra; las filas comparten retícula. */
  const anchoFila=porFila*celda+flecha*(porFila-1);
  const sangrado=Math.max(0,(anchoUtil-anchoFila)/2);

  const cabH=104;
  const gatingH=pasos.length?(40+filas*altoCelda+(filas-1)*ST_HUECO_FILA+22):0;

  /* Columna izquierda: tabla. Derecha: fenotipo y porcentaje. */
  const colIzq=Math.round(anchoUtil*0.54), colDer=anchoUtil-colIzq-24;
  const filaAlt=30, tablaCab=34;
  const dosCol=e.panel.length>10;
  const filasPorCol=dosCol?Math.ceil(e.panel.length/2):Math.max(1,e.panel.length);
  const tablaH=40+tablaCab+filasPorCol*filaAlt+18;

  /* El texto del fenotipo se mide de verdad para no cortarlo. */
  const medidor=document.createElement('canvas').getContext('2d');
  medidor.font='700 27px "Plus Jakarta Sans","Segoe UI",system-ui,sans-serif';
  const lineasFeno=stPartir(medidor,e.phenotype||'—',colDer-52);
  const fenoH=40+Math.max(60,lineasFeno.length*36+26);
  const pctH=e.pct?136:0;   // título de sección (34) + recuadro (84) + aire
  medidor.font='400 17px "Plus Jakarta Sans","Segoe UI",system-ui,sans-serif';
  const lineasNotas=e.notes?stPartir(medidor,e.notes,anchoUtil-40):[];
  const notasH=lineasNotas.length?(28+lineasNotas.length*24+18):0;

  const derH=fenoH+(pctH?pctH+18:0);
  const bloqueH=Math.max(tablaH,derH);
  const H=cabH+(gatingH?gatingH+22:12)+bloqueH+(notasH?notasH+18:0)+M*2-10;

  /* ── Dibujo ── */
  const cv=document.createElement('canvas');
  cv.width=Math.round(W*escala);cv.height=Math.round(H*escala);
  const g=cv.getContext('2d');
  g.imageSmoothingEnabled=true;
  g.imageSmoothingQuality='high';
  g.scale(escala,escala);
  g.textBaseline='top';
  g.fillStyle=P.papel;g.fillRect(0,0,W,H);

  /* Cabecera: banda con degradado de marca y el título dentro */
  const grad=g.createLinearGradient(M,0,W-M,0);
  grad.addColorStop(0,P.marca2);grad.addColorStop(1,P.marca1);
  stRect(g,M,M,anchoUtil,66,16);g.fillStyle=grad;g.fill();
  g.fillStyle='#FFFFFF';
  g.font='800 32px "Plus Jakarta Sans","Segoe UI",system-ui,sans-serif';
  g.textAlign='left';
  g.fillText(stTitle(e),M+26,M+16);
  g.font='600 15px "Plus Jakarta Sans","Segoe UI",system-ui,sans-serif';
  g.globalAlpha=.9;
  g.textAlign='right';
  g.fillText('Estrategia de gating · '+new Date().toLocaleDateString('es-ES'),W-M-26,M+24);
  g.globalAlpha=1;g.textAlign='left';

  let y=M+cabH-14;

  /* Sección de gating */
  if(pasos.length){
    stTituloSeccion(g,'ESTRATEGIA DE GATING',M,y,anchoUtil);
    y+=34;
    pasos.forEach((p,i)=>{
      const fila=Math.floor(i/porFila);
      const enEstaFila=Math.min(porFila,pasos.length-fila*porFila);
      const haciaIzquierda=(fila%2)===1;          // las filas pares van al revés
      const orden=i%porFila;                       // posición dentro del recorrido
      const col=haciaIzquierda?(porFila-1-orden):orden;
      const x=M+sangrado+col*(celda+flecha);
      const cy=y+fila*(altoCelda+ST_HUECO_FILA);
      stCelda(g,p,imgs[i],x,cy,celda,altoImg,ejeY,etiqX,i+1,pasos.length);
      if(i<pasos.length-1){
        if(orden<enEstaFila-1){
          /* Siguiente paso en la misma fila: flecha en el hueco, apuntando
             hacia donde avanza el recorrido. */
          const xh=haciaIzquierda?(x-flecha/2):(x+celda+flecha/2);
          stFlecha(g,xh,cy+altoImg/2,P.marca2,haciaIzquierda?-1:1);
        }else{
          /* Último de la fila: se baja a la siguiente por este mismo lado. */
          stFlechaAbajo(g,x+ejeY+(celda-ejeY)/2,cy+altoCelda+ST_HUECO_FILA/2,P.marca2);
        }
      }
    });
    y+=filas*altoCelda+(filas-1)*ST_HUECO_FILA+22;
  }else{
    y+=12;
  }

  /* Mix de anticuerpos */
  stTituloSeccion(g,'MIX DE ANTICUERPOS',M,y,colIzq);
  if(dosCol){
    const hueco=16, sub=(colIzq-hueco)/2, mitad=Math.ceil(e.panel.length/2);
    stTabla(g,e.panel.slice(0,mitad),M,y+34,sub,tablaCab,filaAlt);
    stTabla(g,e.panel.slice(mitad),M+sub+hueco,y+34,sub,tablaCab,filaAlt);
  }else{
    stTabla(g,e.panel,M,y+34,colIzq,tablaCab,filaAlt);
  }

  /* Fenotipo y porcentaje */
  const xd=M+colIzq+24;
  stTituloSeccion(g,'FENOTIPO DE LA POBLACIÓN',xd,y,colDer);
  const yFeno=y+34;
  stRect(g,xd,yFeno,colDer,fenoH-40,14);
  g.fillStyle=P.panel;g.fill();
  g.strokeStyle=P.filete;g.lineWidth=1;g.stroke();
  g.fillStyle=P.marca3;
  g.font='700 27px "Plus Jakarta Sans","Segoe UI",system-ui,sans-serif';
  lineasFeno.forEach((l,i)=>g.fillText(l,xd+26,yFeno+20+i*36));

  if(e.pct){
    /* Mismo título de sección que «Fenotipo de la población». */
    const yt=yFeno+(fenoH-40)+22;
    stTituloSeccion(g,'% APROXIMADO',xd,yt,colDer);
    const yp=yt+34;
    stRect(g,xd,yp,colDer,84,14);
    const gp=g.createLinearGradient(xd,yp,xd+colDer,yp);
    gp.addColorStop(0,P.marca2);gp.addColorStop(1,P.marca1);
    g.fillStyle=gp;g.fill();
    g.fillStyle='#FFFFFF';
    g.font='800 44px "Plus Jakarta Sans","Segoe UI",system-ui,sans-serif';
    g.fillText(e.pct+(/%$/.test(e.pct)?'':' %'),xd+26,yp+18);
  }

  /* Notas al pie */
  if(lineasNotas.length){
    const yn=M+cabH-14+(gatingH?gatingH+22:12)+bloqueH+18;
    g.fillStyle=P.tinta2;
    g.font='400 17px "Plus Jakarta Sans","Segoe UI",system-ui,sans-serif';
    lineasNotas.forEach((l,i)=>g.fillText(l,M,yn+i*24));
  }
  return cv;
}
function stRect(g,x,y,w,h,r){
  g.beginPath();
  if(g.roundRect)g.roundRect(x,y,w,h,r);
  else{g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
}
function stTituloSeccion(g,txt,x,y,w){
  const P=ST_EXP;
  g.fillStyle=P.marca2;
  g.font='800 14px "Plus Jakarta Sans","Segoe UI",system-ui,sans-serif';
  g.fillText(txt,x,y+4);
  const anchoTxt=g.measureText(txt).width;
  g.strokeStyle=P.filete;g.lineWidth=1;
  g.beginPath();g.moveTo(x+anchoTxt+12,y+11.5);g.lineTo(x+w,y+11.5);g.stroke();
}
function stPartir(g,texto,maxW){
  const palabras=String(texto||'').replace(/\s+/g,' ').trim().split(' ');
  if(!palabras[0])return [''];
  const out=[];let linea='';
  palabras.forEach(p=>{
    const t=linea?linea+' '+p:p;
    if(g.measureText(t).width>maxW&&linea){out.push(linea);linea=p;}
    else linea=t;
  });
  if(linea)out.push(linea);
  return out;
}
/* Una celda del gating: etiqueta del eje Y girada, la imagen y la del eje X. */
function stCelda(g,p,img,x,y,w,hImg,ejeY,etiqX,num,total){
  const P=ST_EXP;
  const xImg=x+ejeY, wImg=w-ejeY;
  stRect(g,xImg,y,wImg,hImg,12);
  g.fillStyle=P.panel2;g.fill();
  g.strokeStyle=P.filete;g.lineWidth=1;g.stroke();
  if(img){
    g.save();
    stRect(g,xImg+1,y+1,wImg-2,hImg-2,11);g.clip();
    /* La imagen se ajusta dentro sin deformarse. */
    const f=Math.min((wImg-16)/img.naturalWidth,(hImg-16)/img.naturalHeight);
    const iw=img.naturalWidth*f, ih=img.naturalHeight*f;
    g.drawImage(img,xImg+(wImg-iw)/2,y+(hImg-ih)/2,iw,ih);
    g.restore();
  }else{
    g.fillStyle=P.tinta3;
    g.font='600 15px "Plus Jakarta Sans","Segoe UI",system-ui,sans-serif';
    g.textAlign='center';
    g.fillText('Sin imagen',xImg+wImg/2,y+hImg/2-8);
    g.textAlign='left';
  }
  /* Número de paso: deja claro el orden aunque la secuencia ocupe varias filas */
  if(num&&total>1){
    const d=24;
    stRect(g,xImg+9,y+9,d,d,8);
    g.fillStyle=P.marca2;g.fill();
    g.fillStyle='#FFFFFF';
    g.font='800 13px "Plus Jakarta Sans","Segoe UI",system-ui,sans-serif';
    g.textAlign='center';
    g.fillText(String(num),xImg+9+d/2,y+9+5);
    g.textAlign='left';
  }
  /* Eje Y: la misma pastilla, girada contra el borde izquierdo */
  if((p.y||'').trim()&&ejeY){
    g.save();
    g.translate(x+ejeY/2,y+hImg/2);
    g.rotate(-Math.PI/2);
    stPastilla(g,p.y,p.yc,hImg-14);
    g.restore();
  }
  /* Eje X: la misma pastilla, bajo la imagen */
  if((p.x||'').trim()&&etiqX){
    g.save();
    g.translate(xImg+wImg/2,y+hImg+etiqX/2+2);
    stPastilla(g,p.x,p.xc,wImg);
    g.restore();
  }
}
/* Pastilla de etiqueta, centrada en el origen del contexto. Formato único
   para los dos ejes: sólo cambia el color que se le pase. */
function stPastilla(g,texto,color,maxAncho){
  g.font='700 14px "Plus Jakarta Sans","Segoe UI",system-ui,sans-serif';
  const t=stRecortar(g,String(texto||'').trim(),Math.max(20,maxAncho-26));
  if(!t)return;
  const tw=g.measureText(t).width;
  const alto=24, ancho=Math.min(maxAncho,tw+26);
  stRect(g,-ancho/2,-alto/2,ancho,alto,999);
  g.fillStyle=stTinte(color,0.16);g.fill();
  g.strokeStyle=stTinte(color,0.42);g.lineWidth=1;g.stroke();
  g.fillStyle=stOscurecer(color);
  g.textAlign='center';g.textBaseline='middle';
  g.fillText(t,0,0);
  g.textAlign='left';g.textBaseline='top';
}
function stRecortar(g,txt,maxW){
  let t=String(txt||'');
  if(g.measureText(t).width<=maxW)return t;
  while(t.length>1&&g.measureText(t+'…').width>maxW)t=t.slice(0,-1);
  return t+'…';
}
function stHexRgb(h){const m=/^#?([0-9a-f]{6})$/i.exec(h||'');if(!m)return{r:18,g:167,b:147};const n=parseInt(m[1],16);return{r:(n>>16)&255,g:(n>>8)&255,b:n&255};}
function stTinte(h,a){const c=stHexRgb(h);return 'rgba('+c.r+','+c.g+','+c.b+','+a+')';}
/* Versión más oscura del color, para que el texto de la pastilla se lea. */
function stOscurecer(h){const c=stHexRgb(h);const f=.62;return 'rgb('+Math.round(c.r*f)+','+Math.round(c.g*f)+','+Math.round(c.b*f)+')';}

/* Punta de flecha dibujada en el origen, apuntando a la derecha. */
function stFlechaFigura(g,color){
  g.strokeStyle=color;g.fillStyle=color;g.lineWidth=2.4;g.lineCap='round';
  g.beginPath();g.moveTo(-9,0);g.lineTo(3,0);g.stroke();
  g.beginPath();g.moveTo(9,0);g.lineTo(1,-5.5);g.lineTo(1,5.5);g.closePath();g.fill();
}
/* dir: 1 hacia la derecha, -1 hacia la izquierda. */
function stFlecha(g,cx,cy,color,dir){
  g.save();g.translate(cx,cy);if(dir<0)g.scale(-1,1);
  stFlechaFigura(g,color);
  g.restore();
}
function stFlechaAbajo(g,cx,cy,color){
  g.save();g.translate(cx,cy);g.rotate(Math.PI/2);
  stFlechaFigura(g,color);
  g.restore();
}
function stTabla(g,panel,x,y,w,hCab,hFila){
  const P=ST_EXP;
  const filas=panel.length?panel:[{marker:'—',fluor:'',titer:''}];
  /* En columna estrecha se baja un punto el cuerpo para que quepan los nombres
     largos de fluorocromo sin recortarlos. */
  const estrecha=w<420;
  const fBase=estrecha?13.5:15, fCab=estrecha?11.5:13, pad=estrecha?14:20;
  const alto=hCab+filas.length*hFila;
  stRect(g,x,y,w,alto,14);
  g.fillStyle=P.panel2;g.fill();
  g.strokeStyle=P.filete;g.lineWidth=1;g.stroke();
  /* Cabecera */
  g.save();
  stRect(g,x,y,w,alto,14);g.clip();
  g.fillStyle=P.panel;g.fillRect(x,y,w,hCab);
  g.strokeStyle=P.filete;g.beginPath();g.moveTo(x,y+hCab);g.lineTo(x+w,y+hCab);g.stroke();
  const c1=x+pad, c2=x+w*0.50, c3=x+w-pad;
  g.fillStyle=P.tinta2;
  g.font='800 '+fCab+'px "Plus Jakarta Sans","Segoe UI",system-ui,sans-serif';
  g.fillText('MARCADOR',c1,y+11);
  g.fillText('FLUOROCROMO',c2,y+11);
  g.textAlign='right';g.fillText(estrecha?'µL':'TÍTULO (µL)',c3,y+11);g.textAlign='left';
  /* Filas, con bandas alternas para seguir la línea con la vista */
  filas.forEach((f,i)=>{
    const fy=y+hCab+i*hFila;
    if(i%2===1){g.fillStyle='rgba(15,40,50,.035)';g.fillRect(x,fy,w,hFila);}
    g.font='650 '+fBase+'px "Plus Jakarta Sans","Segoe UI",system-ui,sans-serif';
    g.fillStyle=P.tinta;
    g.fillText(stRecortar(g,f.marker||'',c2-c1-10),c1,fy+7);
    g.font='400 '+fBase+'px "Plus Jakarta Sans","Segoe UI",system-ui,sans-serif';
    g.fillStyle=P.tinta2;
    g.fillText(stRecortar(g,f.fluor||'',c3-c2-44),c2,fy+7);
    g.textAlign='right';
    g.fillStyle=P.tinta;
    g.font='650 '+fBase+'px "Plus Jakarta Sans","Segoe UI",system-ui,sans-serif';
    g.fillText(f.titer||'',c3,fy+7);
    g.textAlign='left';
  });
  g.restore();
}

/* ── PDF: el mismo lienzo del PNG, incrustado a página completa ── */
/* Por encima de 3× el PDF no gana nada visible al imprimir y sí pesa mucho
   más, así que ahí se corta. El contenido no cambia: es el mismo dibujo. */
function stEscalaPdf(){return Math.min(3,stEscala());}
function stPdfHtml(dataUrl,anchoPx,altoPx,titulo){
  /* La página se corta a la medida del lienzo para que no queden márgenes ni
     recortes: el ancho se fija al de un A4 apaisado y el alto sale de la
     proporción real de la hoja. */
  const anchoMm=297;
  const altoMm=Math.round(anchoMm*(altoPx/anchoPx)*10)/10;
  return '<!doctype html><html lang="es"><head><meta charset="utf-8"><title>'+xe(titulo)+'</title><style>'
    +'@page{size:'+anchoMm+'mm '+altoMm+'mm;margin:0}'
    +'html,body{margin:0;padding:0;background:#fff}'
    +'img{display:block;width:100%;height:auto}'
    +'</style></head><body><img src="'+dataUrl+'" alt="'+xe(titulo)+'">'
    +'<scr'+'ipt>window.addEventListener("load",function(){setTimeout(function(){window.print();},250);});</scr'+'ipt>'
    +'</body></html>';
}
async function stExportPdf(id){
  const e=stGet(id);if(!e)return;
  toast('Generando PDF…',{icon:'pdf',duration:3000});
  try{
    const cv=await stDibujar(e,stEscalaPdf());
    const dataUrl=cv.toDataURL('image/png');
    const html=stPdfHtml(dataUrl,cv.width,cv.height,stTitle(e));
    const fname=stFileName(e,'pdf');
    if(DESKTOP&&window.desktop.exportPdf){
      const res=await window.desktop.exportPdf(fname,html);
      if(res&&res.ok)showExportPopup(res.path);
      else if(!(res&&res.canceled))toast('No se pudo generar el PDF.',{icon:'alert'});
      return;
    }
    /* En el navegador se abre en una pestaña que se manda a imprimir sola;
       desde ahí se elige «Guardar como PDF». */
    const blob=new Blob([html],{type:'text/html;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const w=window.open(url,'_blank');
    if(!w){URL.revokeObjectURL(url);toast('Permite ventanas emergentes para exportar a PDF.',{icon:'alert'});return;}
    setTimeout(()=>URL.revokeObjectURL(url),60000);
  }catch(err){
    try{console.error(err);}catch(_){}
    toast('No se pudo generar el PDF',{icon:'alert'});
  }
}

/* ════════════════════════════════════════════════════════════
   AGENDA
   Calendario propio de la app.
     · Los eventos pueden llevar hora o no; los que no la llevan ocupan una
       posición explícita dentro del día.
     · Pueden durar varios días y repetirse (diario, semanal, mensual, anual).
     · Se reparten en calendarios (hasta 5), cada uno con su color.
     · Cada evento admite hasta dos avisos.
   Los eventos entran y salen en formato iCalendar (.ics), que leen Google
   Calendar, Outlook y Apple Calendario; no hay conexión con ningún servicio.

   REPETICIONES: sólo se guarda el evento maestro con su regla. Las repeticiones
   («ocurrencias») se calculan al vuelo para el tramo que se está mirando. De
   cada una se guarda aparte lo que el usuario cambie «sólo en este evento»
   (overrides) y las que borre (exdates). Una instancia se identifica con una
   clave «idDelMaestro|fechaDeLaOcurrencia».
   ════════════════════════════════════════════════════════════ */

const AG_STYLES=[{id:'soft',name:'Suave'},{id:'solid',name:'Sólido'},{id:'outline',name:'Contorno'}];
const AG_COLORS=['#12A793','#2E86D4','#7C5CFC','#E0962B','#D0497E','#5E9920','#E5484D','#0EA5C9','#6B7682','#C0560E'];
const AG_MAX_CALS=5;
const AG_MAX_ALERTS=2;
const AG_FREQS=[{id:'',name:'No se repite'},{id:'daily',name:'Cada día'},{id:'weekly',name:'Cada semana'},{id:'monthly',name:'Cada mes'},{id:'yearly',name:'Cada año'}];
const AG_ALERTS=[{m:0,n:'En el momento'},{m:5,n:'5 minutos antes'},{m:10,n:'10 minutos antes'},{m:15,n:'15 minutos antes'},{m:30,n:'30 minutos antes'},{m:60,n:'1 hora antes'},{m:120,n:'2 horas antes'},{m:1440,n:'1 día antes'},{m:2880,n:'2 días antes'},{m:10080,n:'1 semana antes'}];
const DIAS=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const DIAS_C=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const DIAS_I=['L','M','X','J','V','S','D'];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

/* ── Fechas en formato AAAA-MM-DD, siempre en hora local ── */
function ymd(d){const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function parseYmd(s){const m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(String(s||''));return m?new Date(+m[1],+m[2]-1,+m[3]):new Date();}
function todayYmd(){return ymd(new Date());}
function agAddDays(s,n){const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d);}
function agAddMonths(s,n){const d=parseYmd(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return ymd(d);}
function agDiffDays(a,b){return Math.round((parseYmd(b)-parseYmd(a))/864e5);}
/* La semana empieza en lunes, como en España. */
function agWeekStart(s){const d=parseYmd(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d);}
function agDow(s){return (parseYmd(s).getDay()+6)%7;}
function agLongDate(s){const d=parseYmd(s);return DIAS[agDow(s)]+', '+d.getDate()+' de '+MESES[d.getMonth()]+' de '+d.getFullYear();}
function agShortDate(s){const d=parseYmd(s);return d.getDate()+' '+MESES[d.getMonth()].slice(0,3);}
function agMinutes(t){const m=/^(\d{1,2}):(\d{2})$/.exec(String(t||''));return m?(+m[1])*60+(+m[2]):null;}
function agHHMM(min){const p=n=>String(n).padStart(2,'0');min=Math.max(0,Math.min(24*60-1,min));return p(Math.floor(min/60))+':'+p(min%60);}
function agNowMin(){const n=new Date();return n.getHours()*60+n.getMinutes();}

/* ── Estado ── */
function agState(){
  if(!S.agenda||typeof S.agenda!=='object')S.agenda={events:[],cals:[]};
  if(!Array.isArray(S.agenda.events))S.agenda.events=[];
  if(!Array.isArray(S.agenda.cals))S.agenda.cals=[];
  return S.agenda;
}
function agEvents(){return agState().events;}
function agCals(){const st=agState();if(!st.cals.length)st.cals.push({id:'cal1',name:'General',color:AG_COLORS[0],style:'soft',visible:true});return st.cals;}
function agCal(id){return agCals().find(c=>c.id===id)||agCals()[0];}
function agCalVisible(id){return agCal(id).visible!==false;}

function agMigrate(){
  const st=agState();
  agCals();
  st.cals.forEach(c=>{
    if(!c.id)c.id='cal'+uid();
    if(typeof c.name!=='string'||!c.name.trim())c.name='Calendario';
    if(!/^#[0-9a-f]{6}$/i.test(c.color||''))c.color=AG_COLORS[0];
    if(!AG_STYLES.some(s=>s.id===c.style))c.style='soft';
    if(typeof c.visible!=='boolean')c.visible=true;
  });
  st.cals=st.cals.slice(0,AG_MAX_CALS);
  const idsCal=st.cals.map(c=>c.id);
  st.events.forEach(e=>{
    if(!e.id)e.id=uid();
    if(typeof e.title!=='string')e.title='Evento';
    if(typeof e.desc!=='string')e.desc='';
    if(typeof e.location!=='string')e.location='';
    if(!/^\d{4}-\d{2}-\d{2}$/.test(e.date||''))e.date=todayYmd();
    if(!/^\d{4}-\d{2}-\d{2}$/.test(e.endDate||'')||e.endDate<=e.date)e.endDate='';
    if(typeof e.time!=='string')e.time='';
    if(typeof e.endTime!=='string')e.endTime='';
    if(typeof e.order!=='number')e.order=0;
    if(!idsCal.includes(e.calId))e.calId=idsCal[0];
    if(typeof e.color!=='string'||!/^#[0-9a-f]{6}$/i.test(e.color))e.color='';
    if(!AG_STYLES.some(s=>s.id===e.style))e.style='';
    if(!Array.isArray(e.alerts))e.alerts=[];
    e.alerts=e.alerts.filter(m=>typeof m==='number').slice(0,AG_MAX_ALERTS);
    if(!e.alertsDone||typeof e.alertsDone!=='object')e.alertsDone={};
    if(!Array.isArray(e.exdates))e.exdates=[];
    if(!e.overrides||typeof e.overrides!=='object')e.overrides={};
    e.rrule=agCleanRule(e.rrule);
    if(typeof e.done!=='boolean')e.done=false;
    if(!e.createdAt)e.createdAt=new Date().toISOString();
  });
  if(typeof S.agShowDue!=='boolean')S.agShowDue=true;
  agPruneAlerts();
}
function agCleanRule(r){
  if(!r||typeof r!=='object'||!['daily','weekly','monthly','yearly'].includes(r.freq))return null;
  const out={freq:r.freq,interval:Math.max(1,Math.min(99,parseInt(r.interval,10)||1)),until:/^\d{4}-\d{2}-\d{2}$/.test(r.until||'')?r.until:''};
  if(r.freq==='weekly'&&Array.isArray(r.byDay)){const d=r.byDay.filter(x=>x>=0&&x<=6).sort();if(d.length)out.byDay=d;}
  return out;
}
/* Los avisos ya emitidos de hace más de dos meses se olvidan, para que el
   registro no crezca sin fin. */
function agPruneAlerts(){
  const limite=agAddDays(todayYmd(),-60);
  agEvents().forEach(e=>{
    Object.keys(e.alertsDone||{}).forEach(k=>{if(k.split('|')[0]<limite)delete e.alertsDone[k];});
  });
}

/* ── Repeticiones ── */
function agIsRec(ev){return !!(ev.rrule&&ev.rrule.freq);}
function agSpanDays(e){return (e.endDate&&e.endDate>e.date)?agDiffDays(e.date,e.endDate)+1:1;}
/* ¿Cae una repetición de este evento en esta fecha? Cálculo directo, sin
   recorrer desde el principio de la serie. */
function agMatchesRule(ev,f){
  const r=ev.rrule;
  if(!r)return f===ev.date;
  if(f<ev.date)return false;
  if(r.until&&f>r.until)return false;
  const n=Math.max(1,r.interval||1);
  const a=parseYmd(ev.date),b=parseYmd(f);
  if(r.freq==='daily')return agDiffDays(ev.date,f)%n===0;
  if(r.freq==='weekly'){
    const dias=(r.byDay&&r.byDay.length)?r.byDay:[agDow(ev.date)];
    if(!dias.includes(agDow(f)))return false;
    return ((agDiffDays(agWeekStart(ev.date),agWeekStart(f))/7)%n)===0;
  }
  if(r.freq==='monthly'){
    if(b.getDate()!==a.getDate())return false;
    return (((b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth()))%n)===0;
  }
  if(r.freq==='yearly'){
    if(b.getMonth()!==a.getMonth()||b.getDate()!==a.getDate())return false;
    return ((b.getFullYear()-a.getFullYear())%n)===0;
  }
  return false;
}
/* Fechas de inicio de las repeticiones que tocan el tramo [desde, hasta]. */
function agOccurrences(ev,desde,hasta){
  const dur=agSpanDays(ev);
  const ex=ev.exdates||[];
  if(!agIsRec(ev)){
    const fin=agAddDays(ev.date,dur-1);
    return (fin>=desde&&ev.date<=hasta&&!ex.includes(ev.date))?[ev.date]:[];
  }
  /* Una repetición que empieza antes del tramo puede seguir dentro de él si
     dura varios días, así que se retrocede esa duración. */
  let cur=agAddDays(desde,-(dur-1));
  if(cur<ev.date)cur=ev.date;
  const out=[];
  let guardia=0;
  while(cur<=hasta&&guardia++<800){
    if(!ex.includes(cur)&&agMatchesRule(ev,cur))out.push(cur);
    cur=agAddDays(cur,1);
  }
  return out;
}
/* Una instancia: el maestro con lo cambiado «sólo en este evento» aplicado
   encima, ya resuelto el color heredado del calendario. */
function agInstance(ev,occ){
  const ov=(ev.overrides&&ev.overrides[occ])||{};
  const base=Object.assign({},ev,ov);
  const dur=agSpanDays(base);
  const cal=agCal(ev.calId);
  const color=base.color||cal.color;
  return Object.assign({},base,{
    _id:ev.id,_occ:occ,_rec:agIsRec(ev),_ov:!!(ev.overrides&&ev.overrides[occ]),
    key:ev.id+'|'+occ,
    date:occ,
    endDate:dur>1?agAddDays(occ,dur-1):'',
    _span:dur,
    color,
    style:base.style||cal.style||'soft',
    _cal:cal
  });
}
function agInstances(desde,hasta,todosLosCalendarios){
  const out=[];
  agEvents().forEach(ev=>{
    if(!todosLosCalendarios&&!agCalVisible(ev.calId))return;
    agOccurrences(ev,desde,hasta).forEach(o=>out.push(agInstance(ev,o)));
  });
  return out;
}
function agInstancesOnDay(d){return agInstances(d,d);}
function agFind(key){
  const [id,occ]=String(key||'').split('|');
  const ev=agEvents().find(x=>x.id===id);
  if(!ev)return null;
  return {ev,occ:occ||ev.date,inst:agInstance(ev,occ||ev.date)};
}
/* Un evento ocupa la franja «sin hora» si no tiene hora o si dura varios días
   (igual que hace Google con los eventos de varios días). */
function agEsFranja(i){return !i.time||i._span>1;}
function agDayEvents(date){
  const all=agInstancesOnDay(date);
  const sin=all.filter(agEsFranja).sort((a,b)=>(a.order-b.order)||String(a.createdAt).localeCompare(String(b.createdAt)));
  const con=all.filter(i=>!agEsFranja(i)).sort((a,b)=>(agMinutes(a.time)-agMinutes(b.time))||a.title.localeCompare(b.title,'es'));
  return {sin,con,all:sin.concat(con)};
}
/* Entregas de muestras: se pintan como recordatorio, pero no son eventos. */
function agDueOn(date){
  if(S.agShowDue===false)return [];
  return allDueSoon().filter(x=>x.due===date);
}

/* ── Escritura: «sólo este evento» frente a «toda la serie» ── */
function agApply(key,cambios,scope){
  const f=agFind(key);if(!f)return null;
  const {ev,occ}=f;
  if(agIsRec(ev)&&scope==='one'){
    ev.overrides=ev.overrides||{};
    ev.overrides[occ]=Object.assign({},ev.overrides[occ],cambios);
  }else{
    Object.assign(ev,cambios);
    /* Al cambiar toda la serie se tiran los retoques sueltos que ya no encajan. */
    if(cambios.date!==undefined||cambios.rrule!==undefined){ev.overrides={};ev.exdates=[];}
  }
  ev.updatedAt=new Date().toISOString();
  return ev;
}

/* ── Navegación ── */
/* Cambiar de vista o de periodo no vuelve a pintar la página entera: sólo se
   sustituye el cuerpo del calendario y se le aplica una animación corta. Así
   el encabezado, la barra y el panel lateral no parpadean, y el salto entre
   meses o entre vistas se ve como un desplazamiento y no como un corte. */
const AG_ANIM={'-1':'ag-anim-l','1':'ag-anim-r','0':'ag-anim-f'};
function agAnimar(el,dir){
  if(!el)return;
  const cls=AG_ANIM[String(dir)]||AG_ANIM['0'];
  el.classList.remove('ag-anim-l','ag-anim-r','ag-anim-f');
  void el.offsetWidth;                    /* reinicia la animación */
  el.classList.add(cls);
  el.addEventListener('animationend',()=>el.classList.remove(cls),{once:true});
}
/* Encabezado de la Agenda según la vista y la fecha actuales. */
function agHeadTitle(){
  if((V.agQ||'').trim())return 'Resultados de la búsqueda';
  const v=V.agView||'month';
  if(v==='month')return MESES[parseYmd(V.agDate).getMonth()].replace(/^./,m=>m.toUpperCase())+' '+parseYmd(V.agDate).getFullYear();
  if(v==='week')return 'Semana del '+agShortDate(agWeekStart(V.agDate))+' al '+agShortDate(agAddDays(agWeekStart(V.agDate),6));
  if(v==='day')return agLongDate(V.agDate);
  return 'Próximos eventos';
}
/* Repintado parcial. dir: -1 atrás, 1 adelante, 0 cambio de vista.
   Si la Agenda no está en pantalla, cae en el repintado completo de siempre. */
function agRepaint(dir){
  const zona=document.getElementById('agBody'),tit=document.getElementById('agTitle');
  if(!zona||!tit||V.area!=='agenda'){renderAll();return;}
  tit.textContent=agHeadTitle();
  agAnimar(tit,0);
  document.querySelectorAll('#agSeg .seg-btn').forEach(b=>b.classList.toggle('on',b.dataset.v===(V.agView||'month')));
  zona.innerHTML=(V.agQ||'').trim()?agViewSearch():agCuerpo();
  agAnimar(zona,dir);
  agAfterPaint();
  renderAgendaRail();
}
function agGo(date){const atras=String(date)<String(V.agDate||'');V.agDate=date;agRepaint(atras?-1:1);}
function agSetView(v){if(v===V.agView&&!(V.agQ||'').trim())return;V.agView=v;S.agView=v;V.agQ='';const c=document.getElementById('agSearch');if(c)c.value='';save();agRepaint(0);}
function agToday(){const hoy=todayYmd();const dir=hoy===V.agDate?0:(hoy<V.agDate?-1:1);V.agDate=hoy;agRepaint(dir);}
function agStep(dir){
  const v=V.agView||'month';
  if(v==='month')V.agDate=agAddMonths(V.agDate,dir);
  else if(v==='day')V.agDate=agAddDays(V.agDate,dir);
  else V.agDate=agAddDays(V.agDate,7*dir);
  agRepaint(dir);
}
function agOpenDay(date){
  const veniaDeAgenda=(V.area==='agenda');
  V.agDate=date;V.agView='day';S.agView='day';V.agQ='';save();
  if(veniaDeAgenda)agRepaint(0); else {setArea('agenda');}
}
function agSetQuery(v){
  V.agQ=v||'';
  const c=scrollEl();if(!c)return;
  const zona=document.getElementById('agBody');
  if(zona){zona.innerHTML=V.agQ.trim()?agViewSearch():agCuerpo();agAnimar(zona,0);}
  const tit=document.getElementById('agTitle');
  if(tit)tit.textContent=agHeadTitle();
  agAfterPaint();
}

/* ── Vista principal ── */
function renderAgenda(c){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(V.agDate||''))V.agDate=todayYmd();
  const view=V.agView||'month';
  const buscando=(V.agQ||'').trim();
  const titulo=agHeadTitle();
  const segBtn=(id,icon,label)=>`<button class="seg-btn${view===id?' on':''}" data-v="${id}" onclick="agSetView('${id}')">${ic(icon,14)} ${label}</button>`;
  const nEv=agEvents().length;
  const pegar=S.agClip?`<button class="btn btn-g sm" onclick="agPaste()" title="Pegar «${esc(S.agClip.title)}» en ${esc(agShortDate(V.agDate))}">${ic('paste',14)} Pegar</button>`:'';

  c.innerHTML=`<div class="wrap"><div class="ag-area">
    <div class="page-head">
      <div><div class="eyebrow">Agenda</div><h1 class="title" id="agTitle">${esc(titulo)}</h1><p class="sub">${nEv} evento(s) en total${S.agShowDue!==false?' · se muestran también las entregas de muestras':''}</p></div>
      <button class="btn btn-p" onclick="agNew('${V.agDate}')">${ic('plus',16)} Nuevo evento</button>
    </div>

    <div class="ag-bar">
      <div class="ag-nav">
        <button class="ag-navb" title="Anterior" onclick="agStep(-1)">${ic('chevron-left',16)}</button>
        <button class="btn btn-g sm" onclick="agToday()">${ic('calendar-check',14)} Hoy</button>
        <button class="ag-navb" title="Siguiente" onclick="agStep(1)">${ic('chevron-right',16)}</button>
      </div>
      <div class="seg" id="agSeg">${segBtn('month','calendar','Mes')}${segBtn('week','layers','Semana')}${segBtn('day','sheet','Día')}${segBtn('list','list-check','Lista')}</div>
      <div class="srch-w ag-srch">${ic('search',15)}<input class="srch" id="agSearch" placeholder="Buscar eventos…" value="${esc(V.agQ||'')}" oninput="agSetQuery(this.value)"></div>
      <div class="ag-sp"></div>
      ${pegar}
      <label class="ag-toggle" title="Mostrar en el calendario las fechas objetivo de las muestras"><input type="checkbox" ${S.agShowDue!==false?'checked':''} onchange="S.agShowDue=this.checked;save();renderAll()"> Entregas</label>
      <button class="btn btn-g sm" onclick="agOpenSync()" title="Importar o exportar eventos en formato iCalendar (.ics)">${ic('repeat',14)} Importar / exportar</button>
    </div>

    <div id="agBody">${buscando?agViewSearch():agCuerpo()}</div>
  </div></div>`;
  agAfterPaint();
}
function agCuerpo(){
  const v=V.agView||'month';
  return v==='month'?agViewMonth():v==='week'?agViewWeek():v==='day'?agViewDay():agViewList();
}
/* Retoques posteriores al pintado: desplazar la rejilla a la altura de la hora
   actual y poner en marcha la línea de «ahora». */
function agAfterPaint(){
  const g=document.getElementById('agGrid');
  if(g)g.scrollTop=Math.max(0,(agNowMin()/60)*AG_HOUR_H-2.5*AG_HOUR_H);
  agTickNow();
}

/* ── Línea de la hora actual (Semana y Lista) ── */
let _agNowTimer=null;
function agTickNow(){
  if(_agNowTimer){clearInterval(_agNowTimer);_agNowTimer=null;}
  const pintar=()=>{
    const l=document.getElementById('agNow');
    if(l)l.style.top=((agNowMin()/60)*AG_HOUR_H).toFixed(1)+'px';
    const g=document.getElementById('agNowG');
    if(g){g.style.top=((agNowMin()/60)*AG_HOUR_H).toFixed(1)+'px';const et=document.getElementById('agNowT');if(et)et.textContent=agHHMM(agNowMin());}
    const s=document.getElementById('agNowList');
    if(s){const et=s.querySelector('span');if(et)et.textContent='ahora · '+agHHMM(agNowMin());}
    if(!l&&!s&&_agNowTimer){clearInterval(_agNowTimer);_agNowTimer=null;}
  };
  pintar();
  if(document.getElementById('agNow')||document.getElementById('agNowList'))_agNowTimer=setInterval(pintar,60000);
}

/* ── Vista de mes ── */
function agViewMonth(){
  const anchor=parseYmd(V.agDate);
  const inicio=agWeekStart(ymd(new Date(anchor.getFullYear(),anchor.getMonth(),1)));
  const hoy=todayYmd();
  const mesActual=anchor.getMonth();
  let celdas='';
  for(let i=0;i<42;i++){
    const d=agAddDays(inicio,i);
    const dd=parseYmd(d);
    const fuera=dd.getMonth()!==mesActual;
    const {all}=agDayEvents(d);
    const entregas=agDueOn(d);
    const visibles=all.slice(0,3);
    const resto=(all.length+entregas.length)-visibles.length-Math.max(0,3-visibles.length>0?Math.min(entregas.length,3-visibles.length):0);
    const chips=visibles.map(e=>agChipHtml(e,d)).join('')
      +entregas.slice(0,Math.max(0,3-visibles.length)).map(x=>agDueChipHtml(x)).join('');
    celdas+=`<div class="ag-cell${fuera?' out':''}${d===hoy?' today':''}" data-date="${d}" ondblclick="agNew('${d}')" ondragover="agDragOver(event,this)" ondragleave="agDragLeave(this)" ondrop="agDropDay(event,'${d}')">
      <div class="ag-cell-hd"><button class="ag-daynum" title="Ver el día" onclick="agOpenDay('${d}')">${dd.getDate()}</button><button class="ag-cell-add" title="Nuevo evento este día" onclick="agNew('${d}')">${ic('plus',13)}</button></div>
      <div class="ag-cell-body">${chips}${resto>0?`<button class="ag-more" onclick="agOpenDay('${d}')">+${resto} más</button>`:''}</div>
    </div>`;
  }
  return `<div class="ag-month">
    <div class="ag-week-hd">${DIAS_C.map(n=>`<div>${n}</div>`).join('')}</div>
    <div class="ag-grid-m">${celdas}</div>
  </div>
  <p class="sub" style="margin-top:10px">Doble clic en un día para crear un evento. Arrastra un evento a otro día para moverlo.</p>`;
}

/* ── Vista de semana ── */
const AG_HOUR_H=46;
function agViewWeek(){
  const inicio=agWeekStart(V.agDate);
  const hoy=todayYmd();
  const dias=[];for(let i=0;i<7;i++)dias.push(agAddDays(inicio,i));
  const hoyEnLaSemana=dias.indexOf(hoy);

  const cabecera=dias.map(d=>{
    const dd=parseYmd(d);
    return `<button class="ag-wd${d===hoy?' today':''}" onclick="agOpenDay('${d}')"><span class="ag-wd-n">${DIAS_C[agDow(d)]}</span><span class="ag-wd-d">${dd.getDate()}</span></button>`;
  }).join('');

  const franja=dias.map(d=>{
    const {sin}=agDayEvents(d);
    const entregas=agDueOn(d);
    return `<div class="ag-allday-col" data-date="${d}" ondblclick="agNew('${d}')" ondragover="agDragOver(event,this)" ondragleave="agDragLeave(this)" ondrop="agDropAllDay(event,'${d}')">${sin.map(e=>agChipHtml(e,d)).join('')}${entregas.map(x=>agDueChipHtml(x)).join('')}</div>`;
  }).join('');

  const horas=[];for(let h=0;h<24;h++)horas.push(`<div class="ag-hour"><span>${String(h).padStart(2,'0')}:00</span></div>`);
  const etiquetaAhora=hoyEnLaSemana>=0?`<div class="ag-now-g" id="agNowG" style="top:${((agNowMin()/60)*AG_HOUR_H).toFixed(1)}px"><span id="agNowT">${agHHMM(agNowMin())}</span></div>`:'';
  const columnas=dias.map(d=>`<div class="ag-col${d===hoy?' today':''}" data-date="${d}" onclick="agGridClick(event,'${d}')" ondragover="agDragOver(event,this)" ondragleave="agDragLeave(this)" ondrop="agDropGrid(event,'${d}')">${agTimedLayer(d)}</div>`).join('');

  /* Línea de la hora actual: sólo si la semana que se mira contiene hoy. */
  const linea=hoyEnLaSemana>=0
    ? `<div class="ag-now" id="agNow" style="top:${((agNowMin()/60)*AG_HOUR_H).toFixed(1)}px"><i class="ag-now-dot" style="left:${(hoyEnLaSemana*100/7).toFixed(4)}%"></i></div>`
    : '';

  return `<div class="ag-week">
    <div class="ag-week-top"><div class="ag-gutter"></div><div class="ag-wd-row">${cabecera}</div></div>
    <div class="ag-allday"><div class="ag-gutter"><span>sin hora</span></div><div class="ag-allday-row">${franja}</div></div>
    <div class="ag-grid" id="agGrid">
      <div class="ag-gutter-col">${horas.join('')}${etiquetaAhora}</div>
      <div class="ag-cols" style="--hh:${AG_HOUR_H}px">${columnas}${linea}</div>
    </div>
  </div>
  <p class="sub" style="margin-top:10px">Clic en un hueco para crear un evento a esa hora. Arrastra para mover y tira del borde inferior para cambiar la duración.</p>`;
}

/* Coloca los eventos con hora dentro de una columna, repartiendo en carriles
   los que se solapan para que ninguno tape a otro. */
function agTimedLayer(date){
  const {con}=agDayEvents(date);
  if(!con.length)return '';
  const items=con.map(e=>{
    const ini=agMinutes(e.time)||0;
    let fin=agMinutes(e.endTime);
    if(fin==null||fin<=ini)fin=ini+45;
    return {e,ini,fin:Math.min(fin,24*60)};
  });
  const carriles=[];
  items.forEach(it=>{let i=0;while(carriles[i]&&carriles[i]>it.ini)i++;it.lane=i;carriles[i]=it.fin;});
  const total=carriles.length||1;
  return items.map(it=>{
    const top=(it.ini/60)*AG_HOUR_H;
    const alto=Math.max(22,((it.fin-it.ini)/60)*AG_HOUR_H-2);
    const ancho=100/total;
    return `<div class="ag-ev ${agStyleCls(it.e)}${it.e.done?' done':''}" draggable="true" data-key="${it.e.key}"
      style="top:${top.toFixed(1)}px;height:${alto.toFixed(1)}px;left:${(it.lane*ancho).toFixed(2)}%;width:calc(${ancho.toFixed(2)}% - 3px);--c:${it.e.color};--ct:${textColor(it.e.color)}"
      ondragstart="agDragStart(event,'${it.e.key}')" ondragend="agDragEnd(event)"
      onclick="event.stopPropagation();agEdit('${it.e.key}')" title="${esc(agTitulo(it.e))}">
      <span class="ag-ev-t">${esc(it.e.time)}${it.e.endTime?'–'+esc(it.e.endTime):''}${it.e._rec?' '+ic('repeat',9):''}</span>
      <span class="ag-ev-n">${esc(it.e.title)}</span>
      <span class="ag-ev-rz" title="Arrastra para cambiar la duración" onmousedown="agResizeStart(event,'${it.e.key}')" onclick="event.stopPropagation()"></span>
    </div>`;
  }).join('');
}
function agTitulo(i){
  const p=[i.title];
  if(i.location)p.push('📍 '+i.location);
  if(i.desc)p.push(i.desc);
  if(i._rec)p.push('Se repite: '+agRuleLabel(i.rrule).toLowerCase());
  return p.join(' — ');
}
/* Clic en la rejilla: crea un evento a la hora del punto pulsado, redondeada
   al cuarto de hora más próximo. */
function agGridClick(ev,date){
  if(_agDragKey||_agRz)return;
  const col=ev.currentTarget;
  const y=ev.clientY-col.getBoundingClientRect().top;
  let min=Math.round((y/AG_HOUR_H)*60/15)*15;
  min=Math.max(0,Math.min(23*60+45,min));
  agNew(date,agHHMM(min));
}

/* ── Arrastrar y soltar ── */
let _agDragKey=null;
function agDragStart(ev,key){
  _agDragKey=key;
  try{ev.dataTransfer.setData('text/plain',key);ev.dataTransfer.effectAllowed='move';}catch(_){}
  if(ev.currentTarget&&ev.currentTarget.classList)ev.currentTarget.classList.add('ag-dragging');
}
function agDragEnd(ev){
  _agDragKey=null;
  if(ev.currentTarget&&ev.currentTarget.classList)ev.currentTarget.classList.remove('ag-dragging');
  document.querySelectorAll('.ag-drop').forEach(el=>el.classList.remove('ag-drop'));
}
function agDragOver(ev,el){if(!_agDragKey)return;ev.preventDefault();try{ev.dataTransfer.dropEffect='move';}catch(_){}el.classList.add('ag-drop');}
function agDragLeave(el){el.classList.remove('ag-drop');}
function agDropKey(ev){
  let k=_agDragKey;
  try{k=ev.dataTransfer.getData('text/plain')||k;}catch(_){}
  return k;
}
/* Soltar en una celda de mes o en la franja «sin hora»: cambia el día y
   conserva la hora (o la quita, si cae en la franja). */
function agDropDay(ev,date){ev.preventDefault();agDragLeave(ev.currentTarget);agMoverA(agDropKey(ev),date,undefined);}
function agDropAllDay(ev,date){ev.preventDefault();agDragLeave(ev.currentTarget);agMoverA(agDropKey(ev),date,'');}
/* Soltar en la rejilla horaria: cambia el día y la hora, al cuarto más próximo. */
function agDropGrid(ev,date){
  ev.preventDefault();agDragLeave(ev.currentTarget);
  const y=ev.clientY-ev.currentTarget.getBoundingClientRect().top;
  let min=Math.round((y/AG_HOUR_H)*60/15)*15;
  min=Math.max(0,Math.min(23*60+45,min));
  agMoverA(agDropKey(ev),date,agHHMM(min));
}
/* hora === undefined → se conserva; '' → pasa a evento sin hora. */
function agMoverA(key,date,hora){
  _agDragKey=null;
  const f=agFind(key);if(!f)return;
  const i=f.inst;
  const mismaHora=(hora===undefined)?i.time:hora;
  if(i.date===date&&mismaHora===i.time)return;
  const cambios={date,time:mismaHora};
  /* Se conserva la duración, tanto en horas como en días. */
  if(mismaHora&&i.time&&i.endTime){
    const d=agMinutes(i.endTime)-agMinutes(i.time);
    cambios.endTime=agHHMM(Math.min(24*60-1,(agMinutes(mismaHora)||0)+d));
  }else if(!mismaHora){cambios.endTime='';}
  if(i._span>1)cambios.endDate=agAddDays(date,i._span-1);
  agMover(key,cambios);
}
function agMover(key,cambios){
  const f=agFind(key);if(!f)return;
  if(agIsRec(f.ev)){
    agPreguntarAlcance('mover',alcance=>{
      if(alcance==='all'){
        /* Al mover toda la serie se desplaza también su fecha de arranque. */
        const delta=agDiffDays(f.inst.date,cambios.date);
        const nuevos=Object.assign({},cambios,{date:agAddDays(f.ev.date,delta)});
        if(cambios.endDate)nuevos.endDate=agAddDays(nuevos.date,f.inst._span-1);
        agApply(key,nuevos,'all');
      }else{
        agApply(key,cambios,'one');
      }
      save();renderAll();toast('Evento movido',{icon:'circle-check'});
    });
    return;
  }
  agApply(key,cambios,'all');
  save();renderAll();toast('Evento movido',{icon:'circle-check'});
}
/* Estirar el borde inferior para cambiar la duración. */
let _agRz=null;
function agResizeStart(ev,key){
  ev.preventDefault();ev.stopPropagation();
  const caja=ev.currentTarget.parentNode;
  const f=agFind(key);if(!f)return;
  const ini=agMinutes(f.inst.time)||0;
  _agRz={key,ini,y0:ev.clientY,caja,alto0:caja.offsetHeight};
  document.addEventListener('mousemove',agResizeMove);
  document.addEventListener('mouseup',agResizeEnd);
}
function agResizeMove(ev){
  if(!_agRz)return;
  const alto=Math.max(AG_HOUR_H/4,_agRz.alto0+(ev.clientY-_agRz.y0));
  _agRz.caja.style.height=alto+'px';
}
function agResizeEnd(ev){
  document.removeEventListener('mousemove',agResizeMove);
  document.removeEventListener('mouseup',agResizeEnd);
  if(!_agRz)return;
  const rz=_agRz;_agRz=null;
  const mins=Math.max(15,Math.round((rz.caja.offsetHeight/AG_HOUR_H)*60/15)*15);
  const fin=agHHMM(Math.min(24*60-1,rz.ini+mins));
  const f=agFind(rz.key);
  if(!f||f.inst.endTime===fin){renderAll();return;}
  if(agIsRec(f.ev)){
    agPreguntarAlcance('cambiar la duración de',alcance=>{agApply(rz.key,{endTime:fin},alcance);save();renderAll();});
    return;
  }
  agApply(rz.key,{endTime:fin},'all');save();renderAll();
}

/* Pregunta si el cambio afecta sólo a esta repetición o a toda la serie. */
function agPreguntarAlcance(accion,cb){
  window._agScopeCb=cb;
  openModalHTML(`<div class="modal" style="width:min(430px,96vw)">
    <div class="mtit"><span class="mtit-ic">${ic('repeat',19)}</span>Evento que se repite</div>
    <p class="sub" style="margin-top:2px">¿A qué quieres ${esc(accion)}?</p>
    <div class="bfrom-list" style="margin-top:14px">
      <button class="bfrom-item" onclick="agScopePick('one')">${ic('point',16)} Sólo este evento</button>
      <button class="bfrom-item" onclick="agScopePick('all')">${ic('repeat',16)} Toda la serie</button>
    </div>
    <div class="mact"><button class="btn btn-g sm" onclick="agScopeCancel()">Cancelar</button></div>
  </div>`);
}
function agScopePick(alcance){const cb=window._agScopeCb;window._agScopeCb=null;closeModal();if(cb)cb(alcance);}
function agScopeCancel(){window._agScopeCb=null;closeModal();renderAll();}

/* ── Marco común del calendario ──
   Mes y Semana ya venían enmarcados; Día, Lista y los resultados de búsqueda
   usan el mismo borde, fondo y esquinas para que las cuatro vistas se lean
   como el mismo objeto. */
function agFrame(cabecera,cuerpo){
  return `<div class="ag-frame">${cabecera?`<div class="ag-frame-hd">${cabecera}</div>`:''}<div class="ag-frame-body">${cuerpo}</div></div>`;
}
function agGroup(icono,titulo,n,accion,cuerpo){
  return `<div class="ag-grp">
    <div class="ag-grp-hd">${ic(icono,15)}<h3>${titulo}</h3>${n!==undefined?`<span class="ag-grp-n">${n}</span>`:''}<div class="sp" style="flex:1"></div>${accion||''}</div>
    <div class="ag-list">${cuerpo}</div>
  </div>`;
}

/* ── Vista de día ── */
function agViewDay(){
  const d=V.agDate;
  const {sin,con}=agDayEvents(d);
  const entregas=agDueOn(d);

  const cabecera=`<div class="ag-daynav">
      <button class="ag-navb" title="Día anterior" onclick="agGo('${agAddDays(d,-1)}')">${ic('chevron-left',16)}</button>
      <span class="ag-daynav-t">${d===todayYmd()?'<b>Hoy</b> · ':''}${esc(agLongDate(d))}</span>
      <button class="ag-navb" title="Día siguiente" onclick="agGo('${agAddDays(d,1)}')">${ic('chevron-right',16)}</button>
    </div>`;

  const sinHtml=sin.length?sin.map((e,i)=>agRowHtml(e,{pos:i+1,arriba:i===0,abajo:i===sin.length-1})).join(''):'<div class="ag-vacio">Ningún evento sin hora este día.</div>';
  const conHtml=con.length?con.map(e=>agRowHtml(e,{})).join(''):'<div class="ag-vacio">Ningún evento con hora este día.</div>';
  const dueHtml=entregas.length?agGroup('tube','Entregas de muestras',entregas.length,'',
      entregas.map(x=>`<div class="ag-row ag-row-due" style="--c:${x.color};--ct:${textColor(x.color)}" onclick="openSampleFrom('${x.pid}','${x.sid}')">
        <span class="ag-hh">${ic('tube',15)}</span>
        <div class="ag-row-main"><b>${esc(x.code)}</b><span>${esc(x.pname)}</span></div>
        <span class="due-badge ${x.d<0?'due-over':x.d<=7?'due-soon':'due-ok'}">${ic('calendar-check',12)} ${x.d<0?'Vencida':x.d===0?'Hoy':'En '+x.d+' d'}</span>
      </div>`).join('')):'';

  return agFrame(cabecera,
    agGroup('grip','Sin hora',sin.length,`<button class="btn btn-g sm" onclick="agNew('${d}')">${ic('plus',14)} Añadir</button>`,sinHtml)
    +agGroup('clock','Con hora',con.length,`<button class="btn btn-g sm" onclick="agNew('${d}','09:00')">${ic('plus',14)} Añadir</button>`,conHtml)
    +dueHtml)
    +`<p class="sub" style="margin-top:10px">Las flechas mueven los eventos sin hora dentro del día.</p>`;
}
/* Fila de evento, compartida por las vistas de día, lista y búsqueda. */
function agRowHtml(e,o){
  o=o||{};
  const flechas=o.pos!==undefined?`<button class="sc-ibtn" title="Subir" ${o.arriba?'disabled':''} onclick="agReorderMove('${e.key}',-1)">${ic('arrow-up',15)}</button><button class="sc-ibtn" title="Bajar" ${o.abajo?'disabled':''} onclick="agReorderMove('${e.key}',1)">${ic('arrow-down',15)}</button>`:'';
  const izq=o.pos!==undefined
    ? `<span class="ag-pos" title="Posición dentro del día">${o.pos}</span>`
    : `<span class="ag-hh">${e.time?esc(e.time)+(e.endTime?`<i>${esc(e.endTime)}</i>`:''):'<em>sin hora</em>'}</span>`;
  const meta=[];
  if(e._span>1)meta.push(ic('calendar',11)+' '+esc(agShortDate(e.date))+' – '+esc(agShortDate(e.endDate)));
  if(e.location)meta.push(ic('point',11)+' '+esc(e.location));
  if(e._rec)meta.push(ic('repeat',11)+' '+esc(agRuleLabel(e.rrule)));
  if(e.alerts&&e.alerts.length)meta.push(ic('bell',11)+' '+e.alerts.map(agAlertLabel).join(', '));
  return `<div class="ag-row ${agStyleCls(e)}${e.done?' done':''}" style="--c:${e.color};--ct:${textColor(e.color)}">
      ${izq}
      <div class="ag-row-main" onclick="agEdit('${e.key}')">
        <b>${esc(e.title)}</b>
        ${meta.length?`<span class="ag-row-meta">${meta.join('<i class="ag-sep">·</i>')}</span>`:''}
        ${e.desc?`<span>${esc(e.desc)}</span>`:''}
      </div>
      <div class="ag-row-acts">
        ${flechas}
        <button class="sc-ibtn" title="${e.done?'Marcar como pendiente':'Marcar como hecho'}" onclick="agToggle('${e.key}')">${ic(e.done?'circle-check':'circle-dot',15)}</button>
        <button class="sc-ibtn" title="Copiar" onclick="agCopy('${e.key}')">${ic('copy',15)}</button>
        <button class="sc-ibtn" title="Editar" onclick="agEdit('${e.key}')">${ic('edit',15)}</button>
        <button class="sc-ibtn" title="Eliminar" onclick="agDelete('${e.key}')">${ic('trash',15)}</button>
      </div>
    </div>`;
}
/* Grupos por día, con el separador «ahora» intercalado en el día de hoy. */
function agDiasHtml(inst){
  const hoy=todayYmd();
  const porDia={};
  inst.forEach(i=>{(porDia[i.date]=porDia[i.date]||[]).push(i);});
  return Object.keys(porDia).sort().map(d=>{
    const lista=porDia[d];
    let filas='';
    if(d===hoy){
      const ahora=agNowMin();
      let puesto=false;
      lista.forEach(e=>{
        const m=agMinutes(e.time);
        if(!puesto&&m!=null&&m>ahora){filas+=agNowListHtml();puesto=true;}
        filas+=agRowHtml(e,{});
      });
      if(!puesto)filas+=agNowListHtml();
    }else{
      filas=lista.map(e=>agRowHtml(e,{})).join('');
    }
    const etiqueta=d===hoy?'Hoy':d===agAddDays(hoy,1)?'Mañana':'';
    return `<div class="ag-grp">
      <div class="ag-grp-hd ag-grp-day"><button class="ag-grp-link" onclick="agOpenDay('${d}')">${ic('calendar',15)}<h3>${esc(agLongDate(d))}</h3></button>${etiqueta?`<span class="ag-grp-tag">${etiqueta}</span>`:''}<div class="sp" style="flex:1"></div><span class="ag-grp-n">${lista.length}</span></div>
      <div class="ag-list">${filas}</div>
    </div>`;
  }).join('');
}

/* ── Vista de lista ── */
function agViewList(){
  const hoy=todayYmd();
  const inst=agInstances(hoy,agAddDays(hoy,120)).sort((a,b)=>a.date.localeCompare(b.date)||agOrdKey(a).localeCompare(agOrdKey(b)));
  const cabecera=`<div class="ag-frame-title">${ic('list-check',15)} Próximos eventos <span class="ag-frame-sub">cuatro meses vista</span></div>`;
  if(!inst.length){
    return agFrame(cabecera,`<div class="empty"><div class="empty-ic">${ic('calendar',38)}</div><h3>No hay eventos próximos</h3><p>Crea uno para empezar a organizar la agenda.</p><button class="btn btn-p" onclick="agNew('${hoy}')">${ic('plus',16)} Nuevo evento</button></div>`);
  }
  return agFrame(cabecera,agDiasHtml(inst));
}

/* ── Buscador ── */
function agViewSearch(){
  const q=(V.agQ||'').trim().toLowerCase();
  if(!q)return agCuerpo();
  const inst=agInstances(agAddDays(todayYmd(),-365),agAddDays(todayYmd(),730)).filter(e=>
    (e.title||'').toLowerCase().includes(q)||
    (e.desc||'').toLowerCase().includes(q)||
    (e.location||'').toLowerCase().includes(q)||
    (e._cal.name||'').toLowerCase().includes(q)
  ).sort((a,b)=>a.date.localeCompare(b.date)||agOrdKey(a).localeCompare(agOrdKey(b)));
  const TOPE=100;
  const recortado=inst.length>TOPE;
  const vistos=recortado?inst.slice(0,TOPE):inst;
  const cabecera=`<div class="ag-frame-title">${ic('search',15)} ${inst.length} resultado(s) para «${esc(V.agQ)}» <span class="ag-frame-sub">${recortado?'se muestran los '+TOPE+' primeros':'del año pasado a dos años vista'}</span><div class="sp" style="flex:1"></div><button class="btn btn-g sm" onclick="agSetQuery('');const i=document.getElementById('agSearch');if(i)i.value='';">${ic('x',14)} Limpiar</button></div>`;
  if(!inst.length){
    return agFrame(cabecera,`<div class="empty"><div class="empty-ic">${ic('search-off',38)}</div><h3>Sin resultados</h3><p>Ningún evento coincide con «${esc(V.agQ)}».</p></div>`);
  }
  return agFrame(cabecera,agDiasHtml(vistos)+(recortado?`<div class="ag-recorte">${ic('info',13)} Hay ${inst.length-TOPE} coincidencia(s) más. Afina la búsqueda para verlas.</div>`:''));
}
function agNowListHtml(){return `<div class="ag-now-list" id="agNowList"><span>ahora · ${agHHMM(agNowMin())}</span></div>`;}

/* ── Piezas sueltas ── */
function agOrdKey(e){return e.time?("1"+e.time):"0";}
function agStyleCls(e){return 's-'+(e.style||'soft');}
function agRuleLabel(r){
  if(!r||!r.freq)return '';
  const n=r.interval||1;
  let base=r.freq==='daily'?(n===1?'Cada día':'Cada '+n+' días')
    :r.freq==='weekly'?(n===1?'Cada semana':'Cada '+n+' semanas')
    :r.freq==='monthly'?(n===1?'Cada mes':'Cada '+n+' meses')
    :(n===1?'Cada año':'Cada '+n+' años');
  if(r.freq==='weekly'&&r.byDay&&r.byDay.length)base+=' ('+r.byDay.map(d=>DIAS_C[d]).join(', ')+')';
  if(r.until)base+=' hasta el '+agShortDate(r.until);
  return base;
}
function agAlertLabel(m){const a=AG_ALERTS.find(x=>x.m===m);return a?a.n:(m+' min antes');}
function agChipHtml(e,dia){
  /* En un evento de varios días se marca si el trozo viene de antes o sigue. */
  const sigueAntes=e._span>1&&dia>e.date;
  const sigueDespues=e._span>1&&dia<e.endDate;
  return `<div class="ag-chip ${agStyleCls(e)}${e.done?' done':''}${e._span>1?' multi':''}" draggable="true" data-key="${e.key}"
    style="--c:${e.color};--ct:${textColor(e.color)}"
    ondragstart="agDragStart(event,'${e.key}')" ondragend="agDragEnd(event)"
    onclick="event.stopPropagation();agEdit('${e.key}')" title="${esc(agTitulo(e))}">
    ${sigueAntes?'<span class="ag-chip-cont">‹</span>':(e.time?`<span class="ag-chip-h">${esc(e.time)}</span>`:'<span class="ag-chip-dot"></span>')}<span class="ag-chip-n">${esc(e.title)}</span>${e._rec?`<span class="ag-chip-ic">${ic('repeat',10)}</span>`:''}${sigueDespues?'<span class="ag-chip-cont">›</span>':''}
  </div>`;
}
function agDueChipHtml(x){
  return `<button class="ag-chip ag-chip-due s-soft" style="--c:${x.color};--ct:${textColor(x.color)}" onclick="event.stopPropagation();openSampleFrom('${x.pid}','${x.sid}')" title="Entrega de ${esc(x.code)} · ${esc(x.pname)}">${ic('tube',11)}<span class="ag-chip-n">${esc(x.code)}</span></button>`;
}

/* ── Calendarios ── */
function agToggleCal(id){const c=agCal(id);c.visible=c.visible===false;save();renderAll();}
function agAddCal(){
  if(agCals().length>=AG_MAX_CALS){toast('El máximo son '+AG_MAX_CALS+' calendarios',{icon:'alert'});return;}
  const usados=agCals().map(c=>c.color);
  const color=AG_COLORS.find(c=>!usados.includes(c))||AG_COLORS[0];
  const nombre=uniqueName('Calendario',agCals().map(c=>c.name),'Calendario');
  agCals().push({id:'cal'+uid(),name:nombre,color,style:'soft',visible:true});
  save();renderAll();agOpenCals();
}
function agDeleteCal(id){
  const cals=agCals();
  if(cals.length<=1){toast('Tiene que quedar al menos un calendario',{icon:'alert'});return;}
  const cal=agCal(id);
  const n=agEvents().filter(e=>e.calId===id).length;
  if(!confirm('¿Eliminar el calendario «'+cal.name+'»?'+(n?' Sus '+n+' evento(s) pasarán a «'+cals.find(c=>c.id!==id).name+'».':'')))return;
  const destino=cals.find(c=>c.id!==id).id;
  agEvents().forEach(e=>{if(e.calId===id)e.calId=destino;});
  agState().cals=cals.filter(c=>c.id!==id);
  save();renderAll();agOpenCals();
}
function agSetCal(id,campo,valor){
  const c=agCal(id);if(!c)return;
  if(campo==='name')c.name=nmu(valor).trim()||c.name;
  else if(campo==='color')c.color=valor;
  else if(campo==='style')c.style=valor;
  save();renderAll();
  if(document.getElementById('agCalList'))agPaintCalEditor();
}
/* Ventana de gestión de calendarios. Se repinta por dentro para no parpadear. */
function agOpenCals(){
  if(document.getElementById('agCalList')){agPaintCalEditor();return;}
  openModalHTML(`<div class="modal" style="width:min(560px,96vw)">
    <div class="mtit"><span class="mtit-ic">${ic('layers',19)}</span>Calendarios</div>
    <p class="sub" style="margin-top:2px">Hasta ${AG_MAX_CALS}. Cada evento pertenece a uno y hereda su color, salvo que le pongas uno propio.</p>
    <div class="opt-list" id="agCalList" style="margin-top:14px"></div>
    <div class="mact"><button class="btn btn-g sm" onclick="closeModal()">Cerrar</button><button class="btn btn-p sm" id="agCalAdd" onclick="agAddCal()">${ic('plus',15)} Añadir calendario</button></div>
  </div>`);
  agPaintCalEditor();
}
function agPaintCalEditor(){
  const el=document.getElementById('agCalList');if(!el)return;
  el.innerHTML=agCals().map(c=>`<div class="opt-row">
    <label class="color-wrap" title="Color"><input type="color" value="${c.color}" onchange="agSetCal('${c.id}','color',this.value)"><span class="sw" style="width:24px;height:24px;border-radius:6px;background:${c.color}"></span></label>
    <input class="txt-in" style="flex:1;min-width:120px" value="${esc(c.name)}" onchange="agSetCal('${c.id}','name',this.value)">
    <select class="sel sm" title="Estilo por defecto" onchange="agSetCal('${c.id}','style',this.value)">${AG_STYLES.map(s=>`<option value="${s.id}"${c.style===s.id?' selected':''}>${s.name}</option>`).join('')}</select>
    <span class="preset-count">${agEvents().filter(e=>e.calId===c.id).length} eventos</span>
    <button class="ic-x" title="Eliminar calendario" onclick="agDeleteCal('${c.id}')">${ic('trash',15)}</button>
  </div>`).join('');
  const b=document.getElementById('agCalAdd');
  if(b)b.disabled=agCals().length>=AG_MAX_CALS;
}

/* ── Alta y edición ── */
let agEd=null;
function agNew(date,time){
  agEd={key:'',nuevo:true,scope:'all',calId:agCals()[0].id,color:'',style:'',rrule:null,alerts:[]};
  agOpenEditor({title:'',desc:'',location:'',date:date||todayYmd(),endDate:'',time:time||'',endTime:'',done:false});
}
function agEdit(key){
  const f=agFind(key);if(!f)return;
  const i=f.inst;
  agEd={key,nuevo:false,scope:agIsRec(f.ev)?'one':'all',calId:f.ev.calId,
        color:i.color===f.ev.color?f.ev.color:i.color,style:f.ev.style,
        rrule:f.ev.rrule?Object.assign({},f.ev.rrule):null,alerts:(i.alerts||[]).slice(0,AG_MAX_ALERTS),
        rec:agIsRec(f.ev)};
  /* El color guardado puede ser «heredado»; se muestra el efectivo. */
  agEd.colorEfectivo=i.color;
  agEd.hereda=!f.ev.color;
  agOpenEditor(i);
}

      <div class="mfld"><label class="mlbl">Ubicación <span style="color:var(--tx3);font-weight:400">(opcional)</span></label><input class="minp" id="agLoc" value="${esc(e.location||'')}" placeholder="Sala, equipo, edificio…"></div>
    </div>
    <div class="mfld"><label class="mlbl">Descripción <span style="color:var(--tx3);font-weight:400">(opcional)</span></label><textarea class="minp auto" id="agDesc" rows="2" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'">${esc(e.desc)}</textarea></div>

    <div class="rp-grid">
      <div class="mfld"><label class="mlbl">Fecha de inicio</label><input class="minp" type="date" id="agDate" value="${esc(e.date)}"></div>

      <div class="mfld"><label class="mlbl">Hora de inicio <span style="color:var(--tx3);font-weight:400">(vacío = sin hora)</span></label><input class="minp" type="time" id="agTime" value="${esc(e.time)}" oninput="agSyncPosField()"></div>

function agPaintScope(){
  const el=document.getElementById('agScope');if(!el)return;
  el.innerHTML=`<span class="ag-scope-l">${ic('repeat',13)} Este evento se repite. Los cambios afectan a:</span>
    <div class="seg">
      <button class="seg-btn${agEd.scope==='one'?' on':''}" onclick="agEd.scope='one';agPaintScope();agPaintRepeat()">Sólo este</button>
      <button class="seg-btn${agEd.scope==='all'?' on':''}" onclick="agEd.scope='all';agPaintScope();agPaintRepeat()">Toda la serie</button>
    </div>`;
}
function agPaintRepeat(){
  const el=document.getElementById('agRepeat');if(!el)return;
  /* La regla pertenece a la serie entera: si se está editando una repetición
     suelta, no se puede tocar. */
  if(agEd.rec&&agEd.scope==='one'){
    el.innerHTML=`<div class="ag-rep-lock">${ic('info',13)} <span>${esc(agRuleLabel(agEd.rrule))}. Para cambiar la repetición, elige «Toda la serie» arriba.</span></div>`;
    return;
  }
  const r=agEd.rrule;
  const freq=r?r.freq:'';
  let extra='';
  if(freq){
    const dias=(r.byDay&&r.byDay.length)?r.byDay:[];
    extra=`<div class="ag-rep-row">
      <span>cada</span><input class="minp" type="number" min="1" max="99" value="${r.interval||1}" style="width:66px" onchange="agEd.rrule.interval=Math.max(1,Math.min(99,parseInt(this.value,10)||1));agPaintRepeat()">
      <span>${freq==='daily'?'día(s)':freq==='weekly'?'semana(s)':freq==='monthly'?'mes(es)':'año(s)'}</span>
      <div class="ag-sp2"></div>
      <span>hasta</span><input class="minp" type="date" value="${esc(r.until||'')}" style="width:auto" onchange="agEd.rrule.until=this.value;agPaintRepeat()" title="Vacío = sin fin">
      ${r.until?`<button class="sc-ibtn" title="Sin fecha de fin" onclick="agEd.rrule.until='';agPaintRepeat()">${ic('x',14)}</button>`:''}
    </div>`;
    if(freq==='weekly'){
      extra+=`<div class="ag-rep-days">${DIAS_I.map((n,i)=>`<button class="ag-day${dias.includes(i)?' on':''}" title="${DIAS[i]}" onclick="agToggleRepDay(${i})">${n}</button>`).join('')}</div>`;
    }
    extra+=`<div class="ag-rep-sum">${ic('info',12)} ${esc(agRuleLabel(agEd.rrule))}</div>`;
  }
  el.innerHTML=`<select class="sel" style="width:100%;max-width:260px" onchange="agSetFreq(this.value)">${AG_FREQS.map(f=>`<option value="${f.id}"${f.id===freq?' selected':''}>${f.name}</option>`).join('')}</select>${extra}`;
}
function agSetFreq(f){
  if(!f){agEd.rrule=null;}
  else{
    const base=agEd.rrule||{};
    agEd.rrule={freq:f,interval:base.interval||1,until:base.until||''};
    if(f==='weekly'){
      const d=(document.getElementById('agDate')||{}).value||todayYmd();
      agEd.rrule.byDay=(base.byDay&&base.byDay.length)?base.byDay:[agDow(d)];
    }
  }
  agPaintRepeat();
}
function agToggleRepDay(i){
  const r=agEd.rrule;if(!r)return;
  const d=new Set(r.byDay||[]);
  if(d.has(i))d.delete(i);else d.add(i);
  if(!d.size)d.add(i);
  r.byDay=[...d].sort();
  agPaintRepeat();
}
function agPaintAlerts(){
  const el=document.getElementById('agAlerts');if(!el)return;
  const filas=agEd.alerts.map((m,i)=>`<div class="ag-alert-row">
    <select class="sel" onchange="agEd.alerts[${i}]=+this.value;agPaintAlerts()">${AG_ALERTS.map(a=>`<option value="${a.m}"${a.m===m?' selected':''}>${a.n}</option>`).join('')}</select>
    <button class="sc-ibtn" title="Quitar aviso" onclick="agEd.alerts.splice(${i},1);agPaintAlerts()">${ic('x',15)}</button>
  </div>`).join('');
  const add=agEd.alerts.length<AG_MAX_ALERTS
    ? `<button class="btn btn-g sm" onclick="agEd.alerts.push(agEd.alerts.includes(10)?60:10);agPaintAlerts()">${ic('plus',14)} Añadir aviso</button>`
    : `<span class="ag-alert-max">${ic('info',12)} Máximo ${AG_MAX_ALERTS} avisos por evento.</span>`;
  el.innerHTML=(filas||'<span class="ag-alert-none">Sin avisos.</span>')+'<div class="ag-alert-add">'+add+'</div>';
}
function agPaintColors(){
  const el=document.getElementById('agColors');if(!el)return;
  const cal=agCal((document.getElementById('agCalSel')||{}).value||agEd.calId);
  const actual=agEd.hereda?cal.color:(agEd.color||cal.color);
  el.innerHTML=`<button class="cdot cdot-inherit${agEd.hereda?' on':''}" style="background:${cal.color}" title="Heredar del calendario «${esc(cal.name)}»" onclick="agEd.hereda=true;agEd.color='';agPaintColors()">${agEd.hereda?'':''}</button>`
    +AG_COLORS.map(c=>`<button class="cdot${(!agEd.hereda&&actual===c)?' on':''}" style="background:${c}" title="${c}" onclick="agEd.hereda=false;agEd.color='${c}';agPaintColors()"></button>`).join('')
    +`<label class="color-wrap" title="Color personalizado"><input type="color" value="${actual}" onchange="agEd.hereda=false;agEd.color=this.value;agPaintColors()"><span class="sw" style="width:28px;height:28px;border-radius:8px;background:${actual}"></span></label>`;
}
function agPaintStyles(){
  const el=document.getElementById('agStyles');if(!el)return;
  const cal=agCal((document.getElementById('agCalSel')||{}).value||agEd.calId);
  el.innerHTML=`<button class="seg-btn${!agEd.style?' on':''}" onclick="agEd.style='';agPaintStyles()" title="El del calendario: ${AG_STYLES.find(s=>s.id===cal.style).name}">Heredado</button>`
    +AG_STYLES.map(s=>`<button class="seg-btn${agEd.style===s.id?' on':''}" onclick="agEd.style='${s.id}';agPaintStyles()">${s.name}</button>`).join('');
}
/* El campo de posición sólo tiene sentido si el evento no lleva hora. */
function agSyncPosField(){
  const t=document.getElementById('agTime'),f=document.getElementById('agPosFld');
  if(!t||!f)return;
  f.style.opacity=t.value?'.4':'1';
  const p=document.getElementById('agPos');if(p)p.disabled=!!t.value;
}
function agSaveEditor(){
  const val=x=>((document.getElementById(x)||{}).value||'').trim();
  const title=nmu(val('agEvTitle'));
  if(!title){toast('El evento necesita un título',{icon:'alert'});const i=document.getElementById('agEvTitle');if(i)i.focus();return;}
  const date=val('agDate')||todayYmd();
  let endDate=val('agEndDate');
  if(endDate&&endDate<=date)endDate='';
  const time=val('agTime');
  let endTime=val('agEnd');
  if(time&&endTime&&agMinutes(endTime)<=agMinutes(time)){toast('La hora de fin debe ser posterior a la de inicio',{icon:'alert'});return;}
  if(!time)endTime='';
  const datos={
    title,
    desc:nmu(val('agDesc')),
    location:nmu(val('agLoc')),
    date,endDate,time,endTime,
    calId:val('agCalSel')||agEd.calId,
    color:agEd.hereda?'':(agEd.color||''),
    style:agEd.style||'',
    alerts:agEd.alerts.slice(0,AG_MAX_ALERTS)
  };

  let clave=agEd.key;
  if(agEd.nuevo){
    const ev=Object.assign({id:uid(),done:false,order:0,alertsDone:{},exdates:[],overrides:{},rrule:agCleanRule(agEd.rrule),createdAt:new Date().toISOString()},datos);
    agEvents().push(ev);
    clave=ev.id+'|'+ev.date;
  }else{
    const f=agFind(agEd.key);
    if(!f){closeModal();return;}
    const alcance=agEd.rec?agEd.scope:'all';
    if(alcance==='all'){
      datos.rrule=agCleanRule(agEd.rrule);
      /* Si cambió la fecha de arranque, la serie entera se desplaza con ella. */
      agApply(agEd.key,datos,'all');
    }else{
      agApply(agEd.key,datos,'one');
    }
    clave=f.ev.id+'|'+date;
  }
  /* Posición dentro del día, sólo para los que no llevan hora. */
  if(!time){
    const pos=parseInt(val('agPos'),10);
    agReorder(clave,isNaN(pos)?9999:pos);
  }
  /* Un aviso recién puesto que ya haya vencido no debe saltar acto seguido. */
  agSilenciarPasados(clave);
  save();closeModal();renderAll();
  toast(agEd.nuevo?'Evento creado':'Evento actualizado',{icon:'circle-check'});
}
/* Recoloca un evento sin hora en la posición pedida y renumera los demás. */
function agReorder(key,pos){
  const f=agFind(key);if(!f)return;
  const fecha=f.inst.date;
  const otros=agDayEvents(fecha).sin.filter(x=>x.key!==key);
  const i=Math.max(0,Math.min(otros.length,(pos||1)-1));
  otros.splice(i,0,f.inst);
  otros.forEach((x,n)=>{
    const g=agFind(x.key);if(!g)return;
    if(agIsRec(g.ev)){g.ev.overrides=g.ev.overrides||{};g.ev.overrides[g.occ]=Object.assign({},g.ev.overrides[g.occ],{order:n});}
    else g.ev.order=n;
  });
}
function agReorderMove(key,dir){
  const f=agFind(key);if(!f)return;
  const sin=agDayEvents(f.inst.date).sin;
  const i=sin.findIndex(x=>x.key===key);
  const j=i+dir;
  if(i<0||j<0||j>=sin.length)return;
  agReorder(key,j+1);
  save();renderAll();
}
function agToggle(key){
  const f=agFind(key);if(!f)return;
  const valor=!f.inst.done;
  if(agIsRec(f.ev)){f.ev.overrides=f.ev.overrides||{};f.ev.overrides[f.occ]=Object.assign({},f.ev.overrides[f.occ],{done:valor});}
  else f.ev.done=valor;
  save();renderAll();
}
function agDuplicate(key){
  const f=agFind(key);if(!f)return;
  const i=f.inst;
  const copia={id:uid(),title:i.title+' (copia)',desc:i.desc,location:i.location,calId:f.ev.calId,
    date:i.date,endDate:i.endDate||'',time:i.time,endTime:i.endTime,order:9999,
    color:f.ev.color,style:f.ev.style,alerts:(i.alerts||[]).slice(),alertsDone:{},
    rrule:null,exdates:[],overrides:{},done:false,createdAt:new Date().toISOString()};
  agEvents().push(copia);
  if(!copia.time)agReorder(copia.id+'|'+copia.date,9999);
  save();closeModal();renderAll();toast('Evento duplicado',{icon:'copy'});
}
function agDelete(key){
  const f=agFind(key);if(!f)return;
  if(agIsRec(f.ev)){
    agPreguntarAlcance('borrar de',alcance=>{
      if(alcance==='one'){
        f.ev.exdates=(f.ev.exdates||[]).concat([f.occ]);
        if(f.ev.overrides)delete f.ev.overrides[f.occ];
        save();renderAll();toast('Repetición eliminada',{icon:'trash'});
      }else{
        agBorrarMaestro(f.ev);
      }
    });
    return;
  }
  agBorrarMaestro(f.ev);
}
function agBorrarMaestro(ev){
  const arr=agEvents(),i=arr.indexOf(ev);if(i<0)return;
  arr.splice(i,1);
  save();closeModal();renderAll();
  toast('Evento eliminado',{icon:'trash',actionLabel:'Deshacer',onAction:()=>{arr.splice(Math.min(i,arr.length),0,ev);save();renderAll();}});
}

/* ── Copiar y pegar ── */
function agCopy(key){

function agPaste(date){
  const c=S.agClip;
  if(!c){toast('No hay ningún evento copiado',{icon:'alert'});return;}
  const d=date||V.agDate||todayYmd();
  const ev={id:uid(),title:c.title,desc:c.desc||'',location:c.location||'',

    date:d,endDate:(c.span>1)?agAddDays(d,c.span-1):'',
    time:c.time||'',endTime:c.endTime||'',order:9999,
