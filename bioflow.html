/* ════════════════════════════════════════════════════════════
   MÓDULO PHENOTYPE + DASHBOARD + VÍNCULOS + SHELL
   ════════════════════════════════════════════════════════════ */
function clone(x){return JSON.parse(JSON.stringify(x));}
function fmtDay(iso){if(!iso)return'';try{return new Date(iso).toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'});}catch(_){return'';}}
function textColor(hex){if(!hex||hex[0]!=='#'||hex.length<7)return '#fff';const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return (0.299*r+0.587*g+0.114*b)/255>0.6?'#15201d':'#fff';}

const DEFAULT_OPTIONS=[
  {id:'neg',label:'−',color:'#94A3B8',cat:'neg'},
  {id:'dim',label:'dim',color:'#2E7D6B',cat:'pos'},
  {id:'pos',label:'+',color:'#22C55E',cat:'pos'},
  {id:'bri',label:'++',color:'#A3E635',cat:'pos'},
  {id:'var',label:'+/−',color:'#EAB308',cat:'het'},
  {id:'na',label:'n/a',color:'#64748B',cat:''},
  {id:'noapl',label:'NA',color:'#9AA5B1',na:true,cat:''}
];
const DEFAULT_PRESETS=[
  {id:'p_t',name:'Linfocitos T (ejemplo)',markers:['CD3','CD4','CD8','CD45RA','CD45RO','CD26','CCR7']},
  {id:'p_b',name:'Linfocitos B (ejemplo)',markers:['CD19','CD20','CD27','IgD','CD38']}
];
const NEW_SAMPLE_MARKERS=['CD3','CD4','CD8','CD45RO','CD26'];

function phMigrate(){
  if(!S.ph||typeof S.ph!=='object')S.ph={};
  if(!Array.isArray(S.ph.samples))S.ph.samples=[];
  if(!Array.isArray(S.ph.options)||!S.ph.options.length)S.ph.options=clone(DEFAULT_OPTIONS);
  if(!S.ph.naAdded){if(!S.ph.options.some(o=>o&&o.na)){S.ph.options.push({id:'noapl',label:'NA',color:'#9AA5B1',na:true});}S.ph.naAdded=true;}
  S.ph.options.forEach(o=>{if(typeof o.cat!=='string'){
    if(o.na)o.cat='';
    else{const l=(o.label||'');if(l.toLowerCase().indexOf('het')>=0)o.cat='het';else{const hasP=l.indexOf('+')>=0,hasM=l.indexOf('-')>=0||l.indexOf('−')>=0;o.cat=(hasP&&!hasM)?'pos':(hasM&&!hasP)?'neg':'';}}
  }});
  if(!Array.isArray(S.ph.presets))S.ph.presets=clone(DEFAULT_PRESETS);
  if(!S.ph.export||typeof S.ph.export!=='object')S.ph.export={};
  const ex=S.ph.export;
  if(typeof ex.convertD!=='boolean')ex.convertD=true;
  if(typeof ex.dWord!=='string')ex.dWord='débil';
  if(typeof ex.convertHet!=='boolean')ex.convertHet=true;
  if(typeof ex.hetWord!=='string')ex.hetWord='heterog';
  if(ex.order!=='alpha'&&ex.order!=='panel'&&ex.order!=='view')ex.order='view';
  /* Paso único al nuevo criterio: exportar en el orden elegido en el fenotipo. */
  if(!ex.orderV2){ex.order='view';ex.orderV2=true;}
  if(S.ph.picker!=='dial'&&S.ph.picker!=='list')S.ph.picker='list';
  S.ph.samples.forEach(s=>{
    if(!Array.isArray(s.markers))s.markers=[];
    if(!Array.isArray(s.populations))s.populations=[];
    if(s.link!==null&&typeof s.link!=='object')s.link=null;
    if(!s.link)s.link=null; else if(!s.link.pid||!s.link.sid)s.link=null;
    if(s.popSort!=='alpha'&&s.popSort!=='created'&&s.popSort!=='custom')s.popSort='custom';
    if(s.markSort!=='alpha'&&s.markSort!=='created'&&s.markSort!=='custom')s.markSort='custom';
    s.markers.forEach((m,i)=>{if(typeof m.seq!=='number')m.seq=i+1;});
    s.populations.forEach((p,i)=>{if(typeof p.seq!=='number')p.seq=i+1;});
    s.populations.forEach(p=>{
      if(!p.values||typeof p.values!=='object')p.values={};
      if(typeof p.ident!=='string')p.ident='';
      if(typeof p.comment!=='string')p.comment='';
      // Migrar valores escritos en el título tipo "Nombre (31c/uL; 1.06%)" a campos propios
      if(p.count==null&&p.freq==null&&typeof p.title==='string'){
        const m=p.title.match(/^(.*?)\s*\(\s*([\d.,]+)\s*c\/uL\s*;\s*([\d.,]+)\s*%\s*\)\s*$/i);
        if(m){p.title=m[1].trim();p.count=m[2];p.freq=m[3];}
      }
      if(typeof p.count!=='string')p.count=p.count==null?'':String(p.count);
      if(typeof p.freq!=='string')p.freq=p.freq==null?'':String(p.freq);
    });
  });
}
function phSample(id){return S.ph.samples.find(x=>x.id===id);}
// La distinción de poblaciones se basa en la POLARIDAD (positivo vs negativo) configurada
// en «Cuenta como» de las opciones de expresión. Un marcador DISTINGUE si hay al menos una
// población positiva y otra negativa. La expresión heterogénea (het) y las vacías/NA no
// aportan a la distinción (se ignoran). Es «común» si todas las clasificables comparten polaridad.
function phClassifyValues(vals){
  let pos=0,neg=0;
  vals.forEach(v=>{if(v==null||v==='')return;const c=phCatOf(v);if(c==='pos')pos++;else if(c==='neg')neg++;});
  if(pos>0&&neg>0)return 'diff';
  if(pos+neg>=2)return 'common';
  return 'none';
}
function phClassifySample(s){const out={};s.markers.forEach(m=>{out[m.id]=phClassifyValues(s.populations.map(p=>p.values[m.id]));});return out;}
function phClsLabel(c){return c==='diff'?'distingue':c==='common'?'común':'';}
function phLabelOf(id){const o=S.ph.options.find(x=>x.id===id);return o?o.label:'';}

/* ════════ IMPORTAR DATOS COMBINADOS (combinado v2 + formatos antiguos) ════════ */
function applyCombined(data){
  if(Array.isArray(data)){S.projects=data;migrateProjects();phMigrate();return;}
  if(!data||typeof data!=='object')return;
  if(Array.isArray(data.projects))S.projects=data.projects;
  if(data.phenotype&&typeof data.phenotype==='object'){
    if(Array.isArray(data.phenotype.samples))S.ph.samples=data.phenotype.samples;
    if(Array.isArray(data.phenotype.options))S.ph.options=data.phenotype.options;
    if(Array.isArray(data.phenotype.presets))S.ph.presets=data.phenotype.presets;
    if(data.phenotype.export&&typeof data.phenotype.export==='object')S.ph.export=data.phenotype.export;
  } else if(data.app==='fenotipos'){
    if(Array.isArray(data.samples))S.ph.samples=data.samples;
    if(Array.isArray(data.options))S.ph.options=data.options;
    if(Array.isArray(data.presets))S.ph.presets=data.presets;
  }
  if(data.phenotype&&data.phenotype.picker)S.ph.picker=(data.phenotype.picker==='dial')?'dial':'list';
  if(data.settings)applySettings(data.settings);
  if(data.assets&&typeof data.assets==='object'){
    const st=assetStore();
    Object.keys(data.assets).forEach(k=>{if(!st[k]&&typeof data.assets[k]==='string')st[k]=data.assets[k];});
  }
  if(Array.isArray(data.strategies))S.strategies=data.strategies;
  if(data.agenda&&typeof data.agenda==='object')S.agenda=data.agenda;
  if(Array.isArray(data.notes))S.notes=data.notes;
  if(Array.isArray(data.noteCats))S.noteCats=data.noteCats;
  /* Archivos de versiones anteriores, cuando las notas se llamaban «feedback». */
  if(Array.isArray(data.feedback))S.feedback=data.feedback;
  if(Array.isArray(data.reports))S.reports=data.reports;
  if(data.reportPresets&&typeof data.reportPresets==='object')S.reportPresets=data.reportPresets;
  migrateProjects();phMigrate();reportMigrate();notesMigrate();agMigrate();stMigrate();assetsNormalizarImportado();
}

function phLinksFor(pid,sid){return S.ph.samples.filter(s=>s.link&&s.link.pid===pid&&s.link.sid===sid);}
function resolveLink(link){if(!link)return null;const p=proj(link.pid);if(!p)return{missing:true};const sm=(p.samples||[]).find(x=>x.id===link.sid);if(!sm)return{missing:true,project:p};return{project:p,sample:sm};}
function openLinkPhenoModal(pid,sid){

function phCreateSample(){const s={id:uid(),title:uniqueName('Nuevo fenotipo',phNames(),'Fenotipo'),desc:'',createdAt:new Date().toISOString(),link:null,markers:NEW_SAMPLE_MARKERS.map(n=>({id:uid(),name:n})),populations:[]};S.ph.samples.unshift(s);save();phOpenSample(s.id);}
function phDeleteSample(id){const s=phSample(id);if(!s)return;if(!confirm('¿Eliminar el fenotipo "'+s.title+'"? No se puede deshacer.'))return;S.ph.samples=S.ph.samples.filter(x=>x.id!==id);if(V.fsid===id){V.fsid=null;V.fpage='home';}save();renderAll();toast('Fenotipo eliminado',{icon:'trash'});}
function phSetTitle(id,v,el){const s=phSample(id);if(!s)return;const asked=nmu(v).trim()||s.title||'Sin título';const uname=uniqueName(asked,phNames(id),'Fenotipo');s.title=uname;save();renderSidebar();if(el&&el.value!==uname)el.value=uname;uniqToast(asked,uname);}
function phSetDesc(id,v){const s=phSample(id);if(s){s.desc=v;save();}}
function phAddMarker(id){const s=phSample(id);if(!s)return;s.markers.push({id:uid(),name:'Nuevo',seq:phMaxSeq(s.markers)+1});save();phRefreshMatrix(s);}
function phRenameMarker(id,mid,v){const s=phSample(id);if(!s)return;const m=s.markers.find(x=>x.id===mid);if(m){m.name=v;save();}}
function phRemoveMarker(id,mid){const s=phSample(id);if(!s)return;s.markers=s.markers.filter(x=>x.id!==mid);s.populations.forEach(p=>{delete p.values[mid];});save();phRefreshMatrix(s);}
function phMoveMarker(id,mid,dir){const s=phSample(id);if(!s)return;const i=s.markers.findIndex(m=>m.id===mid),j=i+dir;if(i<0||j<0||j>=s.markers.length)return;const t=s.markers[i];s.markers[i]=s.markers[j];s.markers[j]=t;save();phRefreshMatrix(s);}
function phMovePop(id,pid,dir){const s=phSample(id);if(!s)return;const i=s.populations.findIndex(p=>p.id===pid),j=i+dir;if(i<0||j<0||j>=s.populations.length)return;const t=s.populations[i];s.populations[i]=s.populations[j];s.populations[j]=t;save();phRefreshMatrix(s);}
function phMaxSeq(arr){let m=0;arr.forEach(x=>{if((x.seq||0)>m)m=x.seq;});return m;}
function phOrderedMarkers(s){const mode=s.markSort||'custom';const a=s.markers.slice();if(mode==='alpha')a.sort((x,y)=>(x.name||'').localeCompare(y.name||'','es',{numeric:true,sensitivity:'base'}));else if(mode==='created')a.sort((x,y)=>(x.seq||0)-(y.seq||0));return a;}
function phOrderedPops(s){const mode=s.popSort||'custom';const a=s.populations.slice();if(mode==='alpha')a.sort((x,y)=>(x.title||'').localeCompare(y.title||'','es',{numeric:true,sensitivity:'base'}));else if(mode==='created')a.sort((x,y)=>(x.seq||0)-(y.seq||0));return a;}
function phSetPopSort(id,v){const s=phSample(id);if(s){s.popSort=v;save();phRefreshMatrix(s);}}
function phSetMarkSort(id,v){const s=phSample(id);if(s){s.markSort=v;save();phRefreshMatrix(s);}}
/* Ventana de reordenación con arrastre fluido */
let reoDrag=null;
function phSetSortCustom(sid,kind){const s=phSample(sid);if(!s)return;if(kind==='pop')s.popSort='custom';else s.markSort='custom';save();phRefreshMatrix(s);phOpenReorder(sid);}
function phOpenReorder(sid){
  const s=phSample(sid);if(!s)return;
  const popCustom=(s.popSort||'custom')==='custom';
  const mkCustom=(s.markSort||'custom')==='custom';
  const col=(kind,label,items,custom)=>`<div class="reo-col"><div class="reo-hd">${label}${custom?'':`<button class="btn btn-g sm" onclick="phSetSortCustom('${sid}','${kind}')">Activar personalizado</button>`}</div>`
    +`<div class="reo-list${custom?'':' locked'}" data-kind="${kind}">${items.map(it=>`<div class="reo-item" draggable="${custom?'true':'false'}" data-id="${it.id}">${ic('menu',15)}<span>${esc(it.title||it.name||'—')}</span></div>`).join('')}</div>`
    +`${custom?'':'<div class="reo-note">Cambia el orden a «Personalizado» para poder arrastrar.</div>'}</div>`;
  openModalHTML(`<div class="modal" style="width:min(760px,96vw)"><div class="mtit"><span class="mtit-ic">${ic('arrow-up-down',19)}</span>Reordenar</div><p class="sub" style="margin-top:2px">Arrastra los elementos para reorganizarlos. El orden solo se aplica en modo «Personalizado».</p><div class="reo-wrap">${col('pop','Poblaciones',phOrderedPops(s),popCustom)}${col('mk','Marcadores',phOrderedMarkers(s),mkCustom)}</div><div class="mact"><button class="btn btn-p sm" onclick="closeModal()">Hecho</button></div></div>`);

function phReoAfter(list,y){const els=[...list.querySelectorAll('.reo-item:not(.drag)')];let res=null,min=-Infinity;els.forEach(el=>{const b=el.getBoundingClientRect();const off=y-b.top-b.height/2;if(off<0&&off>min){min=off;res=el;}});return res;}
function phCommitReorder(sid,list){const s=phSample(sid);if(!s)return;const ids=[...list.querySelectorAll('.reo-item')].map(el=>el.dataset.id);const idx=id=>{const i=ids.indexOf(id);return i<0?9999:i;};if(list.dataset.kind==='pop')s.populations.sort((a,b)=>idx(a.id)-idx(b.id));else s.markers.sort((a,b)=>idx(a.id)-idx(b.id));save();phRefreshMatrix(s);}
function phWireReorder(sid){
  document.querySelectorAll('.reo-list:not(.locked)').forEach(list=>{
    list.querySelectorAll('.reo-item').forEach(it=>{
      it.addEventListener('dragstart',e=>{reoDrag=it;setTimeout(()=>it.classList.add('drag'),0);e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain','x');}catch(_){}});

    list.addEventListener('dragover',e=>{if(!reoDrag||reoDrag.parentNode!==list)return;e.preventDefault();const after=phReoAfter(list,e.clientY);if(after==null)list.appendChild(reoDrag);else list.insertBefore(reoDrag,after);});
  });

/* Actualiza sólo la celda tocada y lo que depende de ella (su columna y el
   resumen), en vez de volver a pintar toda la matriz: con 1.275 celdas eso
   costaba ~370 ms por clic. */
function phUpdateCell(s,pid,mid){
  const table=document.querySelector('.mtx-wrap table.mtx');
  if(!table){phRefreshMatrix(s);return;}
  const p=s.populations.find(x=>x.id===pid);
  const td=table.querySelector('tr[data-pid="'+pid+'"] td.cell[data-mid="'+mid+'"]');
  if(!p||!td){phRefreshMatrix(s);return;}
  td.innerHTML=phCellSelect(s.id,pid,mid,p.values[mid]);
  /* La clasificación del marcador puede haber cambiado con este valor */
  const cls=phClassifyValues(s.populations.map(x=>x.values[mid]));
  const chip=table.querySelector('th.mk-th[data-mid="'+mid+'"] .mk-chip');
  if(chip){chip.classList.toggle('diff',cls==='diff');chip.classList.toggle('common',cls==='common');}
  table.querySelectorAll('td.cell[data-mid="'+mid+'"]').forEach(c=>c.classList.toggle('diff',cls==='diff'));
  const st=phMarkerPct(s,{id:mid});
  [['st-pos','pos','pp'],['st-neg','neg','np'],['st-het','het','hp']].forEach(([rc,nk,pk])=>{
    const cell=table.querySelector('tr[data-row="'+rc+'"] td.mk-stat[data-mid="'+mid+'"]');
    if(cell)cell.innerHTML=phStatCell(st,rc,nk,pk);
  });

}

function phMatrixHead(s){

function phMatrixRows(s){

// Categoría de un valor según la opción de expresión ('pos'|'neg'|'het'|'')
function phCatOf(id){if(!id)return '';const o=S.ph.options.find(x=>x.id===id);return (o&&o.cat)?o.cat:'';}
function phIsNA(id){const o=S.ph.options.find(x=>x.id===id);return !!(o&&o.na);}
// % de +, − y het de un marcador sobre las poblaciones clasificadas (base = pos+neg+het; NA y no clasificadas se excluyen)
function phMarkerPct(s,m){let pos=0,neg=0,het=0;s.populations.forEach(p=>{const c=phCatOf(p.values[m.id]);if(c==='pos')pos++;else if(c==='neg')neg++;else if(c==='het')het++;});const base=pos+neg+het;return {pos,neg,het,base,pp:base?Math.round(pos/base*100):0,np:base?Math.round(neg/base*100):0,hp:base?Math.round(het/base*100):0};}
// Fila inferior de la matriz
function phStatCell(st,cls,nKey,pKey){
  if(!st.base)return '<span class="stat-empty">·</span>';
  return '<span class="stat-cell"><b class="stat-n">'+st[nKey]+'</b><span class="stat-p">'+st[pKey]+'%</span></span>';
}
function phMatrixFoot(s){
  const oms=phOrderedMarkers(s);
  const stats=oms.map(m=>phMarkerPct(s,m));
  const row=(cls,label,nKey,pKey)=>'<tr class="mtx-stat" data-row="'+cls+'"><th class="corner '+cls+'"><span class="stat-lbl">'+label+'</span><span class="stat-sub">n · %</span></th>'+stats.map((st,i)=>
      '<td class="mk-stat '+cls+'" data-mid="'+oms[i].id+'">'+phStatCell(st,cls,nKey,pKey)+'</td>'
    ).join('')+'<td></td></tr>';
  return row('st-pos','Positivo','pos','pp')+row('st-neg','Negativo','neg','np')+row('st-het','Heterogéneo','het','hp');
}
// Actualiza solo la tabla y la barra de detección sin re-renderizar toda la vista (conserva el scroll y evita el "salto")
function phRefreshMatrix(s){
  const scroll=document.getElementById('scroll');
  const wrap=document.querySelector('.mtx-wrap');
  const table=wrap?wrap.querySelector('table.mtx'):null;
  if(!table){renderMain();return;}
  const top=scroll?scroll.scrollTop:0;
  const left=wrap.scrollLeft;
  table.innerHTML=`<thead>${phMatrixHead(s)}</thead><tbody>${phMatrixRows(s)}</tbody><tfoot>${phMatrixFoot(s)}</tfoot>`;
  wrap.scrollLeft=left;
  const ab=document.getElementById('phAutobar');
  if(ab){const tmp=document.createElement('div');tmp.innerHTML=phAutobar(s).trim();if(tmp.firstChild)ab.replaceWith(tmp.firstChild);}
  const tc=document.querySelector('.tool-count');if(tc)tc.textContent=s.markers.length;
  const pc=document.querySelector('.pop-count');if(pc)pc.textContent=s.populations.length;
  if(scroll)scroll.scrollTop=top;
}
/* ── Ancho de la columna de poblaciones ──
   Se guarda por fenotipo y se arrastra desde el borde derecho de la columna.
   Por debajo de POP_W_FULL ya no caben los campos sin recortarse, así que la
   columna pasa a mostrar sólo el nombre de la población en vertical. */
const POP_W_MIN=56,POP_W_MAX=460,POP_W_DEF=246,POP_W_FULL=226;
function phPopW(s){const w=parseInt(s&&s.popW,10);return isFinite(w)&&w>0?Math.max(POP_W_MIN,Math.min(POP_W_MAX,w)):POP_W_DEF;}
function phApplyPopW(table,w){
  if(!table)return;
  table.style.setProperty('--popw',Math.round(w)+'px');
  table.classList.toggle('pop-narrow',w<POP_W_FULL);
}
let _popRz=null;
function phPopResizeStart(ev,sid){
  if(ev.button!==undefined&&ev.button!==0)return;
  const s=phSample(sid);if(!s)return;
  const table=document.querySelector('.mtx-wrap table.mtx');if(!table)return;
  ev.preventDefault();ev.stopPropagation();
  _popRz={sid,x0:ev.clientX,w0:phPopW(s),w:phPopW(s),table};
  document.body.classList.add('col-resizing');
  window.addEventListener('mousemove',phPopResizeMove);
  window.addEventListener('mouseup',phPopResizeEnd);
}
function phPopResizeMove(ev){
  if(!_popRz)return;
  _popRz.w=Math.max(POP_W_MIN,Math.min(POP_W_MAX,_popRz.w0+(ev.clientX-_popRz.x0)));
  phApplyPopW(_popRz.table,_popRz.w);
}
function phPopResizeEnd(){
  window.removeEventListener('mousemove',phPopResizeMove);
  window.removeEventListener('mouseup',phPopResizeEnd);
  document.body.classList.remove('col-resizing');
  if(!_popRz)return;
  const s=phSample(_popRz.sid);
  if(s&&Math.round(_popRz.w)!==Math.round(_popRz.w0)){s.popW=Math.round(_popRz.w);save();}
  _popRz=null;
}

function phViewSample(s){

/* ════════ MENÚ EMERGENTE ════════
   Sustituye a la lista nativa del sistema: una única instancia reutilizable
   para todos los desplegables de la app. Además de verse acorde con el resto
   de la interfaz, evita tener que crear un <option> por celda en la matriz de
   fenotipos (con 17 marcadores x 75 poblaciones eran ~13.000 nodos). */
let MENU=null;
function menuClose(){
  if(!MENU)return;
  const m=MENU;MENU=null;
  window.removeEventListener('pointerdown',menuOutside,true);
  window.removeEventListener('keydown',menuKey,true);
  window.removeEventListener('resize',menuClose);
  window.removeEventListener('wheel',menuWheel,true);
  if(m.el&&m.el.parentNode)m.el.parentNode.removeChild(m.el);
  if(m.anchor&&m.anchor.isConnected)m.anchor.classList.remove('mnu-open');
}
function menuOutside(ev){if(MENU&&!MENU.el.contains(ev.target))menuClose();}
function menuWheel(ev){if(MENU&&!MENU.el.contains(ev.target))menuClose();}
function menuKey(ev){
  if(!MENU)return;
  const k=ev.key;
  if(k==='Escape'){ev.preventDefault();ev.stopPropagation();menuClose();return;}
  if(k==='Tab'){menuClose();return;}
  const items=MENU.items,n=items.length;
  if(k==='ArrowDown'||k==='ArrowUp'){
    ev.preventDefault();ev.stopPropagation();
    let i=MENU.sel;
    for(let s=0;s<n;s++){i=(i+(k==='ArrowDown'?1:-1)+n)%n;if(!items[i].disabled)break;}
    menuHighlight(i);return;
  }
  if(k==='Home'||k==='End'){ev.preventDefault();menuHighlight(k==='Home'?0:n-1);return;}
  if(k==='Enter'||k===' '){ev.preventDefault();ev.stopPropagation();menuPick(MENU.sel);return;}
  if(k.length===1){
    const c=k.toLowerCase();
    const i=items.findIndex((it,j)=>j>MENU.sel&&String(it.label).toLowerCase().startsWith(c));
    const j=i>=0?i:items.findIndex(it=>String(it.label).toLowerCase().startsWith(c));
    if(j>=0)menuHighlight(j);
  }
}
function menuHighlight(i){
  if(!MENU)return;
  MENU.sel=i;
  const els=MENU.el.querySelectorAll('.mnu-i');
  els.forEach((e,j)=>e.classList.toggle('on',j===i));
  const cur=els[i];if(cur)cur.scrollIntoView({block:'nearest'});
}
function menuPick(i){
  if(!MENU)return;
  const it=MENU.items[i];
  if(!it||it.disabled)return;
  const cb=MENU.onPick;menuClose();
  if(cb)cb(it.value,it);
}
/* anchor: elemento al que se ancla · items: [{value,label,color,sub,disabled}] */
function menuOpen(anchor,o){
  menuClose();
  const items=(o.items||[]).slice();
  if(!items.length)return;
  const el=document.createElement('div');
  el.className='mnu'+(o.cls?' '+o.cls:'');
  el.setAttribute('role','listbox');
  el.innerHTML=items.map((it,i)=>{
    const on=(it.value===o.value);
    return '<button class="mnu-i'+(on?' cur':'')+(it.disabled?' dis':'')+'" role="option" data-i="'+i+'"'+(it.disabled?' disabled':'')+'>'
      +(it.color?'<span class="mnu-sw" style="background:'+it.color+'"></span>':(o.swatches?'<span class="mnu-sw mnu-sw-none"></span>':''))
      +'<span class="mnu-t">'+esc(it.label)+'</span>'
      +(it.sub?'<span class="mnu-s">'+esc(it.sub)+'</span>':'')
      +'<span class="mnu-c">'+(on?ic('check',15):'')+'</span></button>';
  }).join('');
  document.body.appendChild(el);

  /* Colocación: debajo del ancla y, si no cabe, encima; siempre dentro de la ventana. */
  const r=anchor.getBoundingClientRect();
  const min=Math.max(o.minWidth||0,r.width);
  el.style.minWidth=min+'px';
  const mw=el.offsetWidth,vh=window.innerHeight,vw=window.innerWidth,pad=8;
  const espacioAbajo=vh-r.bottom-pad, espacioArriba=r.top-pad;
  const maxH=Math.max(120,Math.min(340,Math.max(espacioAbajo,espacioArriba)));
  el.style.maxHeight=maxH+'px';
  const mh=Math.min(el.offsetHeight,maxH);
  const arriba=(espacioAbajo<mh&&espacioArriba>espacioAbajo);
  let top=arriba?(r.top-mh-4):(r.bottom+4);
  top=Math.max(pad,Math.min(vh-mh-pad,top));
  let left=(o.align==='right')?(r.right-mw):r.left;
  left=Math.max(pad,Math.min(vw-mw-pad,left));
  el.style.top=top+'px';el.style.left=left+'px';
  el.classList.add(arriba?'up':'down');

  anchor.classList.add('mnu-open');
  MENU={el,items,onPick:o.onPick,anchor,sel:Math.max(0,items.findIndex(it=>it.value===o.value))};
  el.addEventListener('pointerdown',e=>e.stopPropagation());
  el.addEventListener('click',e=>{
    const b=e.target.closest('.mnu-i');
    if(b)menuPick(+b.dataset.i);
  });
  el.addEventListener('pointermove',e=>{
    const b=e.target.closest('.mnu-i');
    if(b&&!b.disabled)menuHighlight(+b.dataset.i);
  });
  menuHighlight(MENU.sel);
  window.addEventListener('pointerdown',menuOutside,true);
  window.addEventListener('keydown',menuKey,true);
  window.addEventListener('resize',menuClose);
  window.addEventListener('wheel',menuWheel,true);
}
/* Los <select> de la app abren este menú en lugar de la lista del sistema. */
document.addEventListener('mousedown',function(ev){
  const s=ev.target&&ev.target.closest?ev.target.closest('select.sel'):null;
  if(!s||s.disabled||!s.options.length)return;
  ev.preventDefault();
  if(MENU&&MENU.anchor===s){menuClose();return;}
  menuOpen(s,{
    items:[].map.call(s.options,function(o){return {value:o.value,label:o.textContent,disabled:o.disabled};}),
    value:s.value,minWidth:s.offsetWidth,
    onPick:function(v){
      if(v===s.value)return;
      s.value=v;
      s.dispatchEvent(new Event('input',{bubbles:true}));
      s.dispatchEvent(new Event('change',{bubbles:true}));
    }
  });
},true);
/* Menú de expresión de una celda de la matriz */
function phCellMenu(ev,sid,pid,mid){

/* ════════ SELECTOR ORBITAL DE EXPRESIÓN ════════
   Al mantener pulsada una celda se abre una corona segmentada centrada en ella:
   cada sector es una expresión y se resalta aquel hacia el que apunta el ratón.
   Al soltar se asigna el resaltado; soltar en el centro (o Escape) cancela.
   Si la pulsación es breve la corona se queda abierta y basta con hacer clic. */
let DIAL=null;
function phDialOptions(){
  return [{id:'',label:'Vaciar',clear:true}].concat(S.ph.options.map(o=>({id:o.id,label:o.label,color:o.color})));
}
function phDialArc(cx,cy,r0,r1,a0,a1){
  const P=(r,a)=>((cx+r*Math.cos(a)).toFixed(2)+' '+(cy+r*Math.sin(a)).toFixed(2));
  const big=(a1-a0)>Math.PI?1:0;
  return 'M'+P(r1,a0)+'A'+r1+' '+r1+' 0 '+big+' 1 '+P(r1,a1)+'L'+P(r0,a1)+'A'+r0+' '+r0+' 0 '+big+' 0 '+P(r0,a0)+'Z';
}
function phDialSvg(opts,cx,cy,R){
  const r0=R*0.38,n=opts.length,step=2*Math.PI/n,gap=Math.min(0.03,step*0.06);
  const org='transform-origin:'+cx+'px '+cy+'px';
  let seg='';
  for(let i=0;i<n;i++){
    const a0=-Math.PI/2+i*step+gap,a1=-Math.PI/2+(i+1)*step-gap;
    const o=opts[i];
    const fill=o.clear?'var(--sf3)':o.color;
    const fg=o.clear?'var(--tx2)':textColor(o.color);
    const mid=(a0+a1)/2,rm=(r0+R)/2;
    seg+='<g class="dial-seg" data-i="'+i+'" style="'+org+'">'
      +'<path d="'+phDialArc(cx,cy,r0,R,a0,a1)+'" fill="'+fill+'"></path>'
      +'<text x="'+(cx+rm*Math.cos(mid)).toFixed(1)+'" y="'+(cy+rm*Math.sin(mid)).toFixed(1)+'" fill="'+fg+'">'+esc(o.label)+'</text>'
      +'</g>';
  }
  return '<svg class="dial-svg"><defs><filter id="dialSh" x="-40%" y="-40%" width="180%" height="180%">'
    +'<feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="rgba(8,16,26,.34)"/></filter></defs>'
    +'<g class="dial-ring" style="'+org+';filter:url(#dialSh)">'+seg+'</g>'
    +'<circle class="dial-hub" cx="'+cx+'" cy="'+cy+'" r="'+(r0-5).toFixed(1)+'" style="'+org+'"></circle>'
    +'<text class="dial-lbl" x="'+cx+'" y="'+cy+'"></text></svg>';
}
function phDialDown(ev,sid,pid,mid){
  if(ev.button!==undefined&&ev.button!==0)return;
  ev.preventDefault();
  phDialClose();
  const opts=phDialOptions();
  const rc=ev.currentTarget.getBoundingClientRect();
  const R=Math.max(108,Math.min(158,52+opts.length*10));
  const pad=12;
  const cx=Math.max(R+pad,Math.min(window.innerWidth-R-pad,rc.left+rc.width/2));
  const cy=Math.max(R+pad,Math.min(window.innerHeight-R-pad,rc.top+rc.height/2));
  const root=document.createElement('div');
  root.className='dial-ov';
  root.innerHTML=phDialSvg(opts,cx,cy,R);
  document.body.appendChild(root);
  DIAL={sid,pid,mid,opts,cx,cy,r0:R*0.38,sel:-1,t0:Date.now(),sticky:false,root};
  window.addEventListener('pointermove',phDialMove);
  window.addEventListener('pointerup',phDialUp);
  window.addEventListener('keydown',phDialKey,true);
  phDialHighlight(-1);
}
function phDialIndex(x,y){
  if(!DIAL)return -1;
  const dx=x-DIAL.cx,dy=y-DIAL.cy;
  if(Math.hypot(dx,dy)<DIAL.r0*0.85)return -1;
  let a=Math.atan2(dy,dx)+Math.PI/2;
  a=(a%(2*Math.PI)+2*Math.PI)%(2*Math.PI);
  const i=Math.floor(a/(2*Math.PI/DIAL.opts.length));
  return (i>=0&&i<DIAL.opts.length)?i:-1;
}
function phDialHighlight(i){
  if(!DIAL)return;
  DIAL.sel=i;
  DIAL.root.querySelectorAll('.dial-seg').forEach(g=>g.classList.toggle('on',+g.dataset.i===i));
  const t=DIAL.root.querySelector('.dial-lbl');
  if(t)t.textContent=i>=0?DIAL.opts[i].label:'';
}
function phDialMove(ev){if(DIAL)phDialHighlight(phDialIndex(ev.clientX,ev.clientY));}
function phDialCommit(i){
  if(!DIAL)return;
  const d=DIAL;phDialClose();
  if(i>=0)phSetValue(d.sid,d.pid,d.mid,d.opts[i].id);
}
function phDialUp(ev){
  if(!DIAL)return;
  const i=phDialIndex(ev.clientX,ev.clientY);
  if(i>=0){phDialCommit(i);return;}
  if(!DIAL.sticky&&Date.now()-DIAL.t0<220){
    DIAL.sticky=true;DIAL.root.classList.add('sticky');
    window.addEventListener('pointerdown',phDialStickyPick,true);
    return;
  }
  phDialClose();
}
function phDialStickyPick(ev){
  if(!DIAL)return;
  ev.preventDefault();ev.stopPropagation();
  phDialCommit(phDialIndex(ev.clientX,ev.clientY));
}
function phDialKey(ev){if(DIAL&&ev.key==='Escape'){ev.preventDefault();ev.stopPropagation();phDialClose();}}
function phDialClose(){
  window.removeEventListener('pointermove',phDialMove);
  window.removeEventListener('pointerup',phDialUp);
  window.removeEventListener('pointerdown',phDialStickyPick,true);
  window.removeEventListener('keydown',phDialKey,true);
  if(DIAL&&DIAL.root&&DIAL.root.parentNode)DIAL.root.parentNode.removeChild(DIAL.root);
  DIAL=null;
}
window.addEventListener('resize',()=>{if(DIAL)phDialClose();});
function phLegend(){
  return `<div class="legend"><div class="grp"><span class="tag">Marcadores:</span><span class="it"><span class="dot" style="background:var(--diff-solid)"></span> Separa poblaciones</span><span class="it"><span class="dot" style="background:var(--common-tx)"></span> Misma expresión</span></div><div class="div"></div><div class="grp"><span class="tag">Escala:</span>${S.ph.options.map(o=>`<span class="it"><span class="sw" style="background:${o.color}"></span> ${esc(o.label)}</span>`).join('')}</div></div>`;
}
function phCmpKey(sid,pid){return sid+'|'+pid;}
function phCmpToggle(sid,pid){const k=phCmpKey(sid,pid);if(V.cmp.some(x=>phCmpKey(x.sid,x.pid)===k))V.cmp=V.cmp.filter(x=>phCmpKey(x.sid,x.pid)!==k);else V.cmp.push({sid,pid});renderMain();}
function phViewCompare(){

  const rows=V.cmp.map(({sid,pid})=>{const sm=phSample(sid);if(!sm)return null;const p=sm.populations.find(x=>x.id===pid);if(!p)return null;const byName={};sm.markers.forEach(m=>{byName[m.name]=p.values[m.id];});return {sampleTitle:sm.title,popTitle:p.title,byName};}).filter(Boolean);
  let table='';

    const body=rows.map(r=>`<tr><th class="pop-th"><div style="padding:10px;color:var(--tx);font-size:13px">${esc(r.sampleTitle)}</div></th><th class="pop-th"><div style="padding:10px;color:var(--tx);font-size:13px;font-weight:600">${esc(r.popTitle)}</div></th>${names.map(n=>{const o=S.ph.options.find(x=>x.id===r.byName[n]);const bg=o?o.color:'var(--sf2)';const fg=o?textColor(o.color):'var(--tx3)';return `<td class="cell ${cls[n]==='diff'?'diff':''}"><div class="cell-sel" style="background:${bg};color:${fg};cursor:default">${o?esc(o.label):'·'}</div></td>`;}).join('')}</tr>`).join('');
    table=`<div style="display:flex;justify-content:flex-end;margin:18px 0 8px"><button class="btn btn-g" onclick="phOpenExportCompare()">${ic('download',16)} Exportar</button></div><div class="mtx-wrap"><table class="mtx"><thead>${head}</thead><tbody>${body}</tbody></table></div>${phLegend()}`;
  }
  return `<button class="back-btn" onclick="phHome()">${ic('arrow-left',15)} Fenotipos</button><div class="eyebrow">Fenotipos · Análisis</div><h1 class="title">Comparar poblaciones</h1><p class="sub">Selecciona poblaciones de cualquier fenotipo. Se alinean por nombre de marcador y se resaltan diferencias y coincidencias.</p>${picker}${table}`;
}

function safeName(s){return (s||'muestra').replace(/[^0-9A-Za-zÀ-ÿ_-]+/g,'_').slice(0,60);}
function downloadText(name,text,type){const blob=new Blob([text],{type:type||'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function toCSV(aoa){return '﻿'+aoa.map(r=>r.map(c=>{c=c==null?'':String(c);return /[";\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(';')).join('\r\n');}
function toTSV(aoa){return aoa.map(r=>r.map(c=>c==null?'':String(c)).join('\t')).join('\n');}
// Genera un .xlsx real con celdas de texto (inlineStr): los valores salen tal cual, sin "=" ni "'"
function xlCol(n){let s='';while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26);}return s;}
function xlIsNum(v){const s=String(v==null?'':v).trim();return s!==''&&/^[+-]?[\d.,]+$/.test(s)&&/\d/.test(s);}
function buildXlsx(aoa,sheetName){

    if(xlIsNum(sv)){const n=celNum(sv);if(n!=null){cells+='<c r="'+ref+'" t="n"><v>'+n+'</v></c>';return;}}
    cells+='<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+xe(sv)+'</t></is></c>';});rows+='<row r="'+(ri+1)+'">'+cells+'</row>';});
  const sheet='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>'+rows+'</sheetData></worksheet>';
  const wb='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="'+xe(sheetName)+'" sheetId="1" r:id="rId1"/></sheets></workbook>';
  const wbRels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>';

function phMarkerSort(a,b){return (a.name||'').localeCompare(b.name||'','es',{numeric:true,sensitivity:'base'});}
/* Orden de exportación. Por defecto («view») se respeta el que esté seleccionado
   en el fenotipo en ese momento: alfanumérico, creación o personalizado. */
function phExportOrder(){const o=S.ph.export&&S.ph.export.order;return (o==='panel'||o==='alpha')?o:'view';}
function phExportMarkers(s){
  const mode=phExportOrder();

}
function phExportPops(s){

const ZOOM_STEPS=[70,80,90,100,110,125,150,175,200];

function zoomStep(dir){const cur=S.scale||100;let idx=ZOOM_STEPS.findIndex(x=>x>=cur);if(idx<0)idx=ZOOM_STEPS.length-1;if(dir>0){const nxt=ZOOM_STEPS.find(x=>x>cur);zoomSet(nxt||cur);}else{const lower=[...ZOOM_STEPS].reverse().find(x=>x<cur);zoomSet(lower||cur);}toast('Escala '+(S.scale)+'%',{icon:'search'});}

function phPopMeta(p){const f=(p.freq||'').toString().trim();const c=(p.count||'').toString().trim();const parts=[];if(f)parts.push(f+'%');if(c)parts.push(c+' células/µl');return parts.length?' ('+parts.join('; ')+')':'';}
// Etiqueta para TXT: "het"→"heterog" y las "d" (intensidad débil)→"débil"
function phTxtLabel(id){let l=phLabelOf(id);if(!l)return '';const e=S.ph.export||{};let out=l;if(e.convertHet!==false)out=out.replace(/het/gi,(e.hetWord||'heterog'));if(e.convertD!==false)out=out.replace(/d/g,(e.dWord||'débil'));return out.replace(/−/g,'-');}
function phXlLabel(id){return phLabelOf(id).replace(/−/g,'-');}
function phHasVal(v){return v!=null&&v!=='';}
// Datos para .xlsx: la expresión se escribe tal cual (sin "=" ni "'") porque las celdas son de tipo texto. Se omiten los marcadores sin expresión en ninguna población.
function phSampleAOA(s){
  const cls=phClassifySample(s);
  const pops=phExportPops(s);
  const used=phExportMarkers(s).filter(m=>s.populations.some(p=>phHasVal(p.values[m.id])));
  const header=['Población','Identificador','Frecuencia (%)','Valor absoluto (cél/uL)',...used.map(m=>m.name),'Comentario'];
  const rows=pops.map(p=>[p.title,p.ident||'',p.freq||'',p.count||'',...used.map(m=>phXlLabel(p.values[m.id])),p.comment||'']);
  const tipo=['Tipo','','','',...used.map(m=>phClsLabel(cls[m.id])),''];
  const stat=(label,key)=>[label,'','',''].concat(used.map(m=>phMarkerPct(s,m)[key])).concat(['']);
  return [['Muestra: '+s.title],s.desc?['Descripción: '+s.desc]:[],['Nº total de poblaciones: '+s.populations.length],[],header,...rows,[],tipo,[],stat('n positivo','pos'),stat('n negativo','neg'),stat('n heterogéneo','het'),[],stat('% positivo','pp'),stat('% negativo','np'),stat('% heterogéneo','hp')];
}
// TXT: formato lineal por población (Nombre (freq%; abs células/μl): marcadores), orden alfabético/numérico. Se omiten los marcadores sin expresión en cada población.
function phSampleTXT(s){
  const markers=phExportMarkers(s);
  const out=['Muestra: '+s.title];
  if(s.desc)out.push('Descripción: '+s.desc);
  out.push('Nº total de poblaciones: '+s.populations.length);
  out.push('');
  if(!s.populations.length)out.push('(Sin poblaciones)');
  phExportPops(s).forEach(p=>{
    const items=markers.filter(m=>phHasVal(p.values[m.id])).map(m=>m.name+phTxtLabel(p.values[m.id]));
    let line=p.title+((p.ident||'').trim()?' ['+p.ident.trim()+']':'')+phPopMeta(p)+': '+items.join(', ')+'.';
    if((p.comment||'').trim())line+='\n    Comentario: '+p.comment.trim();
    out.push(line);
  });
  const pct=markers.map(m=>({m,r:phMarkerPct(s,m)})).filter(x=>x.r.base>0);
  if(pct.length){
    out.push('');
    out.push('% de expresión (positivo / negativo / heterogéneo):');
    pct.forEach(x=>out.push('  '+x.m.name+': '+x.r.pp+' / '+x.r.np+' / '+x.r.hp));
  }
  return out.join('\n');
}
function phExportSample(id,kind){const s=phSample(id);if(!s)return;closeModal();if(kind==='xlsx')saveExportBytes(safeName(s.title)+'.xlsx',buildXlsx(phSampleAOA(s),s.title),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');else saveExportText(safeName(s.title)+'.txt',phSampleTXT(s),'text/plain;charset=utf-8');}
function phCompareAOA(){const rows=V.cmp.map(({sid,pid})=>{const sm=phSample(sid);if(!sm)return null;const p=sm.populations.find(x=>x.id===pid);if(!p)return null;const byName={};sm.markers.forEach(m=>{byName[m.name]=p.values[m.id];});return {st:sm.title,pt:p.title,byName};}).filter(Boolean);const names=[];rows.forEach(r=>Object.keys(r.byName).forEach(n=>{if(!names.includes(n))names.push(n);}));const cls={};names.forEach(n=>{cls[n]=phClassifyValues(rows.map(r=>r.byName[n]));});const header=['Muestra','Población',...names];const body=rows.map(r=>[r.st,r.pt,...names.map(n=>phXlLabel(r.byName[n]))]);const tipo=['','Tipo',...names.map(n=>phClsLabel(cls[n]))];return [header,...body,[],tipo];}

/* ════════════════════════════════════════════════════════════
   ESTRATEGIAS DE GATING
   Una estrategia reúne cuatro cosas: la secuencia de capturas del gating (de 1
   a 10, con su etiqueta de eje), el mix de anticuerpos en tabla, el fenotipo de
   la población y el porcentaje aproximado.

   Las capturas se reducen y se guardan en el almacén de imágenes compartido
   (una sola copia por contenido), que es lo que evita que el archivo de datos
   se dispare al pegar decenas de pantallazos.

   Exportación: PNG dibujado en un lienzo y PDF generado como HTML. Ambos usan
   la misma retícula y la misma paleta, así que salen iguales.
   ════════════════════════════════════════════════════════════ */

const ST_MAX_STEPS=10;
const ST_MAX_PX=2600;          // lado mayor al que se reduce cada captura
const ST_AXIS_COLORS=['#12A793','#2E86D4','#7C5CFC','#E0962B','#D0497E','#5E9920','#E5484D','#0EA5C9','#6B7682','#C0560E'];
/* Paleta de los archivos exportados. Fija a propósito: un PNG o un PDF no
   deben cambiar de color según el tema que tenga puesto la app. */
const ST_EXP={
  papel:'#FFFFFF', panel:'#F5F8F9', panel2:'#FFFFFF',
  filete:'#DFE7EA', filete2:'#C9D6DB',
  tinta:'#14222B', tinta2:'#5B6B75', tinta3:'#8A99A2',
  marca1:'#25C0A6', marca2:'#0D8676', marca3:'#0A5249',
  cabecera:'#0B6B5F'
};

/* Escala del PNG. 3× sobre una hoja de 1400 pt son 4200 px de ancho, de sobra
   para imprimir o para insertar en una presentación. */
const ST_ESCALAS=[{v:2,n:'Estándar'},{v:3,n:'Alta'},{v:4,n:'Máxima'}];
function stEscala(){const v=parseInt(S.stScale,10);return ST_ESCALAS.some(x=>x.v===v)?v:3;}
function stSetEscala(v){S.stScale=parseInt(v,10)||3;save();renderMain();}
function stList(){if(!Array.isArray(S.strategies))S.strategies=[];return S.strategies;}
function stGet(id){return stList().find(x=>x.id===(id||V.stid))||null;}
function stMigrate(){
  stList().forEach(e=>{
    if(!e.id)e.id=uid();
    if(typeof e.name!=='string')e.name='Estrategia';
    if(typeof e.population!=='string')e.population='';
    if(typeof e.phenotype!=='string')e.phenotype='';
    if(typeof e.pct!=='string')e.pct='';
    if(typeof e.notes!=='string')e.notes='';
    if(!Array.isArray(e.steps))e.steps=[];
    e.steps=e.steps.slice(0,ST_MAX_STEPS);
    e.steps.forEach(p=>{
      if(!p.id)p.id=uid();
      if(typeof p.img!=='string')p.img='';
      if(typeof p.x!=='string')p.x='';
      if(typeof p.y!=='string')p.y='';
      if(!/^#[0-9a-f]{6}$/i.test(p.xc||''))p.xc=ST_AXIS_COLORS[0];
      if(!/^#[0-9a-f]{6}$/i.test(p.yc||''))p.yc=ST_AXIS_COLORS[2];
    });
    if(!Array.isArray(e.panel))e.panel=[];
    e.panel.forEach(f=>{
      if(typeof f.marker!=='string')f.marker='';
      if(typeof f.fluor!=='string')f.fluor='';
      if(typeof f.titer!=='string')f.titer='';
    });
    if(!e.createdAt)e.createdAt=new Date().toISOString();
  });
}
function stTitle(e){return (e.name||'Sin título')+(e.population?' ('+e.population+')':'');}

/* ── Navegación ── */
function stHome(){V.area='strategies';S.area='strategies';V.stpage='home';V.stid=null;save();closeDrawer();renderAll();}
function stOpen(id){if(!stGet(id))return;V.area='strategies';S.area='strategies';V.stpage='edit';V.stid=id;S.lastStid=id;save();closeDrawer();renderAll();if(isMobile()&&!S.sideOff){S.sideOff=true;applySide();}}

function stDuplicate(id){

function stDelete(id){

function stSet(campo,valor){
  const e=stGet();if(!e)return;e[campo]=nmu(valor);e.updatedAt=new Date().toISOString();save();
  /* Sólo se retoca lo que cambia: repintar la página entera la hacía parpadear
     y volver arriba en cada campo. */

    renderSidebar();

/* Repintado del editor sin animación de entrada y conservando el desplazamiento. */
let _stQuiet=false;
function stRender(){
  const c=scrollEl(),top=c?c.scrollTop:0;
  _stQuiet=true;try{renderMain();}finally{_stQuiet=false;}
  if(c)c.scrollTop=top;
}

/* ── Capturas ──
   Cada imagen se reduce a ST_MAX_PX de lado mayor y se guarda en WebP, que en
   estos gráficos de puntos pesa una fracción del PNG sin diferencia visible.
   Si el navegador no diera WebP, se queda en PNG. */
function stPrepararImagen(dataUri){
  return new Promise(res=>{
    const im=new Image();
    im.onload=()=>{
      try{
        let {width:w,height:h}=im;
        const f=Math.min(1,ST_MAX_PX/Math.max(w,h));
        w=Math.round(w*f);h=Math.round(h*f);
        const c=document.createElement('canvas');c.width=w;c.height=h;
        const x=c.getContext('2d');
        x.imageSmoothingQuality='high';
        x.drawImage(im,0,0,w,h);
        let out=c.toDataURL('image/webp',0.95);
        if(!out.startsWith('data:image/webp'))out=c.toDataURL('image/png');
        /* Si apenas ahorra, se prefiere el original: la nitidez vale más que
           unos kilobytes. Si hubo que reducir de tamaño, se acepta igualmente. */
        const redujo=f<1;
        res((redujo||out.length<dataUri.length*0.75)?out:dataUri);
      }catch(_){res(dataUri);}
    };
    im.onerror=()=>res(dataUri);
    im.src=dataUri;
  });
}
async function stAddImagen(dataUri,stepId){
  const e=stGet();if(!e)return;
  if(!stepId&&e.steps.length>=ST_MAX_STEPS){toast('El máximo son '+ST_MAX_STEPS+' capturas',{icon:'alert'});return;}
  const lista=await stPrepararImagen(dataUri);
  const ref=assetPut(lista);
  if(stepId){
    const p=e.steps.find(x=>x.id===stepId);if(p)p.img=ref;
  }else{
    e.steps.push({id:uid(),img:ref,x:'',y:'',xc:ST_AXIS_COLORS[e.steps.length%ST_AXIS_COLORS.length],yc:ST_AXIS_COLORS[(e.steps.length+2)%ST_AXIS_COLORS.length]});
  }
  e.updatedAt=new Date().toISOString();
  save();stRender();
}
function stFileInput(input,stepId){
  const fs=[...(input.files||[])];
  input.value='';
  if(!fs.length)return;
  const e=stGet();if(!e)return;
  const hueco=ST_MAX_STEPS-e.steps.length;
  const tomar=stepId?fs.slice(0,1):fs.slice(0,Math.max(0,hueco));
  if(!tomar.length){toast('El máximo son '+ST_MAX_STEPS+' capturas',{icon:'alert'});return;}
  if(!stepId&&fs.length>tomar.length)toast('Se añaden '+tomar.length+' de '+fs.length+': el máximo son '+ST_MAX_STEPS,{icon:'info'});
  /* En serie, para que el orden de los archivos elegidos se respete. */
  (async()=>{for(const f of tomar){const d=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=()=>r('');fr.readAsDataURL(f);});if(d)await stAddImagen(d,stepId);}})();
}
/* ── Pegado desde el portapapeles ──
   Es la vía principal para meter capturas: se recorta la pantalla y se pega con
   Ctrl+V. Por defecto la captura se añade al final; si antes se ha pulsado
   «Sustituir» en un paso concreto, va a ese paso. */
let stPasteTarget=null;
function stPasteHandler(ev){
  if(V.area!=='strategies'||V.stpage!=='edit')return;
  if(document.getElementById('mroot').innerHTML)return;
  const a=document.activeElement;
  /* Si se está escribiendo en un campo, el pegado es suyo. */
  if(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName)&&a.type!=='file'&&a.type!=='color')return;
  const items=[...((ev.clipboardData&&ev.clipboardData.items)||[])];
  const imgs=items.filter(i=>i.type&&i.type.startsWith('image/'));
  if(!imgs.length)return;
  ev.preventDefault();
  const destino=stPasteTarget;stPasteTarget=null;
  (async()=>{
    let n=0;
    for(const it of imgs){
      const f=it.getAsFile();if(!f)continue;
      const d=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=()=>r('');fr.readAsDataURL(f);});
      if(!d)continue;
      await stAddImagen(d,destino);
      n++;
      if(destino)break;
    }
    if(n)toast(destino?'Captura sustituida':(n>1?n+' capturas pegadas':'Captura pegada'),{icon:'check'});
  })();
}
/* Pega lo que haya en el portapapeles. Con «destino» sustituye esa captura;
   sin él, las añade al final. Si el navegador no deja leer el portapapeles,
   se deja armado el destino y basta con pulsar Ctrl+V. */
let stClipPreguntado=(()=>{try{return sessionStorage.getItem('bf_clipAsked')==='1';}catch(_){return false;}})();
async function stPermisoPortapapeles(){
  try{return (await navigator.permissions.query({name:'clipboard-read'})).state;}catch(_){return 'unknown';}
}
async function stPegarEn(destino){
  const noSePuede=motivo=>{
    if(destino){
      stPasteTarget=destino;stRender();
      toast(motivo+' Pulsa Ctrl+V para sustituir esa captura.',{icon:'paste',duration:8000});
    }else{
      toast(motivo+' Pulsa Ctrl+V para pegar.',{icon:'paste',duration:8000});
    }
  };
  if(!(navigator.clipboard&&navigator.clipboard.read)){
    noSePuede('Este navegador no deja leer el portapapeles desde el botón.');return;
  }
  /* El navegador pide permiso cada vez que el botón lee el portapapeles si el
     permiso no queda concedido (p. ej. abriendo el .html con doble clic). Sólo
     se le deja preguntar una vez por sesión; después se tira de Ctrl+V, que no
     necesita permiso. */
  if(!DESKTOP&&stClipPreguntado&&await stPermisoPortapapeles()!=='granted'){
    noSePuede('Para no repetir el aviso de permisos del navegador, el botón ya no vuelve a pedirlo en esta sesión.');return;
  }
  stClipPreguntado=true;
  try{sessionStorage.setItem('bf_clipAsked','1');}catch(_){}
  let items;
  try{items=await navigator.clipboard.read();}
  catch(_){noSePuede('El navegador no autorizó leer el portapapeles.');return;}
  try{
    stPasteTarget=null;
    let n=0;
    for(const it of items){
      const blob=await stBlobDeItem(it);
      if(!blob)continue;
      const d=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=()=>r('');fr.readAsDataURL(blob);});
      if(!d)continue;
      await stAddImagen(d,destino);
      n++;
      if(destino)break;
    }
    if(n)toast(destino?'Captura sustituida':(n>1?n+' capturas pegadas':'Captura pegada'),{icon:'check'});
    else toast('No hay ninguna imagen en el portapapeles',{icon:'alert'});
  }catch(_){
    noSePuede('No se pudo leer la imagen del portapapeles.');
  }
}
/* Saca la imagen de un ClipboardItem, anuncie o no sus tipos. */
async function stBlobDeItem(it){
  const anunciados=(it.types||[]).filter(t=>t&&t.startsWith('image/'));
  const candidatos=anunciados.length?anunciados:['image/png','image/jpeg','image/webp','image/gif'];
  for(const t of candidatos){
    try{
      const b=await it.getType(t);
      if(b&&b.size)return b;
    }catch(_){}
  }
  return null;
}
function stPegarBoton(){return stPegarEn(null);}
function stDropZone(ev){
  ev.preventDefault();ev.stopPropagation();
  const el=document.getElementById('stDrop');if(el)el.classList.remove('on');
  const fs=[...((ev.dataTransfer&&ev.dataTransfer.files)||[])].filter(f=>f.type.startsWith('image/'));
  if(!fs.length)return;
  stFileInput({files:fs,value:''},null);
}
function stStepMove(id,dir){
  const e=stGet();if(!e)return;
  const i=e.steps.findIndex(p=>p.id===id),j=i+dir;
  if(i<0||j<0||j>=e.steps.length)return;
  const [p]=e.steps.splice(i,1);e.steps.splice(j,0,p);
  save();stRender();
}
function stStepDel(id){
  const e=stGet();if(!e)return;
  e.steps=e.steps.filter(p=>p.id!==id);
  save();stRender();
}
function stStepSet(id,campo,valor){
  const e=stGet();if(!e)return;
  const p=e.steps.find(x=>x.id===id);if(!p)return;
  p[campo]=(campo==='x'||campo==='y')?nmu(valor):valor;
  e.updatedAt=new Date().toISOString();save();
  if(campo==='xc'||campo==='yc')stRender();
}

/* ── Mix de anticuerpos ── */
function stPanelAdd(){const e=stGet();if(!e)return;e.panel.push({marker:'',fluor:'',titer:''});save();stRender();}
function stPanelSet(i,campo,v){const e=stGet();if(!e||!e.panel[i])return;e.panel[i][campo]=nmu(v);e.updatedAt=new Date().toISOString();save();}
function stPanelDel(i){const e=stGet();if(!e)return;e.panel.splice(i,1);save();stRender();}
function stPanelMove(i,dir){
  const e=stGet();if(!e)return;const j=i+dir;
  if(j<0||j>=e.panel.length)return;
  const [f]=e.panel.splice(i,1);e.panel.splice(j,0,f);
  save();stRender();
}
/* Vaciado de secciones completas, con deshacer. */
function stClearSteps(){
  const e=stGet();if(!e||!e.steps.length)return;
  const antes=e.steps;e.steps=[];stPasteTarget=null;
  e.updatedAt=new Date().toISOString();save();stRender();
  toast('Capturas eliminadas',{icon:'trash',duration:6000,actionLabel:'Deshacer',onAction:()=>{e.steps=antes;save();stRender();}});
}
function stClearPanel(){
  const e=stGet();if(!e)return;
  const ta=document.getElementById('stPanelPaste');
  const texto=ta?ta.value:'';
  if(ta)ta.value='';
  if(!e.panel.length)return;
  const antes=e.panel;e.panel=[];
  e.updatedAt=new Date().toISOString();save();stRender();
  toast('Mix de anticuerpos vaciado',{icon:'trash',duration:6000,actionLabel:'Deshacer',onAction:()=>{e.panel=antes;save();stRender();const t=document.getElementById('stPanelPaste');if(t)t.value=texto;}});
}
/* Pegado desde Excel: Marcador · Fluorocromo · Título. */
function stPanelPaste(){
  const e=stGet();if(!e)return;
  const ta=document.getElementById('stPanelPaste');
  const txt=(ta&&ta.value||'');
  if(!txt.trim()){toast('Pega primero la tabla',{icon:'alert'});return;}
  const filas=[];
  txt.split(/\r?\n/).forEach(l=>{
    if(!l.trim())return;
    const c=l.split('\t');
    const m=(c[0]||'').trim();
    if(!m||/^marcador|^marker/i.test(m))return;
    filas.push({marker:nmu(m),fluor:nmu((c[1]||'').trim()),titer:nmu((c[2]||'').trim())});
  });
  if(!filas.length){toast('No se reconocieron filas. Pega desde Excel (columnas separadas por tabulador).',{icon:'alert'});return;}
  e.panel=filas;save();stRender();
  toast(filas.length+' fila(s) cargadas',{icon:'sheet'});
}

/* ── Vistas ── */
function renderStrategies(c){

function stViewHome(){

function stViewEdit(e){
  /* ── Capturas ── */
  const pasos=e.steps.map((p,i)=>`<div class="st-step${stPasteTarget===p.id?' armado':''}">
    <div class="st-step-hd"><span class="st-step-n">${i+1}</span><div class="sp" style="flex:1"></div>
      <button class="sc-ibtn${stPasteTarget===p.id?' on':''}" title="${stPasteTarget===p.id?'Pulsa Ctrl+V para sustituir esta captura':'Sustituir esta captura por la del portapapeles'}" onclick="stPegarEn('${p.id}')">${ic('paste',15)}</button>

    </div>
    <label class="st-shot" title="Cambiar esta captura desde un archivo">
      ${p.img?`<img src="${esc(imgSrc(p.img))}" alt="Captura ${i+1}">`:`<span class="st-shot-ph">${ic('image',22)} Sin imagen</span>`}
      ${stPasteTarget===p.id?`<span class="st-armado">${ic('paste',14)} Ctrl+V</span>`:''}
      <input type="file" accept="image/*" style="display:none" onchange="stFileInput(this,'${p.id}')">
    </label>
    <div class="st-axis">
      <span class="st-axis-t">Y</span>
      <input class="minp" value="${esc(p.y)}" placeholder="Eje vertical" onchange="stStepSet('${p.id}','y',this.value)">
      <label class="color-wrap" title="Color de la etiqueta"><input type="color" value="${esc(p.yc)}" onchange="stStepSet('${p.id}','yc',this.value)"><span class="sw" style="width:22px;height:22px;border-radius:6px;background:${esc(p.yc)}"></span></label>
    </div>
    <div class="st-axis">
      <span class="st-axis-t">X</span>
      <input class="minp" value="${esc(p.x)}" placeholder="Eje horizontal" onchange="stStepSet('${p.id}','x',this.value)">
      <label class="color-wrap" title="Color de la etiqueta"><input type="color" value="${esc(p.xc)}" onchange="stStepSet('${p.id}','xc',this.value)"><span class="sw" style="width:22px;height:22px;border-radius:6px;background:${esc(p.xc)}"></span></label>
    </div>
  </div>`).join('');

  const zona=e.steps.length<ST_MAX_STEPS

  /* ── Mix de anticuerpos ── */

        <button class="sc-ibtn" title="Eliminar fila" onclick="stPanelDel(${i})">${ic('trash',16)}</button>
      </td></tr>`).join('')
    :`<tr><td colspan="4" style="color:var(--tx3);font-size:12.5px;padding:10px">Sin anticuerpos todavía.</td></tr>`;

  return `<button class="back-btn" onclick="stHome()">${ic('arrow-left',15)} Estrategias</button>
    <div class="page-head">
      <div><div class="eyebrow">Estrategias</div><h1 class="title" id="stHeadTitle">${esc(stTitle(e))}</h1><p class="sub">${e.steps.length} captura(s) · ${e.panel.length} anticuerpo(s)</p></div>
      <div class="st-acts">
        <button class="btn btn-g" onclick="stExportPng('${e.id}')">${ic('image',16)} PNG</button>
        <button class="btn btn-g" onclick="stExportPdf('${e.id}')">${ic('pdf',16)} PDF</button>
        <button class="btn btn-g sm" onclick="stDuplicate('${e.id}')" title="Duplicar">${ic('copy',15)}</button>
        <button class="btn btn-dng sm" onclick="stDelete('${e.id}')" title="Eliminar">${ic('trash',15)}</button>
      </div>
    </div>

    <div class="section"><div class="sec-hd"><div class="sec-ico">${ic('info',19)}</div><h2>Identificación</h2></div>
      <div class="rp-card"><div class="rp-grid">
        <div class="mfld"><label class="mlbl">Nombre o número de muestra</label><input class="minp" value="${esc(e.name)}" placeholder="94029" onchange="stSet('name',this.value)"></div>
        <div class="mfld"><label class="mlbl">Población <span style="color:var(--tx3);font-weight:400">(opcional)</span></label><input class="minp" value="${esc(e.population)}" placeholder="P4" onchange="stSet('population',this.value)"></div>
        <div class="mfld"><label class="mlbl">% aproximado</label><input class="minp" value="${esc(e.pct)}" placeholder="22.9" onchange="stSet('pct',this.value)"></div>
      </div></div>
    </div>

    <div class="section"><div class="sec-hd"><div class="sec-ico">${ic('target',19)}</div><h2>Estrategia de gating <span class="cnt">${e.steps.length}/${ST_MAX_STEPS}</span></h2>${e.steps.length?`<div class="sp" style="flex:1"></div><button class="btn btn-g sm" onclick="stClearSteps()" title="Quitar todas las capturas">${ic('trash',14)} Vaciar</button>`:''}</div>
      <div class="rp-card">
        ${zona}
        ${e.steps.length?`<p class="sub" style="margin:16px 0 12px">Se encadenan en este orden con flechas. Las etiquetas de eje acompañan a cada gráfico con el color que elijas.</p><div class="st-steps">${pasos}</div>`:''}
      </div>
    </div>

    <div class="section"><div class="sec-hd"><div class="sec-ico">${ic('sheet',19)}</div><h2>Mix de anticuerpos</h2><div class="sp" style="flex:1"></div><button class="btn btn-g sm" onclick="stClearPanel()" title="Vaciar la tabla y el texto pegado">${ic('trash',14)} Vaciar</button></div>
      <div class="rp-card">
        <label class="mlbl">${ic('paste',13)} Pegar desde Excel (columnas: Marcador, Fluorocromo, Título µL)</label>
        <textarea id="stPanelPaste" class="minp" rows="2" placeholder="Pega aquí la tabla copiada de Excel y pulsa «Cargar pegado»…"></textarea>
        <div style="display:flex;gap:8px;margin:10px 0 14px;flex-wrap:wrap"><button class="btn btn-p sm" onclick="stPanelPaste()">${ic('paste',14)} Cargar pegado</button><button class="btn btn-g sm" onclick="stPanelAdd()">${ic('plus',14)} Añadir fila</button></div>
        <div style="overflow-x:auto"><table class="rp-table"><thead><tr><th>Marcador</th><th>Fluorocromo</th><th>Título (<span class="no-up">µ</span>L)</th><th></th></tr></thead><tbody>${filas}</tbody></table></div>
      </div>
    </div>

    <div class="section"><div class="sec-hd"><div class="sec-ico">${ic('flask',19)}</div><h2>Fenotipo de la población</h2></div>

        <div class="mfld" style="margin-bottom:0"><label class="mlbl">Notas <span style="color:var(--tx3);font-weight:400">(opcional, salen al pie del documento)</span></label><textarea class="minp auto" rows="2" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'" onchange="stSet('notes',this.value)">${esc(e.notes)}</textarea></div>

        <div class="cfg-row">
          <div class="cfg-txt"><b>Resolución del PNG</b><span>Ancho resultante: ${1400*stEscala()} px.</span></div>
