.ag-sep{font-style:normal;opacity:.45}
.ag-row-acts{display:flex;gap:1px;flex-shrink:0}

/* ── Editor ── */
.ag-editor .rp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 14px}
.ag-editor .mhint{font-size:11px;margin-top:4px}
.ag-editor .cpick{align-items:center}
.ag-calrow{display:flex;gap:7px;align-items:center;min-width:0}
.cdot-inherit{position:relative;box-shadow:inset 0 0 0 2px var(--sf),0 0 0 1px var(--bd2)}
.ag-scope{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--pr-bg);border:1px solid var(--pr-bd);border-radius:var(--r-s);
  padding:8px 11px;margin-bottom:15px;
}
.ag-scope-l{font-size:12px;font-weight:600;color:var(--pr-tx);display:flex;align-items:center;gap:6px;flex:1;min-width:150px}
.ag-rep-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:9px;font-size:12.5px;color:var(--tx2);font-weight:550}
.ag-rep-row .minp{width:auto}
.ag-rep-row .ag-sp2{flex:1;min-width:0}
.ag-rep-days{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.ag-day{
  width:30px;height:30px;border-radius:50%;background:var(--sf2);border:1px solid var(--bd2);
  font-size:12px;font-weight:700;color:var(--tx2);
  transition:background .14s var(--ease),color .14s var(--ease),border-color .14s var(--ease);
}
.ag-day:hover{background:var(--sf3);color:var(--tx)}
.ag-day.on{background:var(--ac);border-color:transparent;color:var(--on-ac)}
.ag-rep-sum{margin-top:9px;font-size:11.5px;color:var(--tx3);display:flex;align-items:center;gap:6px}
.ag-rep-lock{display:flex;align-items:flex-start;gap:7px;font-size:12px;color:var(--tx3);background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r-xs);padding:8px 10px}
.ag-rep-lock .ic{flex-shrink:0;margin-top:1px}
.ag-alert-row{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.ag-alert-row .sel{flex:1;max-width:260px}
.ag-alert-none{font-size:12px;color:var(--tx3)}
.ag-alert-add{margin-top:6px}
.ag-alert-max{font-size:11.5px;color:var(--tx3);display:inline-flex;align-items:center;gap:5px}

/* ── Calendarios en el panel lateral ── */
.ag-cal-list{display:flex;flex-direction:column;gap:1px;padding:0 0 8px}
.ag-cal{
  display:flex;align-items:center;gap:10px;margin:0 10px;padding:0 10px;min-height:32px;
  border-radius:var(--r-s);background:none;border:none;width:calc(100% - 20px);text-align:left;
  color:var(--sb-tx);font-size:13.5px;font-weight:500;cursor:pointer;
  transition:background .13s var(--ease),color .13s var(--ease);
}
.ag-cal:hover{background:var(--sb-hv);color:var(--tx)}
.ag-cal-box{
  width:15px;height:15px;border-radius:4px;flex-shrink:0;position:relative;
  border:2px solid var(--c);background:transparent;
  transition:background .14s var(--ease);
}
.ag-cal.on .ag-cal-box{background:var(--c)}
.ag-cal.on .ag-cal-box::after{
  content:'';position:absolute;left:3.5px;top:.5px;width:4px;height:8px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg);
}
.ag-cal-n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-cal:not(.on) .ag-cal-n{opacity:.55}
.ag-cal-c{font-size:11px;font-weight:600;color:var(--tx3);font-variant-numeric:tabular-nums;flex-shrink:0}
.ag-cal-manage{
  display:flex;align-items:center;gap:7px;margin:4px 10px 0;padding:0 10px;min-height:30px;
  border-radius:var(--r-s);background:none;border:1px dashed var(--sb-bd);width:calc(100% - 20px);
  color:var(--tx3);font-size:12.5px;font-weight:550;
  transition:background .13s var(--ease),color .13s var(--ease);
}
.ag-cal-manage:hover{background:var(--sb-hv);color:var(--tx2)}

@media(max-width:820px){
  .ag-grid-m{grid-auto-rows:minmax(84px,auto)}
  .ag-week{max-height:none}
}
@media(max-width:560px){
  .ag-week-hd>div{font-size:9.5px;padding:6px 2px}
  .ag-grid-m{grid-auto-rows:minmax(66px,auto)}
  .ag-chip-n{font-size:10.5px}
  .ag-hh{flex:0 0 46px}
  .ag-srch{flex:1 1 100%}
}
@media(prefers-reduced-motion:reduce){
  .ag-row:hover,.ag-chip:hover{transform:none}
}

/* Panel lateral derecho: mismo material que el izquierdo, pegado al borde de
   la ventana y con desplazamiento propio. Se pliega solo fuera de la Agenda. */
.rside{
  width:var(--rsw);flex-shrink:0;display:flex;flex-direction:column;overflow:hidden;
  background:var(--sb);
  box-shadow:inset 1px 0 0 var(--sb-bd);
  transition:width .28s var(--ease);
}
.rside.off{width:0;box-shadow:none}
.rside-in{
  width:var(--rsw);display:flex;flex-direction:column;gap:11px;
  height:100%;min-height:0;overflow-y:auto;overflow-x:hidden;padding:14px 13px 18px;
  transition:opacity .2s var(--ease),transform .34s var(--ease);
}
.rside.off .rside-in{opacity:0;transform:translateX(12px)}
.ag-rail{display:contents}
.ag-rail-card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r-m);box-shadow:var(--shadow-card);padding:13px 13px 12px;min-width:0;flex-shrink:0}
.ag-rail-hd{display:flex;align-items:center;gap:8px;min-width:0}
.ag-rail-hd .ic{color:var(--ac);flex-shrink:0}
.ag-rail-hd h3{font-size:14px;font-weight:700;letter-spacing:-.018em;flex:1;min-width:0}
.ag-rail-n{font-size:11px;font-weight:700;background:var(--sf3);color:var(--tx2);border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}
.ag-rail-sub{font-size:11.5px;color:var(--tx3);margin:2px 0 9px}
.ag-rail-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);margin:11px 0 5px}
.ag-rail-list{display:flex;flex-direction:column;gap:4px;min-width:0}
.ag-rail-empty{font-size:12px;color:var(--tx3);padding:5px 2px}
.ag-rail-day{
  background:none;border:none;text-align:left;padding:7px 2px 3px;
  font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--tx3);
}
.ag-rail-day:hover{color:var(--ac)}
.ag-rw{
  --c:var(--ac);--ct:#fff;
  display:flex;align-items:center;gap:7px;width:100%;min-width:0;text-align:left;
  border:1px solid transparent;border-left-width:3px;border-radius:7px;padding:5px 8px;
  font-size:12px;line-height:1.35;
  transition:transform .16s var(--ease-out),filter .16s var(--ease-out);
}
.ag-rw.s-solid{border-color:transparent}
.ag-rw.s-soft{border-color:color-mix(in srgb,var(--c) 28%,transparent);border-left-color:var(--c)}
.ag-rw.s-outline{border-color:var(--c);background:var(--sf2)}
.ag-rw:hover{transform:translateX(2px);filter:brightness(1.05)}
.ag-rw.done{opacity:.5}
.ag-rw.done .ag-rw-n{text-decoration:line-through}
.ag-rw-h{font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums;opacity:.85;flex:0 0 32px;display:flex;align-items:center}
.ag-rw-n{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-rw-ic{flex-shrink:0;opacity:.65;display:flex}
.ag-rail-btn{width:100%;justify-content:center;margin-top:10px}
.ag-rail-stat{display:flex;align-items:center;font-size:12px;color:var(--tx2);padding:10px 13px}
.ag-rail-stat span{display:flex;align-items:center;gap:7px}
.ag-rail-stat .ic{color:var(--ac)}
.ag-rail-stat b{color:var(--tx);font-weight:700;font-variant-numeric:tabular-nums}
@media(max-width:1280px){:root{--rsw:244px}}
@media(max-width:980px){.rside,.rside.off{width:0;box-shadow:none}.rside-in{opacity:0}}

/* ════════ 12 · DIÁLOGOS ════════ */
.modal-ov,.mwrap{
  position:fixed;inset:0;z-index:600;display:flex;align-items:center;justify-content:center;
  padding:20px;background:var(--ov);
  animation:fov .16s var(--ease);
}
@keyframes fov{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--sf);border:1px solid var(--bd);border-radius:var(--r-l);
  padding:22px 24px;width:460px;max-width:100%;max-height:86vh;overflow-y:auto;overflow-x:hidden;
  box-shadow:var(--shadow-pop);
  animation:sup .32s var(--ease-out);
}
@keyframes sup{from{transform:translateY(10px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.mtit{font-size:16.5px;font-weight:650;letter-spacing:-.02em;margin-bottom:16px;display:flex;align-items:center;gap:10px;min-width:0}
.mtit .mtit-ic{width:32px;height:32px;border-radius:9px;background:var(--acl);color:var(--act);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mfld{margin-bottom:14px;min-width:0}
.mlbl{font-size:12.5px;font-weight:600;color:var(--tx2);margin-bottom:5px;display:flex;align-items:center;gap:5px}
.mhint{font-size:12px;color:var(--dg);margin-top:6px;display:none;align-items:center;gap:5px}
.mhint.show{display:flex}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.cpick{display:flex;gap:8px;flex-wrap:wrap}
.cdot{width:28px;height:28px;border-radius:8px;cursor:pointer;border:2px solid transparent;position:relative;transition:transform .14s var(--ease),box-shadow .14s var(--ease)}
.cdot:hover{transform:scale(1.1)}
.cdot.on{box-shadow:0 0 0 2px var(--sf),0 0 0 4px var(--ac)}
.cdot.on::after{content:'\2713';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700}
.bfrom-list{display:flex;flex-direction:column;gap:5px;max-height:200px;overflow-y:auto}
.bfrom-item{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:var(--r-s);border:1px solid var(--bd);cursor:pointer;font-size:13.5px;color:var(--tx2);min-width:0;transition:background .14s var(--ease),border-color .14s var(--ease)}
.bfrom-item:hover{background:var(--sf2)}
.bfrom-item.on{background:var(--acl);border-color:var(--dn-bd);color:var(--act);font-weight:600}
.bfrom-item .ic{color:var(--tx3);flex-shrink:0}
.bfrom-item.on .ic{color:var(--ac)}
.choose-proj{border:1px solid var(--bd);border-radius:var(--r-m);padding:7px}
.choose-phead{display:flex;align-items:center;gap:7px;font-weight:650;font-size:13px;padding:3px 5px 7px;border-bottom:1px solid var(--bd);margin-bottom:3px}
.choose-phead .pdot{width:10px;height:10px;border-radius:50%}

/* Hoja del archivo de datos: desciende desde el borde superior, como en el sistema */
.sheet-ov{align-items:flex-start;padding-top:0}
.modal.sheet{
  width:440px;margin-top:0;border-top-left-radius:0;border-top-right-radius:0;border-top:none;
  box-shadow:0 20px 60px -12px rgba(0,0,0,.45),0 0 0 .5px var(--bd2);
  transform-origin:top center;
  /* Sin «both»: si la animación no llegara a ejecutarse, la hoja se ve igualmente
     en su sitio en vez de quedarse fuera de la pantalla. */
  animation:sheetDrop .52s var(--spring);
}
@keyframes sheetDrop{
  from{transform:translateY(-102%) scaleY(.94);opacity:.5}
  62%{opacity:1}
  to{transform:translateY(0) scaleY(1);opacity:1}
}

/* ════════ 13 · AVISOS ════════ */
.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:9000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;max-width:calc(100vw - 32px)}
.toast{
  background:var(--tp);color:var(--tp-tx);border:1px solid rgba(255,255,255,.12);
  border-radius:var(--r-m);padding:10px 14px;font-size:13px;font-weight:500;
  display:flex;align-items:center;gap:12px;pointer-events:all;max-width:100%;
  box-shadow:0 8px 24px -8px rgba(0,0,0,.45);
  animation:tin .32s var(--ease-out);
}
.toast.out{animation:tout .22s var(--ease) forwards}
@keyframes tin{from{transform:translateY(14px) scale(.96);opacity:0}to{transform:none;opacity:1}}
@keyframes tout{to{transform:translateY(10px) scale(.97);opacity:0}}
.toast .lead{color:var(--teal-300);flex-shrink:0}
.toast-msg{flex:1;min-width:0;overflow-wrap:break-word}
.toast-act{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);color:inherit;border-radius:var(--r-xs);padding:4px 11px;font-size:12.5px;font-weight:600;display:flex;gap:5px;align-items:center;flex-shrink:0;transition:background .15s var(--ease)}
.toast-act:hover{background:rgba(255,255,255,.26)}

/* ════════ 14 · BÚSQUEDA Y PALETA ════════ */
.gres{
  position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:120;
  background:var(--sf);border:1px solid var(--bd);border-radius:var(--r-m);
  box-shadow:var(--shadow-pop);max-height:min(62vh,500px);overflow-y:auto;padding:5px;display:none;
  animation:menuIn .16s var(--ease-out);transform-origin:top center;
}
.gres.show{display:block}
.gres-grp,.pal-grp{font-size:10.5px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);padding:8px 9px 4px}
.gres-item,.pal-item{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:var(--r-xs);cursor:pointer;color:var(--tx);min-width:0}
.gres-item .ic,.pal-item .ic{color:var(--tx2);flex-shrink:0}
.gres-item.sel,.gres-item:hover,.pal-item.sel,.pal-item:hover{background:var(--ac);color:var(--on-ac)}
.gres-item.sel .ic,.gres-item:hover .ic,.pal-item.sel .ic,.pal-item:hover .ic{color:#fff}
.gres-main{flex:1;min-width:0}
.gres-t{font-size:13.5px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gres-s{font-size:11.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gres-item.sel .gres-s,.gres-item:hover .gres-s{color:rgba(255,255,255,.75)}
.gres-k,.pal-k{flex-shrink:0;margin-left:6px;font-size:10.5px;font-weight:600;color:var(--tx3);background:var(--sf2);border:1px solid var(--bd);border-radius:5px;padding:1px 6px;white-space:nowrap}
.gres-item.sel .gres-k,.gres-item:hover .gres-k,.pal-item.sel .pal-k,.pal-item:hover .pal-k{background:rgba(255,255,255,.18);border-color:transparent;color:#fff}
.gres-empty,.pal-empty{padding:22px 14px;text-align:center;color:var(--tx3);font-size:13px}

.pal-ov{position:fixed;inset:0;background:var(--ov);z-index:700;display:flex;align-items:flex-start;justify-content:center;padding:14vh 20px 20px;animation:fov .16s var(--ease)}
.pal{width:600px;max-width:100%;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r-l);box-shadow:var(--shadow-pop);overflow:hidden;animation:sup .3s var(--ease-out);display:flex;flex-direction:column;max-height:70vh}
.pal-in{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--bd)}
.pal-in .ic{color:var(--tx3);flex-shrink:0}
.pal-in input{flex:1;min-width:0;background:none;border:none;outline:none;font-size:15px;color:var(--tx)}
.pal-in input::placeholder{color:var(--tx3)}
.pal-in .esc{font-size:10.5px;color:var(--tx3);border:1px solid var(--bd);border-radius:5px;padding:2px 7px;flex-shrink:0}
.pal-list{overflow-y:auto;padding:6px}
.pal-item .pal-t{flex:1;min-width:0;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal-item .pal-sub{font-size:11.5px;color:var(--tx3)}
.pal-item.sel .pal-sub,.pal-item:hover .pal-sub{color:rgba(255,255,255,.75)}

.ks-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 22px;margin-top:4px}
.ks-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--bd);min-width:0}
.ks-row span{font-size:13px;color:var(--tx2);min-width:0;overflow:hidden;text-overflow:ellipsis}
.ks-keys{display:flex;gap:3px;flex-shrink:0}
.ks-keys kbd{font-family:inherit;font-size:11px;font-weight:600;color:var(--tx2);background:var(--sf2);border:1px solid var(--bd2);border-bottom-width:2px;border-radius:5px;padding:1px 7px;min-width:19px;text-align:center}
@media(max-width:560px){.ks-grid{grid-template-columns:1fr}}

.bk-info{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--tx3);margin:10px 0 2px;min-width:0}
.bk-info .ic{flex-shrink:0}
.bk-info span{display:flex;align-items:center;gap:6px;min-width:0;overflow-wrap:anywhere}
.bk-list{display:flex;flex-direction:column;gap:6px;max-height:44vh;overflow-y:auto;margin-top:6px}
.bk-item{display:flex;align-items:center;gap:11px;padding:10px 12px;background:var(--sf2);min-width:0}
.bk-item .bk-main{flex:1;min-width:0}
.bk-item .bk-when{font-size:13.5px;font-weight:600;color:var(--tx)}
.bk-item .bk-meta{font-size:11.5px;color:var(--tx3)}

/* ════════ 15 · FENOTIPOS ════════ */
.ph-area{min-width:0}
.ph-area .page-head{margin-bottom:22px}

/* Cabecera única del fenotipo */
.ph-head{padding:13px 15px;margin-bottom:12px;min-width:0}
.phh-top{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;min-width:0}
.phh-id{flex:1;min-width:220px}
.phh-id .t-edit{font-size:20px;margin-left:-6px}
.phh-id .d-edit{font-size:12.5px;margin-top:0;margin-left:-6px}
.phh-acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.phh-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--bd);min-width:0}
.phh-sp{flex:1;min-width:0}
.phh-bar .ph-link-row{margin-bottom:0;gap:6px}
.phh-bar .tool-lbl{white-space:nowrap}
.tool-lbl{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--tx2)}
.tool-lbl .ic{color:var(--tx3)}
.tool-count{background:var(--acl);color:var(--act);border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:650;font-variant-numeric:tabular-nums}
.toolbar{display:flex;align-items:center;gap:8px;padding:9px 13px;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r-m);margin-bottom:12px;flex-wrap:wrap;box-shadow:var(--shadow-card)}
.mtx-sort{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px;font-size:12.5px;color:var(--tx2);background:var(--sf);border:1px solid var(--bd);border-radius:var(--r-m);padding:8px 13px;box-shadow:var(--shadow-card)}
.mtx-sort .ms-lbl{font-weight:650;font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em}
.mtx-sort .ms-item{display:inline-flex;align-items:center;gap:6px;font-weight:550}
.mtx-sort .ms-hint{color:var(--tx3);font-weight:500;font-size:11.5px}

/* Tarjetas de fenotipo */
.ph-area .scards{grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:14px}
.ph-area .scard{padding:0;display:flex;flex-direction:column;gap:0;overflow:hidden;position:relative;min-height:0}
.ph-area .ph-card .phc-top{display:flex;align-items:center;gap:10px;padding:14px 15px 8px;min-width:0}
.ph-area .ph-card .phc-avatar{width:30px;height:30px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(160deg,var(--violet),#5B3FD1);box-shadow:0 1px 3px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.25)}
.ph-area .ph-card .phc-avatar .ic{width:16px;height:16px}
.ph-area .ph-card h3{flex:1;min-width:0;font-size:14.5px;font-weight:650;line-height:1.3;overflow-wrap:anywhere;letter-spacing:-.016em}
.ph-area .ph-card .desc{padding:0 15px;font-size:12.5px;color:var(--tx2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ph-area .ph-card .meta{padding:10px 15px 0;display:flex;gap:5px;flex-wrap:wrap;flex:1 1 auto;align-content:flex-start}
.ph-area .ph-card .phc-foot{margin-top:12px;padding:9px 15px;border-top:1px solid var(--bd);font-size:11.5px;color:var(--tx2);font-weight:550;display:flex;align-items:center;gap:5px;background:var(--sf-hi);flex-shrink:0}
.ph-area .ph-card .phc-foot .ic{color:var(--tx3)}
.ph-area .ph-card .ic-x{width:26px;height:26px}
.ph-area .chip-diff{background:var(--diff-bg);border-color:var(--diff-bd);color:var(--diff-tx)}
.ph-area .chip-diff .ic{color:var(--diff-tx)}
.ph-area .chip-ac{background:var(--acl);border-color:var(--dn-bd);color:var(--act)}
.ph-area .chip-ac .ic{color:var(--ac)}
.ph-area .chip-dg{background:var(--dg-bg);border-color:var(--dg-bd);color:var(--dg)}
.ph-area .chip-dg .ic{color:var(--dg)}
.ic-x{background:none;border:none;color:var(--tx3);border-radius:var(--r-xs);width:26px;height:26px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .14s var(--ease),color .14s var(--ease)}
.ic-x:hover{background:var(--dg-bg);color:var(--dg)}

/* Barra de detección */
.auto-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.auto-lbl{font-size:10.5px;font-weight:650;letter-spacing:.06em;color:var(--tx3);text-transform:uppercase}
.auto-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:999px;font-size:11.5px;font-weight:650}
.auto-pill.diff{background:var(--diff-solid);color:var(--diff-on);box-shadow:0 2px 8px -2px rgba(110,86,232,.5)}
.auto-pill.common{background:var(--common-bg);color:var(--common-tx)}

/* Matriz */
.mtx-wrap{padding:0;overflow:auto;max-height:64vh;min-width:0}
.mtx{--popw:246px;border-collapse:separate;border-spacing:0;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.mtx th,.mtx td{border-bottom:1px solid var(--grid);padding:0}
.mtx thead th{position:sticky;top:0;z-index:3;background:var(--sf);border-bottom:1px solid var(--bd2)}
.mtx thead th.corner{z-index:4}
.mtx .corner{
  text-align:left;font-size:11px;font-weight:650;color:var(--tx3);padding:9px 12px;white-space:nowrap;
  position:sticky;left:0;background:var(--sf);z-index:3;overflow:hidden;text-overflow:ellipsis;
  width:var(--popw);min-width:var(--popw);max-width:var(--popw);
  box-shadow:1px 0 0 var(--bd2);
}
.mtx .corner .corner-lbl{display:block;width:calc(var(--popw) - 24px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mtx .mk-th{padding:8px 4px;min-width:76px;vertical-align:bottom}
.mk-chip{display:flex;flex-direction:column;gap:2px;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r-xs);padding:4px 6px;position:relative;transition:transform .14s var(--ease),box-shadow .16s var(--ease),background-color .18s var(--ease)}
.mk-th:hover .mk-chip{transform:translateY(-1px);box-shadow:var(--shadow-hover)}
.mk-chip-row{display:flex;align-items:center;gap:3px}
.mk-chip.common{background:var(--common-bg);border-color:transparent}
.mk-chip.diff{background:var(--diff-solid);border-color:transparent;box-shadow:0 3px 10px -3px rgba(110,86,232,.6)}
.mk-chip.diff .mk-in{color:var(--diff-on)}
.mk-chip .mk-ind{display:flex;opacity:.8;color:var(--diff-tx)}
.mk-chip.common .mk-ind{color:var(--common-tx)}
.mk-chip.diff .mk-ind{color:var(--diff-on);opacity:1}
.mk-in{background:transparent;border:none;font-weight:650;font-size:12px;text-align:center;width:100%;min-width:30px;color:var(--tx);padding:2px;border-radius:4px;letter-spacing:-.01em}
.mk-in:focus{outline:none;box-shadow:0 0 0 2px var(--foc)}
.mk-del{position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:999px;background:var(--tx);color:var(--sf);border:1.5px solid var(--sf);display:none;align-items:center;justify-content:center;padding:0;z-index:3}
.mk-th:hover .mk-del{display:flex}
.mk-move{display:none;justify-content:center;gap:5px;margin-top:3px}
.mk-th:hover .mk-move{display:flex}
.mk-move button{background:var(--sf);border:1px solid var(--bd2);border-radius:4px;width:20px;height:16px;display:flex;align-items:center;justify-content:center;color:var(--tx2);padding:0}
.mk-move button:hover{background:var(--sf2);color:var(--tx)}
.add-col{width:28px;height:28px;border-radius:var(--r-xs);background:var(--sf2);border:1px solid var(--bd2);color:var(--tx2);display:flex;align-items:center;justify-content:center;transition:background .14s var(--ease),color .14s var(--ease)}
.add-col:hover{background:var(--ac);color:var(--on-ac);border-color:transparent}

/* Columna de población */
.pop-th{position:sticky;left:0;background:var(--sf);z-index:2;text-align:left;box-shadow:1px 0 0 var(--bd2);width:var(--popw);min-width:0;max-width:var(--popw)}
.pop-cell{display:flex;flex-direction:column;gap:4px;padding:8px 13px 9px 10px;width:var(--popw);max-width:var(--popw);overflow:hidden}
.pop-in-wrap{display:flex;align-items:center;gap:2px;padding-right:0;min-width:0}
.pop-in{flex:1;min-width:0;width:100%;background:transparent;border:1px solid transparent;color:var(--tx);font-size:13px;font-weight:600;letter-spacing:-.012em;padding:3px 6px;border-radius:var(--r-xs);text-overflow:ellipsis}
.pop-in:hover{background:var(--sf2)}
.pop-in:focus{outline:none;background:var(--sf);border-color:var(--ac);box-shadow:0 0 0 3px var(--foc)}
.pop-meta{display:flex;flex-wrap:nowrap;align-items:center;gap:4px;padding-left:2px;min-width:0}
.pop-nums{display:flex;align-items:center;gap:4px;padding-left:8px}
.pop-id,.pop-num,.pop-comment{background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r-xs);padding:3px 6px;font-size:11.5px;color:var(--tx)}
.pop-meta .pop-id{flex:0 0 46px;width:46px;min-width:0;font-weight:600}
.pop-meta .pop-num{flex:1 1 0;width:auto;min-width:0;text-align:right}
.pop-num{width:52px}
.pop-unit{flex:0 0 auto;font-size:9.5px;font-weight:600;color:var(--tx2);white-space:nowrap;letter-spacing:0;text-transform:none;margin-right:0}
.pop-comment{width:100%;margin-left:0;min-height:24px;font-size:11.5px;font-family:inherit;line-height:1.35;resize:vertical;background:transparent;border-style:dashed;color:var(--tx2)}
.pop-comment:hover{background:var(--sf2);border-style:solid}
.pop-id:focus,.pop-num:focus,.pop-comment:focus{outline:none;border-color:var(--ac);background:var(--sf);border-style:solid;box-shadow:0 0 0 3px var(--foc)}
.pop-id::placeholder,.pop-comment::placeholder{color:var(--tx3)}
.pop-comment::placeholder{font-style:italic}
.pop-del,.pop-mv{background:none;border:none;color:var(--tx3);padding:4px;display:flex;border-radius:5px;visibility:hidden;flex-shrink:0}
.pop-th:hover .pop-del,.pop-th:hover .pop-mv{visibility:visible}
.pop-del:hover{color:var(--dg);background:var(--dg-bg)}
.pop-mv:hover{color:var(--ac)}
/* Tirador para ajustar el ancho de la columna */
.pop-resize{position:absolute;top:0;right:0;width:8px;height:100%;cursor:col-resize;z-index:6}
.pop-resize::after{content:'';position:absolute;top:0;bottom:0;right:0;width:2px;border-radius:2px;background:transparent;transition:background .12s var(--ease)}
.pop-resize:hover::after{background:var(--ac)}
body.col-resizing{cursor:col-resize;user-select:none}
body.col-resizing .pop-resize::after{background:var(--ac)}
/* Columna estrecha: sólo el nombre, en vertical */
.mtx.pop-narrow .pop-meta,.mtx.pop-narrow .pop-comment,.mtx.pop-narrow .pop-del{display:none}
.mtx.pop-narrow .pop-cell{padding:8px 10px 8px 4px;align-items:center;justify-content:center}
.mtx.pop-narrow .pop-in-wrap{padding:0;justify-content:center;width:100%}
.mtx.pop-narrow .pop-in{writing-mode:vertical-rl;transform:rotate(180deg);text-align:left;flex:none;width:auto;min-height:84px;max-height:210px;padding:7px 3px;font-size:12.5px}
.mtx.pop-narrow .corner-lbl{font-size:0}
.mtx.pop-narrow .corner-lbl::after{content:'Pobl.';font-size:11px}

/* Celdas de expresión */
.mtx td.cell{padding:3px;border-left:1px solid var(--grid)}
.cell-sel{
  width:100%;min-width:52px;height:32px;border:none;border-radius:var(--r-xs);
  font-weight:650;font-size:12.5px;letter-spacing:.01em;text-align:center;text-align-last:center;
  cursor:pointer;background:var(--sf2);color:var(--tx3);
  appearance:none;-webkit-appearance:none;padding:0 5px;
  box-shadow:0 1px 1.5px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.2);
  transition:transform .13s var(--ease),box-shadow .13s var(--ease),filter .13s var(--ease);
}
.cell-sel:hover{filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 3px 8px -2px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.24)}
.cell-sel:active{transform:none;box-shadow:inset 0 1px 3px rgba(0,0,0,.2)}
.cell-sel:focus-visible{box-shadow:0 0 0 3.5px var(--foc),0 0 0 1px var(--ac)}
.cell-sel option{background:var(--sf);color:var(--tx);font-weight:500}
.cell-sel.empty{background:transparent;color:transparent;box-shadow:inset 0 0 0 1px var(--bd2);opacity:.6}
.cell-sel.empty:hover{opacity:1;transform:none;filter:none;background:var(--sf2);box-shadow:inset 0 0 0 1px var(--bd3)}
.cell-sel.empty option{color:var(--tx)}
.cell-dial{display:flex;align-items:center;justify-content:center;line-height:1}
.mtx td.cell.diff{background:transparent}

/* Filas alternas y realce */
.mtx tbody tr:nth-child(even) td.cell{background:color-mix(in srgb,var(--sf2) 55%,transparent)}
.mtx tbody tr:nth-child(even) .pop-th{background:var(--sf-hi)}
.mtx tbody tr:hover td.cell{background:var(--acl)}
.mtx tbody tr:hover .pop-th{background:var(--acl);box-shadow:1px 0 0 var(--bd2),inset 2px 0 0 var(--ac)}

/* Pie de estadísticas */
.mtx tfoot{position:sticky;bottom:0;z-index:2}
.mtx tfoot td,.mtx tfoot th{border-bottom:none;background:var(--sf2)}
.mtx tfoot tr:first-child td,.mtx tfoot tr:first-child th{border-top:1px solid var(--bd2)}
.mtx tfoot tr:not(:first-child) th,.mtx tfoot tr:not(:first-child) td{border-top:1px solid var(--grid)}
.mtx-stat th.corner{font-size:11px;font-weight:650;white-space:nowrap;line-height:1.2;padding:7px 12px;border-left:2px solid transparent;background:var(--sf2)}
.mtx-stat th.corner .stat-lbl,.mtx-stat th.corner .stat-sub{display:block;width:calc(var(--popw) - 24px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mtx-stat th.corner .stat-sub{font-size:8.5px;font-weight:600;letter-spacing:.05em;color:var(--tx3);text-transform:uppercase;margin-top:1px}
.mtx-stat th.corner.st-pos{border-left-color:#16a34a}
.mtx-stat th.corner.st-neg{border-left-color:var(--dg)}
.mtx-stat th.corner.st-het{border-left-color:var(--violet)}
.mtx-stat td.mk-stat{padding:7px 6px;text-align:center;border-left:1px solid var(--grid);font-size:12px;font-weight:650}
.mtx-stat .stat-cell{display:inline-flex;align-items:baseline;gap:4px;justify-content:center}
.mtx-stat .stat-n{font-weight:700;font-size:12.5px;line-height:1}
.mtx-stat .stat-p{font-weight:600;font-size:9.5px;opacity:.6;line-height:1}
.mtx-stat .stat-empty{color:var(--tx3);opacity:.5;font-weight:650}
.mtx-stat .st-pos{color:#16a34a}
.mtx-stat .st-neg{color:var(--dg)}
.mtx-stat .st-het{color:var(--violet)}
[data-dark] .mtx-stat .st-pos{color:#4ade80}

.add-row{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:var(--sf);color:var(--tx);border:1px solid var(--bd2);padding:0 14px;height:30px;border-radius:var(--r-s);font-size:13px;font-weight:550;box-shadow:var(--shadow-card),var(--raise);transition:background .14s var(--ease),border-color .14s var(--ease),color .14s var(--ease)}
.add-row:hover{background:var(--acl);border-color:var(--dn-bd);color:var(--act)}
.empty-row{color:var(--tx3);text-align:center;padding:24px;font-size:13px}

/* Leyenda */
.legend{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px;padding:11px 15px;min-width:0}
.legend .grp{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.legend .tag{color:var(--tx3);font-size:10.5px;font-weight:650;text-transform:uppercase;letter-spacing:.05em}
.legend .it{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--tx2)}
.legend .div{width:1px;height:16px;background:var(--bd)}
.sw{width:13px;height:13px;border-radius:4px;display:inline-block;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.dot{width:15px;height:15px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff}

/* Vínculo con la muestra */
.ph-link-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;min-width:0}
.link-chip{display:inline-flex;align-items:center;gap:7px;background:var(--acl);border:1px solid var(--dn-bd);color:var(--act);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:600;max-width:100%;min-width:0;transition:filter .14s var(--ease)}
.link-chip:hover{filter:brightness(.97)}
.link-chip .pdot{width:9px;height:9px;border-radius:50%}
.link-chip .link-proj{color:var(--tx3);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.link-none,.link-bad{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:550;padding:4px 11px;border-radius:999px}
.link-none{background:var(--sf2);color:var(--tx3);border:1px dashed var(--bd3)}
.link-bad{background:var(--dg-bg);color:var(--dg);border:1px solid var(--dg-bd)}

/* Ajustes de fenotipos */
.opt-list{display:flex;flex-direction:column;gap:6px;max-width:780px;margin-top:14px;min-width:0}
.opt-row{display:flex;align-items:center;gap:10px;padding:9px 12px;flex-wrap:wrap;min-width:0;transition:border-color .15s var(--ease)}
.opt-row:hover{border-color:var(--bd2)}
.color-wrap{position:relative;width:24px;height:24px;flex-shrink:0;cursor:pointer}
.color-wrap input{border:none;padding:0;background:none}
.color-wrap input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.preview{min-width:50px;text-align:center;padding:5px 10px;border-radius:var(--r-xs);font-weight:650;font-size:12.5px}
.preset-count{font-size:11.5px;color:var(--tx3);font-weight:550;white-space:nowrap}

/* Comparativa */
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:16px;min-width:0}
.pick-col{padding:9px;min-width:0;display:flex;flex-direction:column}
.pick-head{font-weight:650;font-size:13px;padding:3px 5px 8px;border-bottom:1px solid var(--bd);margin-bottom:5px;overflow-wrap:anywhere}
.pick-item{display:flex;align-items:center;gap:7px;width:100%;background:none;border:1px solid transparent;border-radius:var(--r-xs);padding:6px 7px;font-size:12.5px;color:var(--tx);text-align:left;min-width:0;transition:background .14s var(--ease),transform .14s var(--ease)}
.pick-item:hover{background:var(--sf2);transform:translateX(2px)}
.pick-item.on{background:var(--diff-bg);border-color:var(--diff-bd);color:var(--diff-tx);font-weight:650}
.pick-item span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Ventana de reordenación */
.reo-wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px;min-width:0}
@media(max-width:620px){.reo-wrap{grid-template-columns:1fr}}
.reo-col{display:flex;flex-direction:column;gap:7px;min-width:0}
.reo-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.05em;color:var(--tx3)}
.reo-list{display:flex;flex-direction:column;gap:5px;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r-m);padding:7px;max-height:50vh;overflow:auto;min-width:0}
.reo-list.locked{opacity:.5}
.reo-item{display:flex;align-items:center;gap:8px;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r-xs);padding:7px 10px;font-size:12.5px;font-weight:550;color:var(--tx);cursor:grab;box-shadow:var(--shadow-card);min-width:0;transition:box-shadow .14s var(--ease),transform .08s var(--ease)}
.reo-item span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reo-item .ic{color:var(--tx3);flex-shrink:0}
.reo-item:hover{box-shadow:var(--shadow-hover)}
.reo-item.drag{opacity:.45;cursor:grabbing;box-shadow:var(--shadow-pop)}
.reo-list.locked .reo-item{cursor:default}
.reo-note{font-size:11.5px;color:var(--tx3);padding:2px}

/* Selector orbital de expresión */
.dial-ov{position:fixed;inset:0;z-index:300;cursor:crosshair}
.dial-ov.sticky{cursor:pointer}
.dial-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.dial-ring{transform-box:view-box;animation:dialIn .2s var(--ease-out)}
@keyframes dialIn{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:scale(1)}}
.dial-seg{transform-box:view-box;transition:transform .13s var(--ease)}
.dial-seg path{stroke:var(--sf);stroke-width:1.5;transition:filter .13s var(--ease),stroke-width .13s var(--ease)}
.dial-seg text{text-anchor:middle;dominant-baseline:central;font-size:12px;font-weight:650;pointer-events:none;letter-spacing:.01em}
.dial-seg.on{transform:scale(1.05)}
.dial-seg.on path{stroke:#fff;stroke-width:2.5;filter:brightness(1.07) saturate(1.06)}
.dial-seg.on text{font-weight:750}
.dial-hub{fill:var(--sf);stroke:var(--bd2);stroke-width:1;transform-box:view-box;animation:dialIn .2s var(--ease-out)}
.dial-lbl{text-anchor:middle;dominant-baseline:central;font-size:13px;font-weight:700;fill:var(--tx);pointer-events:none}

/* ── Menú emergente (sustituye a la lista nativa de los desplegables) ── */
.mnu{
  position:fixed;z-index:1200;min-width:150px;max-width:min(420px,calc(100vw - 16px));
  background:var(--sf);border:1px solid var(--bd);border-radius:var(--r-m);
  box-shadow:var(--shadow-pop);
  padding:5px;overflow-y:auto;overscroll-behavior:contain;
  display:flex;flex-direction:column;gap:1px;
  animation:mnuIn .14s var(--ease-out);
}
.mnu.up{transform-origin:bottom left}
.mnu.down{transform-origin:top left}
@keyframes mnuIn{from{opacity:0;transform:scale(.97) translateY(-4px)}to{opacity:1;transform:none}}
.mnu.up{animation-name:mnuInUp}
@keyframes mnuInUp{from{opacity:0;transform:scale(.97) translateY(4px)}to{opacity:1;transform:none}}
.mnu-i{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:none;border:none;border-radius:var(--r-xs);
  padding:0 9px;min-height:30px;flex-shrink:0;
  font-size:13.5px;font-weight:500;color:var(--tx);
}
.mnu-i.on{background:var(--ac);color:var(--on-ac)}
.mnu-i.on .mnu-s{color:rgba(255,255,255,.78)}
.mnu-i.dis{opacity:.4;pointer-events:none}
.mnu-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mnu-s{font-size:11.5px;color:var(--tx3);flex-shrink:0}
.mnu-c{width:15px;height:15px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--ac)}
.mnu-i.on .mnu-c{color:#fff}
.mnu-i.cur .mnu-t{font-weight:650}
.mnu-sw{width:15px;height:15px;border-radius:5px;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}

/* ── Control de cambios: el texto pintado debe caer exactamente sobre el real ──
   El textarea conserva su caja y su cursor pero pinta el texto en transparente;
   la capa .dc-back (idéntica en tipografía y métricas) lo dibuja encima y sólo
   envuelve en violeta los caracteres aún sin confirmar. Cualquier diferencia de
   maquetación entre ambas capas descoloca el cursor, así que no se toca. */
.dc-wrap{position:relative;display:block;flex:1;min-width:0}
.dc-wrap>textarea{
  display:block;width:100%;position:relative;z-index:1;
  color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--tx);
  /* Sin barra de desplazamiento ni tirador: si apareciese, el texto se ajustaría
     en una caja ~15px más estrecha que la capa pintada y el cursor caería varias
     posiciones por detrás del carácter que se ve. La altura la ajusta dcFit(). */
  overflow:hidden;resize:none;line-height:1.5;
}
.dc-wrap>textarea::selection{background:var(--foc);color:transparent;-webkit-text-fill-color:transparent}
.dc-back{
  position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden;
  white-space:pre-wrap;overflow-wrap:break-word;
  color:var(--tx);background:none;border-style:solid;border-color:transparent;
}
/* El resaltado sólo puede cambiar el color: cualquier propiedad que altere la
   maquetación desplazaría el texto pintado respecto del cursor real. */
.dc-back .dc-add{
  display:inline;width:auto;height:auto;margin:0;padding:0;border:0;
  font:inherit;letter-spacing:inherit;word-spacing:inherit;vertical-align:baseline;
  background:none;color:var(--violet);
  text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--violet) 45%,transparent);text-underline-offset:2px;
}

/* Cambio de área: la vista saliente se desvanece hacia arriba o hacia abajo
   mientras la nueva llega desde el lado contrario, siguiendo el orden del menú
   lateral. --vt-dir vale 1 al bajar por el menú y -1 al subir. */
.vt-ghost{position:fixed;overflow:hidden;pointer-events:none;z-index:1;animation:vtOut .18s cubic-bezier(.4,0,1,1) both}
.vt-ghost>.vt-ghost-in{position:absolute;left:0;right:0}
.scroll>.vt-in{animation:vtIn .42s cubic-bezier(.16,1,.3,1) .04s both}
.side-in>.vt-side{animation:vtSide .3s cubic-bezier(.16,1,.3,1) both}
@keyframes vtOut{to{opacity:0;transform:translate3d(0,calc(var(--vt-dir,1)*-14px),0) scale(.99)}}
@keyframes vtIn{from{opacity:0;transform:translate3d(0,calc(var(--vt-dir,1)*24px),0) scale(.992)}}
@keyframes vtSide{from{opacity:0;transform:translate3d(-8px,0,0)}}

/* Versión de la app: el único sitio donde vive. Sube 0.1 con cada commit, de
   vX.0 a vX.20; tras vX.20 viene v(X+1).0. */
const APP_VERSION='2.3';
const SK='bioflow_merged1';
const COLS=['#12A793','#2E86D4','#7C5CFC','#E0962B','#D0497E','#5E9920','#E5484D','#0EA5C9','#6B7682','#C0560E'];
let S={projects:[],ph:{samples:[],options:[],presets:[]},reports:[],reportPresets:{header:[],info:[],celularidad:[],estudios:[],comentario:[]},notes:[],noteCats:[],agenda:{events:[],cals:[]},agClip:null,strategies:[],area:'dashboard',theme:'light',sideOff:false,lastPid:null,lastFsid:null,lastRid:null};

/* La escritura en el almacenamiento local se agrupa. Con 558 KB de datos cada
   escritura cuesta ~9 ms y bloquea el hilo: al encadenar clics (rellenar celdas
   de la matriz, por ejemplo) se notaba. Se vuelca a los 250 ms y, en cualquier
   caso, antes de cerrar o de ocultar la ventana, así que no se pierde nada. */
let _lsTimer=null;
/* Estado del almacenamiento del navegador. Si se llena, hay que decirlo: es la
   diferencia entre perder el trabajo del día y no perderlo. */
let lsFallo=false,lsAvisado=false;
function escrituraLocal(){
  try{
    localStorage.setItem(SK,JSON.stringify(S));
    if(lsFallo){lsFallo=false;lsAvisado=false;saveIndBase();}
    return true;
  }catch(e){
    lsFallo=true;
    avisarAlmacenamientoLleno(e);
    return false;
  }
}
/* Se avisa una vez por sesión, sin bloquear, y se ofrece la salida buena:
   vincular un archivo de datos, que no tiene este límite. */
function avisarAlmacenamientoLleno(e){
  const indicador=document.getElementById('saveInd');
  if(indicador){indicador.className='save-ind err';const t=indicador.querySelector('.txt');if(t)t.textContent='Sin guardar';indicador.title='No se puede guardar en este equipo: el almacenamiento del navegador está lleno. Vincula un archivo de datos.';}
  if(lsAvisado)return;
  lsAvisado=true;
  const esCuota=e&&(e.name==='QuotaExceededError'||e.name==='NS_ERROR_DOM_QUOTA_REACHED'||e.code===22);
  try{
    toast(esCuota
      ? 'El almacenamiento de este equipo está lleno: los cambios NO se están guardando. Vincula un archivo de datos para seguir a salvo.'
      : 'No se ha podido guardar en este equipo. Vincula un archivo de datos para no perder los cambios.',
      {icon:'alert',duration:20000,actionLabel:'Vincular archivo',onAction:()=>{try{fileDialog();}catch(_){}}});
  }catch(_){}
  try{console.warn('BioFlow · fallo al guardar en localStorage:',e);}catch(_){}
}
function saveLocalNow(){
  if(_lsTimer){clearTimeout(_lsTimer);_lsTimer=null;}
  return escrituraLocal();
}
function saveLocalSoon(){
  if(_lsTimer)return;
  _lsTimer=setTimeout(function(){_lsTimer=null;escrituraLocal();},250);
}
document.addEventListener('paste',e=>{try{stPasteHandler(e);}catch(_){}});
window.addEventListener('beforeunload',saveLocalNow);
window.addEventListener('pagehide',saveLocalNow);
document.addEventListener('visibilitychange',function(){if(document.hidden)saveLocalNow();});
function save(){saveLocalSoon();scheduleFileWrite();histPush();bkSchedule();saveIndDirty();}
function load(){
  let loaded=false;
  try{const d=localStorage.getItem(SK);if(d){const p=JSON.parse(d);if(p&&typeof p==='object'){S=Object.assign(S,p);loaded=true;}}}catch(_){}

/* La ventana se considera «completa» cuando ocupa prácticamente todo el área disponible.
   Al dejar de estarlo el panel lateral se pliega solo; al volver a maximizar se recupera
   (salvo que el usuario lo haya plegado a mano). */
let _wasMax=null,_autoSideOff=false;
function updateWinMax(){
  let maxd=true;
  try{maxd=(window.outerWidth>=(screen.availWidth||window.innerWidth)-6)&&(window.outerHeight>=(screen.availHeight||window.innerHeight)-8);}catch(_){maxd=true;}
  document.body.classList.toggle('win-max',!!maxd);
  if(maxd!==_wasMax){
    if(!maxd){if(!S.sideOff){S.sideOff=true;_autoSideOff=true;applySide();}}
    else if(_autoSideOff){_autoSideOff=false;if(S.sideOff){S.sideOff=false;applySide();}}
    _wasMax=maxd;
  }
}

function proj(id){return S.projects.find(x=>x.id===id);}
function uid(){return Math.random().toString(36).slice(2,9);}
function nmu(s){return String(s==null?'':s).replace(/μ/g,'µ');}
/* ── Nombres únicos por categoría: si ya existe, se añade número de copia " (2)", " (3)"… ── */
function uniqueName(name,existing,fallback){
  let nm=nmu(name).trim()||nmu(fallback||'Sin título').trim();
  const set=new Set((existing||[]).map(x=>nmu(x).trim().toLowerCase()));
  if(!set.has(nm.toLowerCase()))return nm;
  const base=nm.replace(/\s*\(\d+\)\s*$/,'').trim()||nm;
  let n=2;while(set.has((base+' ('+n+')').toLowerCase()))n++;
  return base+' ('+n+')';
}

function fmtDate(iso){if(!iso)return'';try{return new Date(iso).toLocaleString('es-ES',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}catch(_){return iso;}}
function relTime(iso){
  if(!iso)return'';
  const diff=Date.now()-new Date(iso).getTime();
  const m=Math.round(diff/6e4),h=Math.round(diff/36e5),d=Math.round(diff/864e5);
  if(m<1)return'ahora';if(m<60)return`hace ${m} min`;if(h<24)return`hace ${h} h`;if(d<30)return`hace ${d} d`;
  return new Date(iso).toLocaleDateString('es-ES',{day:'2-digit',month:'short'});
}
function allSteps(p){const r=[];(p.steps||[]).forEach(s=>{r.push({...s,_br:false});(s.branches||[]).forEach(b=>r.push({...b,_br:true,_pid:s.id}));});return r;}
function progress(smp,p){return allSteps(p).filter(st=>smp.validations?.[st.id]).length;}
function totalSt(p){return allSteps(p).length;}
function lastActivity(s){const ds=Object.values(s.validations||{});if(!ds.length)return s.createdAt||'';return ds.sort().slice(-1)[0];}
function pctOf(s,p){const t=totalSt(p);return t>0?Math.round(progress(s,p)/t*100):0;}

function ring(pct,size,stroke){
  size=size||72;stroke=stroke||7;
  const r=(size-stroke)/2,c=+(2*Math.PI*r).toFixed(2),off=+(c*(1-Math.min(pct,100)/100)).toFixed(2);
  const col=pct>=100?'var(--teal-500)':'var(--teal-400)';
  return`<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--sf3)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})" style="transition:stroke-dashoffset .6s var(--ease)"/>
    <text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle" font-size="${Math.round(size*0.27)}" font-weight="800" fill="var(--tx)" font-family="inherit">${pct}<tspan font-size="${Math.round(size*0.16)}">%</tspan></text>
  </svg>`;
}

/* Catálogo de temas. «dark:true» marca los de fondo oscuro: además del atributo
   data-theme se pone data-dark en <html>, del que dependen las pocas reglas de
   CSS que sólo tienen sentido sobre fondo oscuro (campos hundidos, segmentos…).
   «sw» son los tres colores de la muestra que se ve en Configuración. */
const THEMES=[
  {id:'light',   name:'Claro',          desc:'Gris cálido del sistema con tarjetas blancas.', dark:false, sw:['#F0F0F3','#FFFFFF','#0E9E8A']},
  {id:'paper',   name:'Papel',          desc:'Blanco puro de extremo a extremo, sin grises.', dark:false, sw:['#FFFFFF','#FAFAFA','#0C8E7C']},
  {id:'frost',   name:'Nieve',          desc:'Base clara con acento azul.',                   dark:false, sw:['#F5F7FA','#FFFFFF','#1F6FD0']},
  {id:'sepia',   name:'Sepia',          desc:'Papel cálido para sesiones largas.',            dark:false, sw:['#F3EDE1','#FBF7EF','#9A5B21']},
  {id:'contrast',name:'Alto contraste', desc:'Blanco y negro con filetes marcados.',          dark:false, sw:['#FFFFFF','#E4E4E4','#006B5C']},
  {id:'dark',    name:'Oscuro',         desc:'Grises neutros del sistema.',                   dark:true,  sw:['#161618','#26262A','#3ED9BF']},
  {id:'midnight',name:'Medianoche',     desc:'Azul profundo con acento índigo.',              dark:true,  sw:['#0C1220','#1A2233','#6AA8FF']},
  {id:'carbon',  name:'Carbón',         desc:'Negro casi puro con acento ámbar.',             dark:true,  sw:['#0A0A0B','#19191C','#F0A93C']}
];
function themeDef(id){return THEMES.find(t=>t.id===id)||THEMES[0];}
function themeIsDark(id){return !!themeDef(id).dark;}
function applyTheme(){
  const t=themeDef(S.theme);
  S.theme=t.id;
  const r=document.documentElement;
  r.dataset.theme=t.id;
  if(t.dark)r.setAttribute('data-dark','');else r.removeAttribute('data-dark');
  const b=document.getElementById('thBtn');
  if(b)b.innerHTML=(t.dark?ic('sun',18):ic('moon',18))+`<span class="th-lbl"><i${t.dark?'':' hidden'}>Claro</i><i${t.dark?' hidden':''}>Oscuro</i></span>`;
}
function setTheme(id){if(!THEMES.some(t=>t.id===id))return;S.theme=id;save();applyTheme();if(V.area==='config')refreshConfig();}
/* El botón de la barra y el atajo alternan entre el último tema claro y el
   último oscuro que se hayan usado, no sólo entre «light» y «dark». */
function toggleTheme(){
  const dark=themeIsDark(S.theme);
  if(dark)S.lastDarkTheme=S.theme;else S.lastLightTheme=S.theme;
  const next=dark?(S.lastLightTheme||'light'):(S.lastDarkTheme||'dark');
  setTheme(themeIsDark(next)===dark?(dark?'light':'dark'):next);
}

const tipEl=document.getElementById('tip');let tipHideTimer=null;

/* ════════ RENDER ROOT ════════ */
/* Al cambiar de área la vista vieja se desvanece por encima mientras entra la
   nueva; el resto de redibujos (un filtro, un ajuste) siguen siendo instantáneos.
   Todo ocurre en el mismo instante: quien llame a renderAll encuentra ya la
   vista nueva en el DOM. */
const AREA_ORDER=['dashboard','agenda','projects','phenotype','reports','strategies','config'];
let _shownArea=null;
function renderAll(){
  const prev=_shownArea,next=V.area;_shownArea=next;
  const sc=scrollEl();
  if(!prev||prev===next||!sc||matchMedia('(prefers-reduced-motion: reduce)').matches){renderSidebar();renderMain();return;}
  document.documentElement.style.setProperty('--vt-dir',AREA_ORDER.indexOf(next)<AREA_ORDER.indexOf(prev)?-1:1);
  document.querySelectorAll('.vt-ghost').forEach(g=>g.remove());
  /* La vista saliente se saca tal cual (sin clonar, así los lienzos conservan
     su dibujo) y se deja encima, sin ids para que nadie la confunda con la nueva. */
  const r=sc.getBoundingClientRect(),g=document.createElement('div'),gi=document.createElement('div');
  g.className='vt-ghost';g.setAttribute('aria-hidden','true');
  Object.assign(g.style,{top:r.top+'px',left:r.left+'px',width:sc.clientWidth+'px',height:r.height+'px'});
  gi.className='vt-ghost-in';gi.style.top=-sc.scrollTop+'px';
  while(sc.firstChild)gi.appendChild(sc.firstChild);
  gi.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id'));
  g.appendChild(gi);sc.after(g);
  const fuera=()=>g.remove();g.addEventListener('animationend',e=>{if(e.target===g)fuera();});setTimeout(fuera,400);
  renderSidebar();renderMain();
  const nv=sc.firstElementChild;if(nv)nv.classList.add('vt-in');
  const side=document.getElementById('sideIn');
  if(side){let on=false;[...side.children].forEach(ch=>{if(ch.classList.contains('side-div')){on=true;return;}if(on&&!ch.classList.contains('side-bot'))ch.classList.add('vt-side');});}
}

          ${['all','Todas','done','Completas','prog','En progreso','pend','Pendientes'].reduce((acc,_,i,arr)=>{if(i%2)return acc;const k=arr[i],l=arr[i+1];return acc+`<button class="seg-btn${V.filter===k?' on':''}" onclick="V.filter='${k}';applySamples()">${l}</button>`;},'')}
        </div>
      </div>
      <div class="scards" id="sgrid"></div>
    </div>

    <div class="section">
      <div class="sec-hd">
        <div class="sec-ico">${ic('branch',19)}</div>
        <h2>Flujo de trabajo <span class="cnt">${p.steps.length}</span></h2>
        <span class="sec-hint">${ic('pointer',15)}pasa el cursor o arrastra una etapa</span>
        <div class="sp"></div>
        <button class="btn btn-g sm" onclick="toggleFlowCompact()" title="Vista compacta/expandida">${ic('layers',15)} ${S.flowCompact?'Expandir':'Compactar'}</button>
        <button class="btn btn-g sm" onclick="printFlow('${p.id}')" title="Imprimir o exportar a PDF">${ic('pdf',15)} Imprimir</button>
        <button class="btn btn-p sm" onclick="openModal('step','${p.id}')">${ic('plus',16)} Añadir etapa</button>
      </div>
      <div class="flow-wrap" id="flowWrap">${buildFlow(p)}</div>

  applySamples();
  initFlowDnD();
}

function refreshFlow(){const w=document.getElementById('flowWrap'),p=proj(V.pid);if(w&&p){w.innerHTML=buildFlow(p);initFlowDnD();}}
// Refresca toda la vista de proyecto (estadísticas, anillo de cabecera, flujo y tarjetas) sin cerrar el panel ni saltar el scroll
function refreshProj(){const c=scrollEl();if(!c||V.page!=='proj'||V.area!=='projects')return;const top=c.scrollTop;renderProj(c);c.scrollTop=top;}

function buildFlow(p){
  const steps=p.steps||[];
  if(!steps.length)return`<div class="flow-empty">${ic('branch',46)}<p>Este proyecto no tiene etapas todavía. Añade la primera para construir el flujo.</p><button class="btn btn-p sm" onclick="openModal('step','${p.id}')">${ic('plus',16)} Añadir etapa</button></div>`;
  const sm=p.samples||[];
  let html='<div class="flow-row">';
  steps.forEach((s,i)=>{
    if(i>0)html+=`<div class="flow-arr">${ic('chevron-right',26)}</div>`;
    const valCount=sm.filter(x=>x.validations?.[s.id]).length;
    const pct=sm.length?Math.round(valCount/sm.length*100):0;
    html+=`<div class="flow-col"><div class="fnode" data-nid="${s.id}" data-pid="${p.id}" tabindex="0" onmouseenter="showNodeTip(event,this)" onmouseleave="hideTip()" onfocus="showNodeTip(event,this)" onblur="hideTip()">
      <div class="fnode-top"><i style="width:${pct}%"></i></div>
      <div class="fnode-body">
        <div class="fnode-tagrow">${i===0?'<span class="fnode-tag">INICIO</span>':`<span class="fnode-num">${i+1}</span>`}</div>
        <div class="fnode-lbl">${esc(s.name)}</div>
        <div class="fnode-meta">${ic('circle-check',13)}${valCount}/${sm.length} validadas</div>
      </div>
    </div>`;
    html+=`<div class="fbranch-stem"></div><div class="fbranch-col">`;
    (s.branches||[]).forEach(b=>{
      html+=`<div class="fbnode" data-bid="${b.id}" data-sid="${s.id}" data-pid="${p.id}" tabindex="0" onmouseenter="showBranchTip(event,this)" onmouseleave="hideTip()" onfocus="showBranchTip(event,this)" onblur="hideTip()"><span class="bi">${ic('branch',15)}</span><span class="fbnode-lbl">${esc(b.name)}</span></div>`;
    });
    html+=`<button class="fadd-branch" onclick="openModal('branch','${p.id}','${s.id}')">${ic('fork',15)} Rama paralela</button>`;
    html+=`</div></div>`;
  });
  html+=`</div>`;return html;
}

function showNodeTip(ev,elm){
  const rect=elm.getBoundingClientRect();ev={clientX:rect.right,clientY:rect.top};
  const sid=elm.dataset.nid,pid=elm.dataset.pid,p=proj(pid);
  const idx=(p.steps||[]).findIndex(x=>x.id===sid),s=p.steps[idx];if(!s)return;
  const total=(p.samples||[]).length,validated=(p.samples||[]).filter(sm=>sm.validations?.[sid]).length;
  const pct=total?Math.round(validated/total*100):0,nb=(s.branches||[]).length;
  const brHtml=nb?`<div class="tip-bh">Ramas paralelas (${nb})</div>${s.branches.map(b=>`<div class="tip-bi">${ic('branch',13)}${esc(b.name)}</div>`).join('')}`:'';
  const first=idx===0,last=idx===p.steps.length-1;
  showTip(ev,`
    <div class="tip-hd"><div class="tip-hd-ic">${ic('circle-dot',17)}</div><div class="tip-hd-tx"><div class="tip-title">${esc(s.name)}</div><div class="tip-sub">Etapa ${idx+1} de ${p.steps.length}</div></div></div>
    <div class="tip-body">
      <div class="tip-row"><span class="tip-lbl">Muestras validadas</span><span class="tip-val">${validated} / ${total}</span></div>
      <div class="tip-mini"><i style="width:${pct}%"></i></div>
      ${brHtml}
    </div>
    <div class="tip-move"><span>Reordenar etapa</span>
      <button ${first?'disabled':''} onclick="moveStep('${pid}','${sid}',-1)" title="Mover izquierda">${ic('arrow-left',16)}</button>
      <button ${last?'disabled':''} onclick="moveStep('${pid}','${sid}',1)" title="Mover derecha">${ic('arrow-right',16)}</button>
    </div>
    <div class="tip-menu">
      <button class="tip-mi" onclick="hideTip();openModal('step','${pid}','${sid}')">${ic('edit',17)} Editar etapa</button>
      <button class="tip-mi" onclick="hideTip();openModal('branch','${pid}','${sid}')">${ic('fork',17)} Añadir rama paralela</button>
      <button class="tip-mi dng" onclick="hideTip();delStep('${pid}','${sid}')">${ic('trash',17)} Eliminar etapa</button>
    </div>`);
}
function showBranchTip(ev,elm){
  const rect=elm.getBoundingClientRect();ev={clientX:rect.right,clientY:rect.top};
  const bid=elm.dataset.bid,sid=elm.dataset.sid,pid=elm.dataset.pid,p=proj(pid);
  const st=(p.steps||[]).find(x=>x.id===sid),b=(st?.branches||[]).find(x=>x.id===bid);if(!b)return;
  showTip(ev,`
    <div class="tip-hd"><div class="tip-hd-ic">${ic('branch',17)}</div><div class="tip-hd-tx"><div class="tip-title">${esc(b.name)}</div><div class="tip-sub">Rama de ${esc(st?.name||'')}</div></div></div>
    <div class="tip-menu">
      <button class="tip-mi" onclick="hideTip();openModal('editBranch','${pid}','${sid}','${bid}')">${ic('edit',17)} Editar rama</button>
      <button class="tip-mi dng" onclick="hideTip();delBranch('${pid}','${sid}','${bid}')">${ic('trash',17)} Eliminar rama</button>
    </div>`);
}
function moveStep(pid,sid,dir){
  const p=proj(pid),arr=p.steps,i=arr.findIndex(x=>x.id===sid),j=i+dir;
  if(i<0||j<0||j>=arr.length)return;
  [arr[i],arr[j]]=[arr[j],arr[i]];save();refreshFlow();hideTip();
}

/* ════════ SAMPLES GRID ════════ */
function applySamples(){
  const p=proj(V.pid);if(!p)return;
  const sr=document.getElementById('srch');if(sr)V.q=sr.value;
  const q=(V.q||'').toLowerCase(),tot=totalSt(p);
  let list=(p.samples||[]).filter(s=>s.code.toLowerCase().includes(q)||(s.desc||'').toLowerCase().includes(q));
  list=list.filter(s=>{const pr=progress(s,p);if(V.filter==='done')return tot>0&&pr===tot;if(V.filter==='prog')return pr>0&&(pr<tot||tot===0);if(V.filter==='pend')return pr===0;return true;});
  if(V.sort==='code')list.sort((a,b)=>a.code.localeCompare(b.code,'es',{numeric:true}));
  else if(V.sort==='progress')list.sort((a,b)=>pctOf(b,p)-pctOf(a,p));
  else if(V.sort==='progress-asc')list.sort((a,b)=>pctOf(a,p)-pctOf(b,p));
  else list.sort((a,b)=>(lastActivity(b)||'').localeCompare(lastActivity(a)||''));
  document.querySelectorAll('.seg-btn').forEach(b=>{const map={Todas:'all',Completas:'done','En progreso':'prog',Pendientes:'pend'};b.classList.toggle('on',map[b.textContent.trim()]===V.filter);});
  if(!S.projView)S.projView={};S.projView[V.pid]={filter:V.filter,sort:V.sort};saveLocalNow();
  const g=document.getElementById('sgrid');if(g)g.innerHTML=renderSCards(p,list);
}
function renderSCards(p,samples){
  if(!samples.length)return`<div class="empty"><div class="empty-ic">${ic('flask-off',40)}</div><h3>Sin muestras</h3><p>No hay muestras que coincidan con el filtro o la búsqueda.</p></div>`;
  const tot=totalSt(p),aSt=allSteps(p);
  return samples.map(s=>{
    const done=progress(s,p),pct=tot>0?Math.round(done/tot*100):0;
    const badge=pct===100&&tot>0?'<span class="badge b-done">Completa</span>':done>0?'<span class="badge b-prog">En progreso</span>':'<span class="badge b-pend">Pendiente</span>';
    const strip=aSt.map(st=>{const v=s.validations?.[st.id];return`<span class="${v?'d':''}${st._br?' br':''}" title="${esc(st.name)}${v?' ✓':' — pendiente'}"></span>`;}).join('');
    const la=lastActivity(s);
    return`<div class="scard" onclick="openSample('${s.id}')">
      <div class="sc-top">
        <div class="sc-info">
          <div class="sc-hd"><span class="sc-code">${esc(s.code)}</span>${badge}${dueBadge(s,p)}
            <div class="sc-acts">
              <button class="sc-ibtn" title="Editar muestra" onclick="event.stopPropagation();openModal('sample','${p.id}','${s.id}')">${ic('edit',18)}</button>
              <button class="sc-ibtn" title="Duplicar muestra" onclick="event.stopPropagation();dupSample('${p.id}','${s.id}')">${ic('copy',18)}</button>
              <button class="sc-ibtn" title="Eliminar muestra" onclick="event.stopPropagation();delSample('${p.id}','${s.id}')">${ic('trash',18)}</button>
            </div>
          </div>
          <div class="sc-desc">${esc(s.desc||'Sin descripción')}</div>
          <div class="sc-meta">${ic('list-check',15)}<b>${done}</b>/${tot} etapas${la?`<span style="opacity:.4">·</span>${ic('clock',15)}${relTime(la)}`:''}${(()=>{const n=phLinksFor(p.id,s.id).length;return n?`<span style="opacity:.4">·</span>${ic('flask',15)}${n} fenotipo${n>1?'s':''}`:'';})()}</div>
        </div>
        ${ring(pct,68,7)}
      </div>
      <div class="strip">${strip}</div>
    </div>`;
  }).join('');
}

function openSample(sid){V.sid=sid;renderDrawer();}
function openSampleFrom(pid,sid){V.area='projects';S.area='projects';V.page='proj';V.pid=pid;V.sid=sid;V.filter='all';V.sort='recent';V.q='';S.lastPid=pid;save();renderAll();setTimeout(()=>renderDrawer(),40);}
function closeDrawer(){const r=document.getElementById('drawerRoot');r.innerHTML='';V.sid=null;}
function renderDrawer(){
  const p=proj(V.pid),s=p&&(p.samples||[]).find(x=>x.id===V.sid);
  const r=document.getElementById('drawerRoot');
  if(!p||!s){r.innerHTML='';return;}
  const tot=totalSt(p),done=progress(s,p),pct=tot>0?Math.round(done/tot*100):0;

  function stepRow(st,br){
    const v=s.validations?.[st.id];
    return`<div class="dtl-step ${v?'done':''}">
      <div class="dtl-circ ${v?'done':'pend'}">${v?ic('check',17):ic('point',17)}</div>
      <div class="dtl-body2">
        <div class="dtl-name">${esc(st.name)}${br?'<span class="dtl-br-tag">rama</span>':''}</div>
        <div class="dtl-sub ${v?'done-c':''}">${v?`${ic('calendar-check',15)}${fmtDate(v)} · ${relTime(v)}`:`${ic('clock',15)}Pendiente`}</div>
        ${v?`<button class="btn btn-unv sm" onclick="toggleVal('${p.id}','${s.id}','${st.id}',false)">${ic('x',15)} Desvalidar</button>`:`<button class="btn btn-val sm" onclick="toggleVal('${p.id}','${s.id}','${st.id}',true)">${ic('check',15)} Validar</button>`}
      </div>
    </div>`;
  }
  let stepsH='';
  (p.steps||[]).forEach(st=>{stepsH+=stepRow(st,false);if(st.branches?.length){stepsH+=`<div class="bwrap">`;st.branches.forEach(b=>stepsH+=stepRow(b,true));stepsH+=`</div>`;}});

  const linkedPh=phLinksFor(p.id,s.id);
  const phSection=`<div class="dl-sec">
    <div class="dl-sec-hd">${ic('flask',16)} Fenotipos vinculados <span class="cnt">${linkedPh.length}</span>
      <button class="btn btn-g sm" style="margin-left:auto" onclick="openLinkPhenoModal('${p.id}','${s.id}')">${ic('link',14)} Vincular</button></div>
    ${linkedPh.length?linkedPh.map(f=>{const cls=phClassifySample(f);const nd=f.markers.filter(m=>cls[m.id]==='diff').length;
      return `<button class="linked-ph" onclick="gotoPheno('${f.id}')">${ic('flask',15)}<span class="lp-name">${esc(f.title||'Sin título')}</span><span class="lp-meta">${f.populations.length} pobl. · ${nd} distinguen</span>${ic('chevron-right',15)}</button>`;}).join('')
      :'<div class="dl-empty">Ninguno. Vincula o crea un fenotipo para esta muestra.</div>'}
  </div>`;

  r.innerHTML=`<div class="drawer-ov show" onclick="closeDrawer()"></div>
  <aside class="drawer show">
    <div class="drawer-hd">
      <span class="phead-dot" style="background:${p.color}"></span>
      <span class="drawer-code">${esc(s.code)}</span>
      ${dueBadge(s,p)}
      <button class="icon-btn" title="Editar muestra" onclick="openModal('sample','${p.id}','${s.id}')">${ic('edit',19)}</button>
      <button class="icon-btn" title="Duplicar muestra" onclick="dupSample('${p.id}','${s.id}')">${ic('copy',19)}</button>
      <button class="icon-btn" title="Eliminar muestra" onclick="delSample('${p.id}','${s.id}')">${ic('trash',19)}</button>
      <button class="icon-btn" title="Cerrar" onclick="closeDrawer()">${ic('x',20)}</button>
    </div>
    <div class="drawer-body">
      ${s.desc?`<div class="drawer-desc">${esc(s.desc)}</div>`:''}
      <div class="dtl-hero">
        ${ring(pct,108,10)}
        <div class="mini">
          <div><span class="mic" style="background:var(--dn-bg);color:var(--dn-tx)">${ic('circle-check',17)}</span><b>${done}</b> validadas</div>
          <div><span class="mic" style="background:var(--pd-bg);color:var(--pd-tx)">${ic('clock',17)}</span><b>${tot-done}</b> pendientes</div>
        </div>
      </div>
      ${tot>0?`<div class="bulk">
        <button class="btn btn-val sm" onclick="validateAll('${p.id}','${s.id}')" ${done===tot?'disabled style="opacity:.5"':''}>${ic('checks',15)} Validar todo</button>
        <button class="btn btn-g sm" onclick="resetSample('${p.id}','${s.id}')" ${done===0?'disabled style="opacity:.5"':''}>${ic('rotate',15)} Reiniciar</button>
      </div>`:''}
      <div>${stepsH||'<div class="empty"><div class="empty-ic">'+ic('branch',40)+'</div><p>Define etapas en el flujo para empezar a validar.</p></div>'}</div>
      ${phSection}
    </div>
  </aside>`;
}

function toggleVal(pid,sid,stepId,validate){
  const p=proj(pid),s=(p.samples||[]).find(x=>x.id===sid);
  if(!s.validations)s.validations={};
  if(validate)s.validations[stepId]=new Date().toISOString();else delete s.validations[stepId];
  save();refreshProj();renderDrawer();
}
function validateAll(pid,sid){
  const p=proj(pid),s=(p.samples||[]).find(x=>x.id===sid);
  if(!s.validations)s.validations={};const now=new Date().toISOString();
  allSteps(p).forEach(st=>{if(!s.validations[st.id])s.validations[st.id]=now;});
  save();refreshProj();renderDrawer();toast('Todas las etapas validadas',{icon:'checks'});
}
function resetSample(pid,sid){
  const p=proj(pid),s=(p.samples||[]).find(x=>x.id===sid);
  const snap=JSON.parse(JSON.stringify(s.validations||{}));s.validations={};save();refreshProj();renderDrawer();
  toast('Validaciones reiniciadas',{icon:'rotate',actionLabel:'Deshacer',onAction:()=>{s.validations=snap;save();refreshProj();renderDrawer();}});
}

/* ════════ MODALS ════════ */
function closeModal(){try{menuClose();}catch(_){}document.getElementById('mroot').innerHTML='';}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(document.getElementById('mroot').innerHTML){closeModal();}else if(document.getElementById('drawerRoot').innerHTML){closeDrawer();}return;}
  const modalOpen=!!document.getElementById('mroot').innerHTML;
  const typing=/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement?.tagName||'');
  if(e.key==='Enter'&&modalOpen){const ov=document.querySelector('.modal-ov');if(ov){const pr=ov.querySelector('.btn-p');if(pr&&document.activeElement?.tagName!=='SELECT'){e.preventDefault();pr.click();}}return;}
  if(modalOpen||typing)return;
  if(e.key==='/'){const sr=document.getElementById('srch')||document.getElementById('gsrch');if(sr){e.preventDefault();sr.focus();}}
  else if(e.key.toLowerCase()==='n'){if(V.page==='proj')openModal('sample',V.pid);else openModal('proj');}
  else if(e.key.toLowerCase()==='t')toggleTheme();
});

/* ════════ FILE SYNC (Electron nativo  ·  o File System Access API en navegador) ════════ */
const DESKTOP = !!(window.desktop && window.desktop.read);   // expuesto por preload.js en la app de escritorio
const fileSupported = DESKTOP || ('showSaveFilePicker' in window);
let fileHandle=null,fileLinked=false,filePending=false,fileWriteTimer=null,fileBusy=false,fileName='';
const IDB_DB='bioflow_fs',IDB_STORE='handles',IDB_KEY='dataFile';

function idb(){return new Promise((res,rej)=>{const r=indexedDB.open(IDB_DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(IDB_STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbSet(k,v){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
async function idbGet(k){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction(IDB_STORE,'readonly');const rq=tx.objectStore(IDB_STORE).get(k);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});}
async function idbDel(k){const db=await idb();return new Promise((res)=>{const tx=db.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).delete(k);tx.oncomplete=()=>res();});}
async function verifyPerm(handle,write){const opts={mode:write?'readwrite':'read'};try{if((await handle.queryPermission(opts))==='granted')return true;if((await handle.requestPermission(opts))==='granted')return true;}catch(_){}return false;}

function migrateProjects(){
  (S.projects||[]).forEach(p=>{
    if(!Array.isArray(p.steps))p.steps=[];
    if(!Array.isArray(p.samples))p.samples=[];
    p.steps.forEach(s=>{if(!Array.isArray(s.branches))s.branches=[];});
    p.samples.forEach(sm=>{if(!sm.validations||typeof sm.validations!=='object')sm.validations={};});
  });
}

async function readFile(){
  if(DESKTOP){const r=await window.desktop.read();if(r&&r.ok&&r.text&&r.text.trim()){applyCombined(JSON.parse(r.text));return true;}return false;}
  const f=await fileHandle.getFile();const txt=await f.text();
  if(!txt.trim())return false;
  applyCombined(JSON.parse(txt));
  return true;
}
async function writeFile(){
  if(!fileLinked||fileBusy)return;
  fileBusy=true;
  try{
    if(DESKTOP){const r=await window.desktop.write(JSON.stringify(combinedPayload(),null,2));if(!r||!r.ok)throw new Error('write');}
    else{if(!fileHandle){fileBusy=false;return;}const w=await fileHandle.createWritable();await w.write(JSON.stringify(combinedPayload(),null,2));await w.close();}
    saveIndSaved();
  }catch(e){fileLinked=false;updateFileBtn();saveIndErr();toast('No se pudo escribir en el archivo vinculado',{icon:'alert'});}
  fileBusy=false;
}
function scheduleFileWrite(){if(!fileLinked)return;clearTimeout(fileWriteTimer);fileWriteTimer=setTimeout(writeFile,500);}

// Autovinculación al arrancar: si hay un archivo configurado se vincula y carga solo.
async function restoreFileLink(){
  if(DESKTOP){
    try{
      const cfg=await window.desktop.getConfig();
      if(cfg&&cfg.dataFile){
        const r=await window.desktop.read();
        if(r&&r.ok){fileLinked=true;fileName=cfg.dataFile;if(r.text&&r.text.trim()){try{applyCombined(JSON.parse(r.text));}catch(_){}}else{await writeFile();}}
        // configurado pero ilegible (movido/borrado): se queda sin vincular y se pedirá al arrancar
      }
    }catch(_){}
    return;
  }
  if(!('showSaveFilePicker' in window))return;
  let handle;try{handle=await idbGet(IDB_KEY);}catch(_){}
  if(!handle)return;
  fileHandle=handle;
  let perm='prompt';try{perm=await handle.queryPermission({mode:'readwrite'});}catch(_){}
  if(perm==='granted'){fileLinked=true;try{await readFile();}catch(_){}}
  else{filePending=true;}
}

/* Opciones de los selectores de archivo: abren en la carpeta del último archivo
   usado (normalmente la de la app) y, si no lo hay, en la última carpeta que
   se eligió para BioFlow. */
function filePickerOpts(extra){
  const o=Object.assign({id:'bioflow-datos',types:[{description:'Datos BioFlow',accept:{'application/json':['.json']}}]},extra||{});
  if(fileHandle)o.startIn=fileHandle;
  return o;
}
async function filePicker(fn,extra){
  try{return await window[fn](filePickerOpts(extra));}
  catch(e){
    /* Un archivo recordado que ya no existe hace fallar «startIn»: se reintenta sin él. */
    if(e&&e.name!=='AbortError'&&fileHandle){const o=filePickerOpts(extra);delete o.startIn;return await window[fn](o);}
    throw e;
  }
}

async function linkNewFile(){
  closeModal();
  if(DESKTOP){
    let r;try{r=await window.desktop.pickCreate();}catch(_){}
    if(!r||!r.ok){if(r&&r.canceled)return;toast('No se pudo crear el archivo.',{icon:'alert'});return;}
    fileLinked=true;filePending=false;fileName=r.path;
    if(r.text&&r.text.trim()){try{applyCombined(JSON.parse(r.text));}catch(_){}}
    await writeFile();save();renderAll();updateFileBtn();updateFbBtn();
    toast('Archivo vinculado. Tus datos se guardan ahí automáticamente.',{icon:'circle-check'});
    return;
  }
  try{
    const handle=await filePicker('showSaveFilePicker',{suggestedName:'bioflow-datos.json'});
    fileHandle=handle;fileLinked=true;filePending=false;await idbSet(IDB_KEY,handle);await writeFile();updateFileBtn();
    toast('Archivo vinculado. Tus datos se guardan ahí automáticamente.',{icon:'circle-check'});
  }catch(e){if(e&&e.name!=='AbortError')toast('No se pudo crear el archivo. Si abriste la app con doble clic, prueba a abrirla desde Chrome/Edge.',{icon:'alert'});}
}
async function openExistingFile(silent){
  closeModal();
  if(DESKTOP){
    let r;try{r=await window.desktop.pickOpen();}catch(_){}
    if(!r||!r.ok){if(r&&r.canceled)return;toast('No se pudo abrir el archivo.',{icon:'alert'});return;}
    fileLinked=true;filePending=false;fileName=r.path;
    let ok=false;
    if(r.text&&r.text.trim()){try{applyCombined(JSON.parse(r.text));ok=true;}catch(_){toast('El archivo no es un JSON válido.',{icon:'alert'});}}
    else{await writeFile();}
    save();renderAll();updateFileBtn();updateFbBtn();

    let ok=false;try{ok=await readFile();}catch(_){}

    renderAll();updateFileBtn();updateFbBtn();

  }catch(e){if(e&&e.name!=='AbortError')toast('No se pudo abrir el archivo.',{icon:'alert'});}
}
async function unlinkFile(){
  closeModal();fileLinked=false;filePending=false;fileName='';
  if(DESKTOP){try{await window.desktop.unlink();}catch(_){}}
  else{fileHandle=null;try{await idbDel(IDB_KEY);}catch(_){}}

}
async function reconnectFile(){
  if(!fileHandle){fileDialog();return;}
  if(await verifyPerm(fileHandle,true)){
    closeModal();fileLinked=true;filePending=false;
    let ok=false;try{ok=await readFile();}catch(_){}
